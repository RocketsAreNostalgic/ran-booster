name: Fix deployment coordinator brace once

on:
  push:
    branches:
      - chore/adopt-ran-quality-standards-phase-c

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Repair the missing matchingPackages loop brace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('RAN/Deployment/DeploymentCoordinator.php')
          text = path.read_text()
          old = "\t\t\t\t}\n\t\t}\n\t\treturn $matches;"
          new = "\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn $matches;"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one matchingPackages brace site')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l RAN/Deployment/DeploymentCoordinator.php
      - name: Commit repair and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAN/Deployment/DeploymentCoordinator.php
          git rm .github/workflows/fix-deployment-coordinator-brace-once.yml
          git commit -m "fix: close deployment package loop"
          git push origin HEAD:chore/adopt-ran-quality-standards-phase-c
