name: Fix PR 139 review findings

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/fix-pr139-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out exact topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Prove the branch has not moved underneath this repair
        shell: bash
        run: |
          set -euo pipefail
          base=c01f3beb23e7ca2c2e7680080bae00bc0ad35df6
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = '.github/workflows/fix-pr139-review.yml'

      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          def replace_method(path: str, name: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              pattern = re.compile(
                  rf"\tpublic function {re.escape(name)}\(\): void \{{.*?(?=\n\tpublic function |\n\t/\*\*)",
                  re.S,
              )
              text, count = pattern.subn(replacement.rstrip(), text, count=1)
              if count != 1:
                  raise SystemExit(f"{path}: method {name} replacement count {count}")
              file.write_text(text)

          # 1. Make every shipped surface carry an explicit file/directory kind.
          policy_path = Path('runtime-packaging-policy.json')
          policy = json.loads(policy_path.read_text())
          expected_surfaces = {
              'ran/updater-support': [('LICENSE', 'file'), ('src', 'directory')],
              'ran/wp-branch-updater': [('LICENSE', 'file'), ('bootstrap.php', 'file'), ('src', 'directory')],
              'ran/wp-release-updater': [
                  ('LICENSE', 'file'),
                  ('bootstrap.php', 'file'),
                  ('runtime-copy.json', 'file'),
                  ('runtime.php', 'file'),
                  ('src', 'directory'),
              ],
          }
          if policy.get('schema') != 'ran-booster-runtime-packaging' or policy.get('schema_version') != 1:
              raise SystemExit('unexpected runtime packaging schema')
          for record in policy.get('packages', []):
              name = record.get('name')
              expected = expected_surfaces.get(name)
              if expected is None or record.get('surfaces') != [path for path, _ in expected]:
                  raise SystemExit(f'unexpected current surfaces for {name}')
              record['surfaces'] = [
                  {'path': path, 'kind': kind}
                  for path, kind in expected
              ]
          if set(expected_surfaces) != {record.get('name') for record in policy.get('packages', [])}:
              raise SystemExit('unexpected package set in runtime packaging policy')
          policy_path.write_text(json.dumps(policy, indent=4) + '\n')

          # 2. Validate direct-child surface records and project path:kind tuples.
          verifier = Path('scripts/verify-runtime-dependencies.php')
          text = verifier.read_text()
          surface_pattern = re.compile(
              r"\t\$validatedSurfaces = array\(\);\n\tforeach \( \$surfaces as \$surface \) \{.*?\n\t\}\n\n\tif \( 'neutral-updater' === \$buildRole \) \{",
              re.S,
          )
          surface_block = r'''	$validatedSurfaces = array();
	$seenSurfaces      = array();
	foreach ( $surfaces as $surface ) {
		if ( ! is_array( $surface ) ) {
			fwrite( STDERR, "Runtime packaging policy contains an invalid surface record.\n" );
			exit( 1 );
		}

		$surfaceKeys = array_keys( $surface );
		sort( $surfaceKeys );
		if ( array( 'kind', 'path' ) !== $surfaceKeys ) {
			fwrite( STDERR, "Runtime packaging policy surface record contains an unsupported field.\n" );
			exit( 1 );
		}

		$surfacePath = $surface['path'] ?? null;
		$surfaceKind = $surface['kind'] ?? null;
		if (
			! is_string( $surfacePath )
			|| 1 !== preg_match( '/^[A-Za-z0-9._-]+$/D', $surfacePath )
			|| ! is_string( $surfaceKind )
			|| ! in_array( $surfaceKind, array( 'directory', 'file' ), true )
		) {
			fwrite( STDERR, "Runtime packaging policy contains an unsafe surface record.\n" );
			exit( 1 );
		}

		if ( isset( $seenSurfaces[ $surfacePath ] ) ) {
			fwrite( STDERR, "Runtime packaging policy contains a duplicate surface path.\n" );
			exit( 1 );
		}
		$validatedSurfaces[]         = array(
			'path' => $surfacePath,
			'kind' => $surfaceKind,
		);
		$seenSurfaces[ $surfacePath ] = true;
	}

	if ( 'neutral-updater' === $buildRole ) {'''
          text, count = surface_pattern.subn(surface_block, text, count=1)
          if count != 1:
              raise SystemExit(f'verifier surface validation replacement count {count}')
          old = "\tif ( $packaging ) {\n\t\tprintf("
          new = """\tif ( $packaging ) {\n\t\t$surfaceProjection = array();\n\t\tforeach ( $identity['surfaces'] as $surface ) {\n\t\t\t$surfaceProjection[] = $surface['path'] . ':' . $surface['kind'];\n\t\t}\n\n\t\tprintf("""
          if text.count(old) != 1:
              raise SystemExit('verifier packaging projection insertion target drifted')
          text = text.replace(old, new, 1)
          if text.count("implode( ',', $identity['surfaces'] )") != 1:
              raise SystemExit('verifier surface projection target drifted')
          text = text.replace("implode( ',', $identity['surfaces'] )", "implode( ',', $surfaceProjection )", 1)
          verifier.write_text(text)

          # Shared fail-closed shell fragments. Nested surfaces are deliberately disallowed
          # by the policy schema, so checking the package root, direct child, and directory
          # descendants covers every possible symlink ancestor.
          validate_loop_build = r'''for index in "${!package_roots[@]}"; do
	installed_package=${package_installed[$index]}
	IFS=',' read -r -a surface_specs <<< "${package_surfaces[$index]}"
	[[ -d "$installed_package" && ! -L "$installed_package" ]] \
		|| fail "locked runtime package root is missing or symbolic: $installed_package"
	for surface_spec in "${surface_specs[@]}"; do
		surface=${surface_spec%%:*}
		surface_kind=${surface_spec#*:}
		[[ -n "$surface" && -n "$surface_kind" && "$surface" != "$surface_spec" ]] \
			|| fail 'runtime packaging projection contains an invalid surface record.'
		required_path="$installed_package/$surface"
		[[ ! -L "$required_path" ]] \
			|| fail "runtime dependency surface must not be symbolic: $required_path"
		case "$surface_kind" in
			file)
				[[ -f "$required_path" ]] \
					|| fail "locked runtime package file surface is missing or changed kind: $required_path"
				;;
			directory)
				[[ -d "$required_path" ]] \
					|| fail "locked runtime package directory surface is missing or changed kind: $required_path"
				if find "$required_path" -type l -print -quit | grep -q .; then
					fail 'runtime dependency directory surface must not contain symbolic links.'
				fi
				;;
			*)
				fail "runtime packaging projection contains an unsupported surface kind: $surface_kind"
				;;
		esac
	done
done'''

          validate_loop_verify = validate_loop_build.replace(
              'locked runtime package root is missing or symbolic:',
              'committed lock runtime package root is missing or symbolic:'
          )

          build = Path('scripts/build-release.sh')
          text = build.read_text()
          start = text.index('for index in "${!package_roots[@]}"; do', text.index('COMPOSER_HOME="$composer_home" composer install'))
          end = text.index('\n\ngit archive \\', start)
          text = text[:start] + validate_loop_build + text[end:]
          copy_start = text.index('for index in "${!package_roots[@]}"; do', text.index('git archive \\'))
          copy_end = text.index('\n\n# This positive provenance marker', copy_start)
          copy_block = r'''for index in "${!package_roots[@]}"; do
	package_root=${package_roots[$index]}
	installed_package=${package_installed[$index]}
	IFS=',' read -r -a surface_specs <<< "${package_surfaces[$index]}"
	mkdir -p "$stage_root/$package_root"
	for surface_spec in "${surface_specs[@]}"; do
		surface=${surface_spec%%:*}
		surface_kind=${surface_spec#*:}
		target="$stage_root/$package_root/$surface"
		mkdir -p "$(dirname -- "$target")"
		case "$surface_kind" in
			file)
				cp -- "$installed_package/$surface" "$target"
				;;
			directory)
				cp -R -- "$installed_package/$surface" "$target"
				;;
			*)
				fail "runtime packaging projection contains an unsupported surface kind: $surface_kind"
				;;
		esac
	done
done'''
          text = text[:copy_start] + copy_block + text[copy_end:]
          build.write_text(text)

          verify = Path('scripts/verify-release.sh')
          text = verify.read_text()
          start = text.index('for index in "${!package_roots[@]}"; do', text.index('COMPOSER_HOME="$composer_home" composer install'))
          end = text.index('\n\narchive_paths=', start)
          text = text[:start] + validate_loop_verify + text[end:]

          append_start = text.index('append_runtime_files() {')
          append_end = text.index('\nfor index in "${!package_roots[@]}"; do', append_start)
          append_block = r'''append_runtime_files() {
	local installed_root=$1
	local package_root=$2
	local surfaces_csv=$3
	local surface_spec surface_path surface_kind
	local -a surface_specs
	IFS=',' read -r -a surface_specs <<< "$surfaces_csv"
	for surface_spec in "${surface_specs[@]}"; do
		surface_path=${surface_spec%%:*}
		surface_kind=${surface_spec#*:}
		case "$surface_kind" in
			directory)
				find "$installed_root/$surface_path" -type f -print
				;;
			file)
				printf '%s\n' "$installed_root/$surface_path"
				;;
			*)
				fail "runtime packaging projection contains an unsupported surface kind: $surface_kind"
				;;
		esac
	done | sed "s#^$installed_root/#ran-booster/$package_root/#" >> "$expected_files"
}'''
          text = text[:append_start] + append_block + text[append_end:]

          compare_start = text.index('compare_runtime_package() {')
          compare_end = text.index('\nfor index in "${!package_roots[@]}"; do', compare_start)
          compare_block = r'''compare_runtime_package() {
	local installed_root=$1
	local archived_root=$2
	local surfaces_csv=$3
	local surface_spec surface_path surface_kind package_file relative_package_file
	local -a surface_specs
	IFS=',' read -r -a surface_specs <<< "$surfaces_csv"
	for surface_spec in "${surface_specs[@]}"; do
		surface_path=${surface_spec%%:*}
		surface_kind=${surface_spec#*:}
		case "$surface_kind" in
			directory)
				while IFS= read -r package_file || [[ -n "$package_file" ]]; do
					[[ -n "$package_file" ]] || continue
					relative_package_file=${package_file#"$installed_root/"}
					cmp -s "$package_file" "$archived_root/$relative_package_file" \
						|| fail "archived runtime dependency $relative_package_file does not match the committed Composer lock."
				done < <(find "$installed_root/$surface_path" -type f -print | LC_ALL=C sort)
				;;
			file)
				cmp -s "$installed_root/$surface_path" "$archived_root/$surface_path" \
					|| fail "archived runtime dependency $surface_path does not match the committed Composer lock."
				;;
			*)
				fail "runtime packaging projection contains an unsupported surface kind: $surface_kind"
				;;
		esac
	done
}'''
          text = text[:compare_start] + compare_block + text[compare_end:]
          verify.write_text(text)

          # 3. Treat the policy as an exact-main evidence input, and materialize the
          # neutral updater from the exact validated policy+lock projection in both
          # fresh-build jobs instead of duplicating package identity in YAML.
          workflow = Path('.github/workflows/quality.yml')
          text = workflow.read_text()
          trust_old = "              composer.lock \\\n              package.json \\\n"
          trust_new = "              composer.lock \\\n              runtime-packaging-policy.json \\\n              package.json \\\n"
          if text.count(trust_old) != 1:
              raise SystemExit('quality trust-path insertion target drifted')
          text = text.replace(trust_old, trust_new, 1)

          setup_php = """          - name: Set up PHP\n            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2\n            with:\n                php-version: '8.2'\n                coverage: none\n                tools: composer:v2, wp-cli:2.12.0\n\n"""
          if text.count(setup_php) != 1:
              raise SystemExit('quality PHP setup block drifted')
          text = text.replace(setup_php, '', 1)
          quality_index = text.index('\n  quality:\n')
          quality_checkout_index = text.index('          - name: Check out locked neutral updater source\n', quality_index)
          text = text[:quality_checkout_index] + setup_php + text[quality_checkout_index:]

          step_pattern = re.compile(
              r"(?ms)^(?P<indent>\s*)- name: Check out locked neutral updater source\n(?P<header>.*?^\s*run: \|\n)(?P<body>.*?)(?=^(?P=indent)- name: )"
          )
          matches = list(step_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'expected two neutral-updater checkout steps, found {len(matches)}')

          def dynamic_checkout(match: re.Match[str]) -> str:
              indent = match.group('indent')
              prefix = indent + '- name: Check out locked neutral updater source\n' + match.group('header')
              body_indent = indent + '    '
              lines = [
                  'set -euo pipefail',
                  'source_commit="$RAN_SOURCE_COMMIT"',
                  'if [[ "$GITHUB_EVENT_NAME" == push ]]; then',
                  '  source_commit="$GITHUB_SHA"',
                  'fi',
                  '',
                  'lock_file="$(mktemp)"',
                  'policy_file="$(mktemp)"',
                  'verifier_file="$(mktemp)"',
                  "trap 'rm -f \"$lock_file\" \"$policy_file\" \"$verifier_file\"' EXIT",
                  'git show "${source_commit}:composer.lock" > "$lock_file"',
                  'git show "${source_commit}:runtime-packaging-policy.json" > "$policy_file"',
                  'git show "${source_commit}:scripts/verify-runtime-dependencies.php" > "$verifier_file"',
                  'neutral_record="$(' ,
                  '  php "$verifier_file" --packaging "$lock_file" "$policy_file" \\',
                  "    | awk -F '\\t' '$7 == \"neutral-updater\" { print }'",
                  ')"',
                  "IFS=$'\\t' read -r package_name package_version updater_commit package_repository package_root surfaces build_role <<< \"$neutral_record\"",
                  '[[ "$build_role" == neutral-updater ]]',
                  '[[ "$package_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]',
                  '[[ "$updater_commit" =~ ^[0-9a-f]{40}$ ]]',
                  '',
                  'updater_slug="${package_repository#*/}"',
                  'updater_repository="$(dirname "$GITHUB_WORKSPACE")/$updater_slug"',
                  'remote_url="https://github.com/${package_repository}.git"',
                  'test ! -e "$updater_repository"',
                  'git init --quiet "$updater_repository"',
                  'git -C "$updater_repository" remote add origin "$remote_url"',
                  'git -C "$updater_repository" fetch --quiet --no-tags --depth=1 origin "$updater_commit"',
                  'git -C "$updater_repository" checkout --quiet --detach FETCH_HEAD',
                  'test "$(git -C "$updater_repository" rev-parse HEAD)" = "$updater_commit"',
              ]
              return prefix + ''.join(body_indent + line + '\n' for line in lines)

          text = step_pattern.sub(dynamic_checkout, text)

          readback_pattern = re.compile(
              r"(?ms)^          - name: Read back the neutral updater runtime contract\n.*?(?=^          - name: Prove database activation and storage\n)"
          )
          readback = r'''          - name: Read back the neutral updater runtime contract
            shell: bash
            env:
                RAN_SOURCE_COMMIT: ${{ needs.runtime-archive.outputs.source-commit }}
            run: |
              set -euo pipefail
              source_commit="$RAN_SOURCE_COMMIT"
              lock_file="$(mktemp)"
              policy_file="$(mktemp)"
              verifier_file="$(mktemp)"
              trap 'rm -f "$lock_file" "$policy_file" "$verifier_file"' EXIT
              git show "${source_commit}:composer.lock" > "$lock_file"
              git show "${source_commit}:runtime-packaging-policy.json" > "$policy_file"
              git show "${source_commit}:scripts/verify-runtime-dependencies.php" > "$verifier_file"
              neutral_record="$(
                php "$verifier_file" --packaging "$lock_file" "$policy_file" \
                  | awk -F '\t' '$7 == "neutral-updater" { print }'
              )"
              IFS=$'\t' read -r package_name package_version package_reference package_repository package_root surfaces build_role <<< "$neutral_record"
              [[ "$build_role" == neutral-updater ]]
              expected_version=${package_version#v}
              RAN_NEUTRAL_UPDATER_ROOT="$package_root" \
              RAN_NEUTRAL_UPDATER_VERSION="$expected_version" \
              wp eval '
                  $runtime_root = WP_PLUGIN_DIR . "/ran-booster/" . getenv( "RAN_NEUTRAL_UPDATER_ROOT" );
                  $copy = json_decode( file_get_contents( $runtime_root . "/runtime-copy.json" ), true, 512, JSON_THROW_ON_ERROR );
                  $expected = array(
                    "package_revision" => "c197d9909a774fb089b108c8138ab05c74948e1c71da2b38ccc56f5ff00cfce2",
                    "package_version" => getenv( "RAN_NEUTRAL_UPDATER_VERSION" ),
                    "php_floor" => "8.2.0",
                    "runtime_file" => "runtime.php",
                    "runtime_protocol" => 4,
                    "wordpress_floor" => "6.5.0",
                  );
                  if ( $copy !== $expected ) {
                    throw new RuntimeException( "The neutral updater runtime-copy metadata is unexpected." );
                  }
                  $runtime = file_get_contents( $runtime_root . "/runtime.php" );
                  if ( false === $runtime || ! str_contains( $runtime, "RAN\\\\WPReleaseUpdater\\\\V1\\\\WordPress\\\\NativePluginUpdater" ) ) {
                    throw new RuntimeException( "The neutral updater V1 runtime marker is unavailable." );
                  }
                  WP_CLI::success( "Neutral updater runtime metadata and V1 marker passed." );
                ' --path=build/wordpress

'''
          text, count = readback_pattern.subn(readback, text, count=1)
          if count != 1:
              raise SystemExit(f'neutral runtime readback replacement count {count}')
          workflow.write_text(text)

          # 4. Update release-platform contracts for explicit surface kinds and the
          # direct-child/symlink fail-closed rule.
          platform = Path('tests/ReleasePlatformContractTest.php')
          text = platform.read_text()
          constant_pattern = re.compile(
              r"\tprivate const RUNTIME_PACKAGING_POLICY = array\(.*?\n\t\);\n\n(?=\tpublic function testComposerDeclaresTheZipRuntimeRequirement)",
              re.S,
          )
          constant = r'''	private const RUNTIME_PACKAGING_POLICY = array(
		'ran/updater-support'    => array(
			'repository'   => 'RocketsAreNostalgic/ran-updater-support',
			'archive_root' => 'vendor/ran/updater-support',
			'surfaces'     => array(
				array( 'path' => 'LICENSE', 'kind' => 'file' ),
				array( 'path' => 'src', 'kind' => 'directory' ),
			),
			'build_role'   => null,
		),
		'ran/wp-branch-updater'  => array(
			'repository'   => 'RocketsAreNostalgic/ran-wp-branch-updater',
			'archive_root' => 'vendor/ran/wp-branch-updater',
			'surfaces'     => array(
				array( 'path' => 'LICENSE', 'kind' => 'file' ),
				array( 'path' => 'bootstrap.php', 'kind' => 'file' ),
				array( 'path' => 'src', 'kind' => 'directory' ),
			),
			'build_role'   => null,
		),
		'ran/wp-release-updater' => array(
			'repository'   => 'RocketsAreNostalgic/ran-wp-release-updater',
			'archive_root' => 'vendor/ran/wp-release-updater',
			'surfaces'     => array(
				array( 'path' => 'LICENSE', 'kind' => 'file' ),
				array( 'path' => 'bootstrap.php', 'kind' => 'file' ),
				array( 'path' => 'runtime-copy.json', 'kind' => 'file' ),
				array( 'path' => 'runtime.php', 'kind' => 'file' ),
				array( 'path' => 'src', 'kind' => 'directory' ),
			),
			'build_role'   => 'neutral-updater',
		),
	);

'''
          text, count = constant_pattern.subn(constant, text, count=1)
          if count != 1:
              raise SystemExit(f'platform policy constant replacement count {count}')
          old = "$policy['packages'][0]['surfaces'][] = '../outside-package';"
          new = "$policy['packages'][0]['surfaces'][] = array( 'path' => '../outside-package', 'kind' => 'file' );"
          if text.count(old) != 1:
              raise SystemExit('unsafe surface fixture target drifted')
          text = text.replace(old, new, 1)
          unsafe_method_end = text.index('\n\tpublic function testReleaseScriptsConsumeTheSharedPackagingPolicyProjection')
          insert = r'''
	public function testRuntimeDependencyVerifierRejectsNestedSurfacePolicy(): void {
		$policy = $this->readPackagingPolicy();
		self::assertIsArray( $policy['packages'][0] ?? null );
		self::assertIsArray( $policy['packages'][0]['surfaces'] ?? null );
		$policy['packages'][0]['surfaces'][] = array(
			'path' => 'runtime/bootstrap.php',
			'kind' => 'file',
		);
		$path = $this->writeTemporaryJson( $policy );

		try {
			$result = $this->runRuntimeDependencyVerifier(
				dirname( __DIR__ ) . '/composer.lock',
				$path
			);
			self::assertNotSame( 0, $result['exit'] );
		} finally {
			$this->removeTemporaryFile( $path );
		}
	}

	public function testRuntimeDependencyVerifierRejectsUnknownSurfaceKind(): void {
		$policy = $this->readPackagingPolicy();
		self::assertIsArray( $policy['packages'][0] ?? null );
		self::assertIsArray( $policy['packages'][0]['surfaces'][0] ?? null );
		$policy['packages'][0]['surfaces'][0]['kind'] = 'anything';
		$path = $this->writeTemporaryJson( $policy );

		try {
			$result = $this->runRuntimeDependencyVerifier(
				dirname( __DIR__ ) . '/composer.lock',
				$path
			);
			self::assertNotSame( 0, $result['exit'] );
		} finally {
			$this->removeTemporaryFile( $path );
		}
	}
'''
          text = text[:unsafe_method_end] + insert + text[unsafe_method_end:]
          old_symlink_assert = """\t\t\tself::assertStringContainsString(\n\t\t\t\t'-type l -print -quit | grep -q .',\n\t\t\t\t$script\n\t\t\t);\n\t\t\tself::assertStringContainsString(\n\t\t\t\t'runtime dependency allowlist must not contain symbolic links.',\n\t\t\t\t$script\n\t\t\t);"""
          new_symlink_assert = """\t\t\tself::assertStringContainsString( '[[ -d \"$installed_package\" && ! -L \"$installed_package\" ]]', $script );\n\t\t\tself::assertStringContainsString( '[[ ! -L \"$required_path\" ]]', $script );\n\t\t\tself::assertStringContainsString( '-type l -print -quit | grep -q .', $script );\n\t\t\tself::assertStringContainsString( 'surface_kind=${surface_spec#*:}', $script );"""
          if text.count(old_symlink_assert) != 1:
              raise SystemExit('symlink contract target drifted')
          text = text.replace(old_symlink_assert, new_symlink_assert, 1)
          platform.write_text(text)

          # 5. Update workflow contracts: policy is an admission trust input; exact
          # checkout/readback identity must come from the validated projection.
          workflow_test = Path('tests/ReleaseWorkflowContractTest.php')
          text = workflow_test.read_text()
          trust_old = "\t\t\t'composer.lock',\n\t\t\t'package.json',"
          trust_new = "\t\t\t'composer.lock',\n\t\t\t'runtime-packaging-policy.json',\n\t\t\t'package.json',"
          if text.count(trust_old) != 1:
              raise SystemExit('workflow contract trust-path target drifted')
          text = text.replace(trust_old, trust_new, 1)
          if text.count("\t\t\t'scripts/build-release.sh',\n\t\t\t'scripts/verify-release.sh',") != 1:
              raise SystemExit('workflow contract verifier-path target drifted')
          text = text.replace(
