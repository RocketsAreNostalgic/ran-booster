              raise SystemExit('runtime policy documentation authority paragraph drifted')
          text = text.replace(old, new, 1)
          old = "A production dependency change normally changes `composer.json` and `composer.lock`. A packaging-surface change changes `runtime-packaging-policy.json`. Those are evidence/product inputs. Changes to the executable builder/verifier scripts remain changes to Booster's current release-control implementation and retain their existing trust-path treatment until the separate release-authority work changes that boundary."
