      - name: Apply repository PHP formatting
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install tooling and format touched PHP contracts
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml \
            scripts/verify-runtime-dependencies.php \
            tests/ReleasePlatformContractTest.php \
            tests/ReleaseWorkflowContractTest.php
          status=$?
          set -e
          (( status <= 1 ))
          vendor/bin/phpcs --standard=.phpcs.xml --report=full \
            scripts/verify-runtime-dependencies.php \
            tests/ReleasePlatformContractTest.php \
            tests/ReleaseWorkflowContractTest.php

      - name: Run bounded contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/verify-runtime-dependencies.php
          bash -n scripts/build-release.sh
          bash -n scripts/verify-release.sh
          vendor/bin/phpunit --configuration phpunit.xml \
            --filter 'ReleasePlatformContractTest|ReleaseWorkflowContractTest'
          php scripts/verify-runtime-dependencies.php --packaging \
            composer.lock runtime-packaging-policy.json >/tmp/runtime-packaging-projection
          grep -F $'ran/wp-release-updater\tv0.1.0-beta.4\tdcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3\tRocketsAreNostalgic/ran-wp-release-updater\tvendor/ran/wp-release-updater\tLICENSE:file,bootstrap.php:file,runtime-copy.json:file,runtime.php:file,src:directory\tneutral-updater' \
            /tmp/runtime-packaging-projection
          git diff --check

      - name: Commit the reviewed repair and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr139-review.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/quality.yml \
            docs/runtime-packaging-policy.md \
            runtime-packaging-policy.json \
            scripts/build-release.sh \
            scripts/verify-release.sh \
            scripts/verify-runtime-dependencies.php \
            tests/ReleasePlatformContractTest.php \
            tests/ReleaseWorkflowContractTest.php \
            .github/workflows/fix-pr139-review.yml
          git commit -m 'fix: close runtime packaging trust gaps'
          git push origin HEAD:refactor/runtime-packaging-policy
