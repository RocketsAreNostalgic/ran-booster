name: Format capacity test

on:
  push:
    branches:
      - refactor/use-validated-expanded-archive-bytes

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'RocketsAreNostalgic/ran-booster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/use-validated-expanded-archive-bytes
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply repository PHP formatter to focused test
        run: vendor/bin/phpcbf --standard=.phpcs.xml tests/Deployment/AdmittedBranchHostAdapterCapacityTest.php || test $? -eq 1
      - name: Commit formatting when changed
        run: |
          if git diff --quiet -- tests/Deployment/AdmittedBranchHostAdapterCapacityTest.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Deployment/AdmittedBranchHostAdapterCapacityTest.php
          git commit -m 'style: format capacity regression test'
          git push origin HEAD:refactor/use-validated-expanded-archive-bytes
