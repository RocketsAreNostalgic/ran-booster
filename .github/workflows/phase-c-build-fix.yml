name: Phase C build fix

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-build-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
      - name: Restore release-updater checkout identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/build-release.sh')
          text = p.read_text()
          anchor = "release_package_root='vendor/ran/wp-release-updater'\n"
          if text.count(anchor) != 1:
              raise SystemExit('release package root anchor not unique')
          text = text.replace(anchor, anchor + "release_updater_commit='dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3'\n", 1)
          count = text.count('updater_commit')
          if count != 4:
              raise SystemExit(f'expected four updater_commit occurrences after inserting the identity, found {count}')
          text = text.replace('updater_commit', 'release_updater_commit')
          p.write_text(text)
          PY
          bash -n scripts/build-release.sh
      - name: Commit build fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-release.sh
          git diff --cached --check
          git commit -m 'fix: retain release updater provenance checkout'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
