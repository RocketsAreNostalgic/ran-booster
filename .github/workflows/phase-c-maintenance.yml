name: Phase C maintenance

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase C branch
        uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          tools: composer:v2
          coverage: none

      - name: Complete Phase C source cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'RAN/BoosterServiceProvider.php',
              'use RAN\\Deployment\\DeploymentArchivePreflight;\n',
              ''
          )
          replace_once(
              'RAN/BoosterServiceProvider.php',
              '\t\t$container->bind( DeploymentArchivePreflight::class, new DeploymentArchivePreflight() );\n',
              ''
          )
          replace_once(
              'RAN/BoosterServiceProvider.php',
              '\t\t\t\t\t$container->make( DeploymentArchivePreflight::class ),\n\t\t\t\t\t$container->make( CorePackageExecutor::class ),\n',
              ''
          )

          replace_once(
              'RAN/Booster/GitHub/GitHubProvider.php',
              "\\t\\t\\t\\t|| 52428800 !== ( $facts['maximum_artifact_bytes'] ?? null ) ) {",
              "\\t\\t\\t\\t|| $repository->maximumArtifactBytes !== ( $facts['maximum_artifact_bytes'] ?? null ) ) {"
          )
          replace_once(
              'RAN/Booster/GitHub/GitHubProvider.php',
              "\\t\\t\\t\\t|| 52428800 !== ( $facts['maximum_artifact_bytes'] ?? null ) ) {",
              "\\t\\t\\t\\t|| $repository->maximumArtifactBytes !== ( $facts['maximum_artifact_bytes'] ?? null ) ) {"
          )
          replace_once(
              'RAN/Booster/GitHub/GitHubProvider.php',
              "\\t\\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), 52428800 );",
              "\\t\\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), $repository->maximumArtifactBytes );"
          )

          old = '''\tprivate function repositoryWithCredential( RepositoryReference $repository, string $credentialId ): RepositoryReference {\n\t\treturn new RepositoryReference(\n\t\t\t$repository->locator,\n\t\t\t$repository->providerRepositoryId,\n\t\t\t$repository->private,\n\t\t\t$credentialId\n\t\t);\n\t}\n'''
          new = '''\tprivate function repositoryWithCredential( RepositoryReference $repository, string $credentialId ): RepositoryReference {\n\t\treturn $repository->withCredential( $credentialId );\n\t}\n'''
          replace_once('RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php', old, new)

          replace_once(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '''\t\t$repository = new ManagedRepository(\n\t\t\t(string) $data['provider'],\n\t\t\t$request->repository,\n\t\t\t(string) $data['provider_repository_id'],\n\t\t\t$request->configuredBranch,\n\t\t\t$request->private,\n\t\t\t$request->credentialId\n\t\t);''',
              '''\t\t$repository = new ManagedRepository(\n\t\t\t(string) $data['provider'],\n\t\t\t$request->repository,\n\t\t\t(string) $data['provider_repository_id'],\n\t\t\t$request->configuredBranch,\n\t\t\t$request->private,\n\t\t\t$request->credentialId,\n\t\t\t$request->maximumArtifactBytes\n\t\t);'''
          )
          PY

          php -l RAN/BoosterServiceProvider.php
          php -l RAN/Booster/GitHub/GitHubProvider.php
          php -l RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php
          php -l RAN/Deployment/AdmittedBranchHostAdapter.php

      - name: Regenerate Composer lock against immutable beta.2
        shell: bash
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_NO_AUDIT: '1'
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: |
          set -euo pipefail
          composer update ran/wp-branch-updater ran/updater-support --with-dependencies
          composer validate --strict
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, flags: JSON_THROW_ON_ERROR); foreach ($lock["packages"] as $package) { if ($package["name"] === "ran/wp-branch-updater") { printf("branch-updater %s %s\n", $package["version"], $package["source"]["reference"] ?? ""); } if ($package["name"] === "ran/updater-support") { printf("updater-support %s %s\n", $package["version"], $package["source"]["reference"] ?? ""); } }'

      - name: Commit generated Phase C completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/BoosterServiceProvider.php RAN/Booster/GitHub/GitHubProvider.php RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php RAN/Deployment/AdmittedBranchHostAdapter.php composer.lock
          git diff --cached --check
          git commit -m 'refactor: complete normalized updater cutover'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
