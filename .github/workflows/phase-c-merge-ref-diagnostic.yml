name: Phase C merge-ref diagnostics

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Inspect current PR merge-ref failing tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/116/merge:refs/remotes/pull/116/merge
          git checkout --detach refs/remotes/pull/116/merge
          printf '%s\n' '=== failing class/method locations ==='
          grep -R -n -E 'DeploymentAdmissionPolicyValidationTest|DeploymentSourceInvariantTest|testExternalRunnerExecutesConcreteAdapterAgainstBoosterHistoryAndCoreExecutor|testReleaseFilesExposeOnlyPluginRuntime|testReleaseScriptRunsThePlatformVerifier|verify-release-platform.php' tests || true
          printf '%s\n' '=== coordinator constructions in relevant deployment tests ==='
          grep -R -n -B 8 -A 20 'new DeploymentCoordinator' tests/Deployment | head -n 500 || true
          printf '%s\n' '=== release platform files ==='
          grep -R -l -E 'verify-release-platform.php|testReleaseFilesExposeOnlyPluginRuntime|testReleaseScriptRunsThePlatformVerifier' tests || true
