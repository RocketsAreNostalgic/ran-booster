name: Phase C packaging update

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-packaging.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Update runtime bootstrap and archive contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: regex matched {count} times: {pattern}")
              p.write_text(updated)

          replace_once(
              'ran-booster.php',
              'use RAN\\WordPress\\CoreSelfUpdatePolicy;\n',
              'use RAN\\WordPress\\BranchUpdaterBootstrap;\nuse RAN\\WordPress\\CoreSelfUpdatePolicy;\n'
          )
          replace_once(
              'ran-booster.php',
              '$ran_booster_release_updater = ReleaseUpdaterBootstrap::register();',
              'BranchUpdaterBootstrap::register();\n$ran_booster_release_updater = ReleaseUpdaterBootstrap::register();'
          )

          package_block = '''release_package_root='vendor/ran/wp-release-updater'\nbranch_package_root='vendor/ran/wp-branch-updater'\nsupport_package_root='vendor/ran/updater-support'\npackage_entries=(\n\t"$support_package_root/LICENSE"\n\t"$support_package_root/src"\n\t"$branch_package_root/LICENSE"\n\t"$branch_package_root/bootstrap.php"\n\t"$branch_package_root/src"\n\t"$release_package_root/LICENSE"\n\t"$release_package_root/bootstrap.php"\n\t"$release_package_root/runtime-copy.json"\n\t"$release_package_root/runtime.php"\n\t"$release_package_root/src"\n)\n'''
          replace_regex(
              'scripts/build-release.sh',
              r"package_root='vendor/ran/wp-release-updater'.*?package_entries=\(.*?\)\n(?=generated_entries=)",
              package_block
          )

          build_validation = r'''release_installed_package="$composer_dir/$release_package_root"\nbranch_installed_package="$composer_dir/$branch_package_root"\nsupport_installed_package="$composer_dir/$support_package_root"\nfor installed_package in "$release_installed_package" "$branch_installed_package" "$support_installed_package"; do\n\t[[ -d "$installed_package" ]] || fail "locked runtime package was not installed: $installed_package"\ndone\n\nphp "$repo_root/scripts/verify-runtime-dependencies.php" "$composer_dir/composer.lock" >/dev/null \\\n\t|| fail 'composer.lock does not contain the exact approved runtime dependency set.'\n\nfor required_path in \\\n\t"$release_installed_package/LICENSE" \\\n\t"$release_installed_package/bootstrap.php" \\\n\t"$release_installed_package/runtime-copy.json" \\\n\t"$release_installed_package/runtime.php" \\\n\t"$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" \\\n\t"$branch_installed_package/bootstrap.php" \\\n\t"$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" \\\n\t"$support_installed_package/src"; do\n\t[[ -e "$required_path" ]] || fail "locked runtime package is missing: $required_path"\ndone\nif find \\\n\t"$release_installed_package/LICENSE" "$release_installed_package/bootstrap.php" "$release_installed_package/runtime-copy.json" "$release_installed_package/runtime.php" "$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" "$branch_installed_package/bootstrap.php" "$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" "$support_installed_package/src" \\\n\t-type l -print -quit | grep -q .; then\n\tfail 'runtime dependency allowlist must not contain symbolic links.'\nfi\n\n'''
          replace_regex(
              'scripts/build-release.sh',
              r'installed_package="\$composer_dir/\$package_root".*?(?=git archive \\\n)',
              build_validation
          )

          build_stage = r'''mkdir -p "$stage_root/$release_package_root" "$stage_root/$branch_package_root" "$stage_root/$support_package_root"\ncp "$release_installed_package/LICENSE" "$stage_root/$release_package_root/LICENSE"\ncp "$release_installed_package/bootstrap.php" "$stage_root/$release_package_root/bootstrap.php"\ncp "$release_installed_package/runtime-copy.json" "$stage_root/$release_package_root/runtime-copy.json"\ncp "$release_installed_package/runtime.php" "$stage_root/$release_package_root/runtime.php"\ncp -R "$release_installed_package/src" "$stage_root/$release_package_root/src"\ncp "$branch_installed_package/LICENSE" "$stage_root/$branch_package_root/LICENSE"\ncp "$branch_installed_package/bootstrap.php" "$stage_root/$branch_package_root/bootstrap.php"\ncp -R "$branch_installed_package/src" "$stage_root/$branch_package_root/src"\ncp "$support_installed_package/LICENSE" "$stage_root/$support_package_root/LICENSE"\ncp -R "$support_installed_package/src" "$stage_root/$support_package_root/src"\n'''
          replace_regex(
              'scripts/build-release.sh',
              r'mkdir -p "\$stage_root/\$package_root".*?cp -R "\$installed_package/src" "\$stage_root/\$package_root/src"\n',
              build_stage
          )
          replace_once(
              'scripts/build-release.sh',
              '"$stage_root/$package_root" "$stage_root" "$commit_epoch" "$stage_root/ran-booster-release.json"',
              '"$stage_root/vendor/ran" "$stage_root" "$commit_epoch" "$stage_root/ran-booster-release.json"'
          )

          replace_regex(
              'scripts/verify-release.sh',
              r"package_root='vendor/ran/wp-release-updater'.*?package_entries=\(.*?\)\n(?=generated_entries=)",
              package_block
          )

          verify_validation = r'''release_installed_package="$composer_dir/$release_package_root"\nbranch_installed_package="$composer_dir/$branch_package_root"\nsupport_installed_package="$composer_dir/$support_package_root"\nfor installed_package in "$release_installed_package" "$branch_installed_package" "$support_installed_package"; do\n\t[[ -d "$installed_package" ]] || fail "committed lock did not install runtime package: $installed_package"\ndone\n\nif ! dependency_records=$(php "$repo_root/scripts/verify-runtime-dependencies.php" "$composer_dir/composer.lock"); then\n\tfail 'composer.lock does not contain the exact approved runtime dependency set.'\nfi\n\nfor required_path in \\\n\t"$release_installed_package/LICENSE" \\\n\t"$release_installed_package/bootstrap.php" \\\n\t"$release_installed_package/runtime-copy.json" \\\n\t"$release_installed_package/runtime.php" \\\n\t"$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" \\\n\t"$branch_installed_package/bootstrap.php" \\\n\t"$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" \\\n\t"$support_installed_package/src"; do\n\t[[ -e "$required_path" ]] || fail "committed lock package is missing: $required_path"\ndone\nif find \\\n\t"$release_installed_package/LICENSE" "$release_installed_package/bootstrap.php" "$release_installed_package/runtime-copy.json" "$release_installed_package/runtime.php" "$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" "$branch_installed_package/bootstrap.php" "$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" "$support_installed_package/src" \\\n\t-type l -print -quit | grep -q .; then\n\tfail 'runtime dependency allowlist must not contain symbolic links.'\nfi\n\n'''
          replace_regex(
              'scripts/verify-release.sh',
              r'installed_package="\$composer_dir/\$package_root".*?(?=archive_paths=)',
              verify_validation + 'archive_paths='
          )
          # The replacement above consumes the archive_paths= token; collapse the duplicate value assignment.
          replace_once(
              'scripts/verify-release.sh',
              'archive_paths="$tmp_dir/archive-paths.txt"',
              '"$tmp_dir/archive-paths.txt"'
          )

          replace_once(
              'scripts/verify-release.sh',
              '[[ "$relative" == "$package_root" || "$relative" == "$package_root/" || "$relative" == "$package_root/"* ]] \\\n\t\t\t\t|| fail "unexpected vendor path is forbidden: $path"',
              '[[ "$relative" == "$release_package_root" || "$relative" == "$release_package_root/" || "$relative" == "$release_package_root/"* \\\n\t\t\t\t|| "$relative" == "$branch_package_root" || "$relative" == "$branch_package_root/" || "$relative" == "$branch_package_root/"* \\\n\t\t\t\t|| "$relative" == "$support_package_root" || "$relative" == "$support_package_root/" || "$relative" == "$support_package_root/"* ]] \\\n\t\t\t\t|| fail "unexpected vendor path is forbidden: $path"'
          )

          expected_block = r'''git ls-tree -r --name-only "$commit" -- "${committed_entries[@]}" \\\n\t| sed 's#^#ran-booster/#' \\\n\t> "$expected_files"\nappend_runtime_files() {\n\tlocal installed_root=$1\n\tlocal archive_root=$2\n\tshift 2\n\tlocal entry\n\tfor entry in "$@"; do\n\t\tif [[ -d "$installed_root/$entry" ]]; then\n\t\t\tfind "$installed_root/$entry" -type f -print\n\t\telse\n\t\t\tprintf '%s\\n' "$installed_root/$entry"\n\t\tfi\n\tdone \\\n\t\t| sed "s#^$installed_root/#ran-booster/$archive_root/#" \\\n\t\t>> "$expected_files"\n}\nappend_runtime_files "$support_installed_package" "$support_package_root" LICENSE src\nappend_runtime_files "$branch_installed_package" "$branch_package_root" LICENSE bootstrap.php src\nappend_runtime_files "$release_installed_package" "$release_package_root" LICENSE bootstrap.php runtime-copy.json runtime.php src\nprintf '%s\\n' 'ran-booster/ran-booster-release.json' >> "$expected_files"\nLC_ALL=C sort -o "$expected_files" "$expected_files"'''
          replace_regex(
              'scripts/verify-release.sh',
              r'git ls-tree -r --name-only "\$commit" -- "\$\{committed_entries\[@\]\}" \\\n.*?LC_ALL=C sort -o "\$expected_files" "\$expected_files"',
              expected_block
          )

          required_block = r'''for required_path in \\\n\t'ran-booster/NOTICE.md' \\\n\t'ran-booster/license.txt' \\\n\t'ran-booster/ran-booster-release.json' \\\n\t'ran-booster/ran-booster.php' \\\n\t"ran-booster/$support_package_root/LICENSE" \\\n\t"ran-booster/$branch_package_root/LICENSE" \\\n\t"ran-booster/$branch_package_root/bootstrap.php" \\\n\t"ran-booster/$release_package_root/LICENSE" \\\n\t"ran-booster/$release_package_root/bootstrap.php" \\\n\t"ran-booster/$release_package_root/runtime-copy.json" \\\n\t"ran-booster/$release_package_root/runtime.php"; do\n\tgrep -Fqx "$required_path" "$archive_files" \\\n\t\t|| fail "required runtime file is missing: $required_path"\ndone'''
          replace_regex(
              'scripts/verify-release.sh',
              r'for required_path in \\\n.*?done\n(?=\narchive_plugin_version=)',
              required_block
          )

          compare_block = r'''compare_runtime_package() {\n\tlocal installed_root=$1\n\tlocal archived_root=$2\n\tshift 2\n\tlocal entry package_file relative_package_file\n\tfor entry in "$@"; do\n\t\tif [[ -d "$installed_root/$entry" ]]; then\n\t\t\twhile IFS= read -r package_file || [[ -n "$package_file" ]]; do\n\t\t\t\t[[ -n "$package_file" ]] || continue\n\t\t\t\trelative_package_file=${package_file#"$installed_root/"}\n\t\t\t\tcmp -s "$package_file" "$archived_root/$relative_package_file" \\\n\t\t\t\t\t|| fail "archived runtime dependency $relative_package_file does not match the committed Composer lock."\n\t\t\tdone < <(find "$installed_root/$entry" -type f -print | LC_ALL=C sort)\n\t\telse\n\t\t\tcmp -s "$installed_root/$entry" "$archived_root/$entry" \\\n\t\t\t\t|| fail "archived runtime dependency $entry does not match the committed Composer lock."\n\t\tfi\n\tdone\n}\ncompare_runtime_package "$support_installed_package" "$extract_dir/ran-booster/$support_package_root" LICENSE src\ncompare_runtime_package "$branch_installed_package" "$extract_dir/ran-booster/$branch_package_root" LICENSE bootstrap.php src\ncompare_runtime_package "$release_installed_package" "$extract_dir/ran-booster/$release_package_root" LICENSE bootstrap.php runtime-copy.json runtime.php src\n'''
          replace_regex(
              'scripts/verify-release.sh',
              r'archived_package="\$extract_dir/ran-booster/\$package_root".*?(?=php_file_count=0)',
              compare_block
          )

          replace_regex(
              'scripts/verify-release.sh',
              r"printf 'Updater %s %s %s\\n' \"\$package_name\" \"\$package_version\" \"\$package_commit\"",
              "printf 'Runtime dependencies\\n%s\\n' \"$dependency_records\""
          )
          PY

          bash -n scripts/build-release.sh
          bash -n scripts/verify-release.sh
          php -l scripts/verify-runtime-dependencies.php
          php -l RAN/WordPress/BranchUpdaterBootstrap.php
          php -l ran-booster.php

      - name: Commit packaging completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ran-booster.php scripts/build-release.sh scripts/verify-release.sh
          git diff --cached --check
          git commit -m 'build: package normalized updater runtime dependencies'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
