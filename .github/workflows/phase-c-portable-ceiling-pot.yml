name: Phase C portable ceiling catalogue

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-portable-ceiling-pot.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0

      - name: Regenerate catalogue and commit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/make-pot.sh
          bash scripts/make-pot.sh --check
          rm .github/workflows/phase-c-portable-ceiling-pot.yml
          git diff --check
          git config user.name 'bnjmnrsh'
          git config user.email '65979639+bnjmnrsh@users.noreply.github.com'
          git add languages/ran-booster.pot .github/workflows/phase-c-portable-ceiling-pot.yml
          git diff --cached --quiet && { echo 'Expected catalogue changes.' >&2; exit 1; }
          git commit -m 'chore: refresh archive limit catalogue'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
