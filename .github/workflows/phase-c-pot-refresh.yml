name: Phase C POT refresh

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater

permissions:
  contents: write

jobs:
  refresh:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli:2.12.0
          coverage: none
      - name: Refresh and commit POT
        shell: bash
        run: |
          set -euo pipefail
          scripts/make-pot.sh
          rm .github/workflows/phase-c-pot-refresh.yml
          git config user.name "bnjmnrsh"
          git config user.email "65979639+bnjmnrsh@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: refresh translation template"
          git push origin HEAD:refactor/adopt-normalized-branch-updater
