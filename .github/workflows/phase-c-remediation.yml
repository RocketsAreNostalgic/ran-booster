name: Phase C remediation

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2, wp-cli:2.12.0

      - name: Apply accepted review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new))

          replace_exact(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              "\t\t\t$request->private,\n\t\t\t$request->credentialId,\n\t\t\t$request->maximumArtifactBytes\n\t\t);",
              "\t\t\t$request->private,\n\t\t\t$request->credentialId\n\t\t);",
          )

          p = Path('RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php')
          text = p.read_text()
          text = text.replace('use RAN\\PackageArtifactLimit;\n', '')
          old = "\t\t$repository = $package->getRepository()->withMaximumArtifactBytes( PackageArtifactLimit::resolve( null ) )->reference;"
          new = "\t\t$repository = $package->getRepository()->reference;"
          if text.count(old) != 1:
              raise SystemExit('NativeReleaseTrackingFacade.php: stale package-limit call was not unique')
          p.write_text(text.replace(old, new))

          p = Path('RAN/Booster/GitHub/GitHubProvider.php')
          text = p.read_text()
          use_anchor = 'use InvalidArgumentException;\n'
          if 'use RAN\\PackageArtifactLimit;\n' not in text:
              if text.count(use_anchor) != 1:
                  raise SystemExit('GitHubProvider.php: import anchor was not unique')
              text = text.replace(use_anchor, use_anchor + 'use RAN\\PackageArtifactLimit;\n')
          if text.count('52428800 !== ( $facts[\'maximum_artifact_bytes\'] ?? null )') != 2:
              raise SystemExit('GitHubProvider.php: expected two release evidence limit checks')
          text = text.replace(
              '52428800 !== ( $facts[\'maximum_artifact_bytes\'] ?? null )',
              'PackageArtifactLimit::resolve( null ) !== ( $facts[\'maximum_artifact_bytes\'] ?? null )',
          )
          old = "\t\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), 52428800 );"
          new = "\t\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), PackageArtifactLimit::resolve( null ) );"
          if text.count(old) != 1:
              raise SystemExit('GitHubProvider.php: release source literal was not unique')
          p.write_text(text.replace(old, new))
          PY

      - name: Regenerate gettext catalogue
        run: bash scripts/make-pot.sh

      - name: Sanity check corrected PHP
        run: |
          php -l RAN/Deployment/AdmittedBranchHostAdapter.php
          php -l RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php
          php -l RAN/Booster/GitHub/GitHubProvider.php

      - name: Commit correction and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase-c-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No remediation changes produced.' >&2; exit 1; }
          git commit -m 'fix: complete Phase C review corrections'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
