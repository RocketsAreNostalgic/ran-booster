name: Phase C resolved-ref cleanup remediation

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-resolved-ref-cleanup.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Apply and validate remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          adapter = Path('RAN/Deployment/AdmittedBranchHostAdapter.php')
          source = adapter.read_text()
          old = """\t\t$providerArchive = $this->providerArchive;\n\t\t$resolvedRef     = $providerArchive->getResolvedRef();\n\t\tif ( '' === $resolvedRef || $resolvedRef !== trim( $resolvedRef ) || strlen( $resolvedRef ) > 191 || preg_match( '/[[:cntrl:]]/', $resolvedRef ) === 1 ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_REVISION_INVALID );\n\t\t}\n\t\tif ( null !== $deployment->expectedHead && ! hash_equals( $deployment->expectedHead, $resolvedRef ) ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_REVISION_INVALID );\n\t\t}\n"""
          new = """\t\t$providerArchive = $this->providerArchive;\n\t\ttry {\n\t\t\t$resolvedRef = $providerArchive->getResolvedRef();\n\t\t\tif ( '' === $resolvedRef || $resolvedRef !== trim( $resolvedRef ) || strlen( $resolvedRef ) > 191 || preg_match( '/[[:cntrl:]]/', $resolvedRef ) === 1 ) {\n\t\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_REVISION_INVALID );\n\t\t\t}\n\t\t\tif ( null !== $deployment->expectedHead && ! hash_equals( $deployment->expectedHead, $resolvedRef ) ) {\n\t\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_REVISION_INVALID );\n\t\t\t}\n\t\t} catch ( AdmittedBranchStageFailure $failure ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\tthrow $failure;\n\t\t} catch ( Throwable $failure ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\t$this->stage( DeploymentOutcome::fromProviderFailure( $failure )->getCode() );\n\t\t}\n"""
          if source.count(old) != 1:
              raise SystemExit('adapter target block did not match exactly once')
          adapter.write_text(source.replace(old, new))

          test = Path('tests/Deployment/AdmittedBranchExecutionTest.php')
          source = test.read_text()
          anchor = """\tpublic function testProviderArchiveIsCleanedWhenItsResolvedRevisionIsInvalid(): void {\n\t\t$archive     = new BoundaryProviderArchive( '' );\n\t\t$provider    = new BoundaryRepositoryProvider( $archive );\n\t\t$adapter     = $this->adapter( $this->runningUpdate(), new ProviderRegistry( array( $provider ) ) );\n\t\t$declaration = $adapter->declaration();\n\n\t\ttry {\n\t\t\t$adapter->prepare(\n\t\t\t\t$declaration,\n\t\t\t\tarray(\n\t\t\t\t\t'identifier' => 'example/example.php',\n\t\t\t\t\t'version'    => '1.0.0',\n\t\t\t\t\t'active'     => false,\n\t\t\t\t)\n\t\t\t);\n\t\t\tself::fail( 'An invalid resolved revision must fail before artifact acquisition.' );\n\t\t} catch ( AdmittedBranchStageFailure $failure ) {\n\t\t\tself::assertSame( DeploymentOutcome::CODE_ARCHIVE_REVISION_INVALID, $failure->outcomeCode );\n\t\t}\n\n\t\tself::assertSame( 1, $archive->cleanupCalls );\n\t}\n"""
          addition = anchor + """\n\tpublic function testProviderArchiveIsCleanedWhenResolvedRevisionRetrievalThrows(): void {\n\t\t$archive                       = new BoundaryProviderArchive( str_repeat( 'a', 40 ) );\n\t\t$archive->resolvedRefFails     = true;\n\t\t$provider                      = new BoundaryRepositoryProvider( $archive );\n\t\t$adapter                       = $this->adapter( $this->runningUpdate(), new ProviderRegistry( array( $provider ) ) );\n\t\t$declaration                   = $adapter->declaration();\n\n\t\ttry {\n\t\t\t$adapter->prepare(\n\t\t\t\t$declaration,\n\t\t\t\tarray(\n\t\t\t\t\t'identifier' => 'example/example.php',\n\t\t\t\t\t'version'    => '1.0.0',\n\t\t\t\t\t'active'     => false,\n\t\t\t\t)\n\t\t\t);\n\t\t\tself::fail( 'Resolved revision retrieval failure must clean the provider archive.' );\n\t\t} catch ( AdmittedBranchStageFailure $failure ) {\n\t\t\tself::assertSame( DeploymentOutcome::CODE_PROVIDER_FAILED, $failure->outcomeCode );\n\t\t}\n\n\t\tself::assertSame( 1, $archive->cleanupCalls );\n\t}\n"""
          if source.count(anchor) != 1:
              raise SystemExit('test insertion anchor did not match exactly once')
          source = source.replace(anchor, addition)
          old_class = """final class BoundaryProviderArchive implements ProviderPreparedArchive {\n\tpublic int $cleanupCalls = 0;\n\tpublic function __construct( private string $resolvedRef ) {}\n\tpublic function getUrl(): string {\n\t\treturn 'https://example.test/archive.zip';\n\t}\n\tpublic function getResolvedRef(): string {\n\t\treturn $this->resolvedRef;\n\t}\n"""
          new_class = """final class BoundaryProviderArchive implements ProviderPreparedArchive {\n\tpublic int $cleanupCalls = 0;\n\tpublic bool $resolvedRefFails = false;\n\tpublic function __construct( private string $resolvedRef ) {}\n\tpublic function getUrl(): string {\n\t\treturn 'https://example.test/archive.zip';\n\t}\n\tpublic function getResolvedRef(): string {\n\t\tif ( $this->resolvedRefFails ) {\n\t\t\tthrow new RuntimeException( 'Resolved revision retrieval failed.' );\n\t\t}\n\t\treturn $this->resolvedRef;\n\t}\n"""
          if source.count(old_class) != 1:
              raise SystemExit('archive double target block did not match exactly once')
          test.write_text(source.replace(old_class, new_class))
          PY

          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit --configuration phpunit.xml --filter AdmittedBranchExecutionTest --fail-on-phpunit-deprecation
          vendor/bin/phpcs --standard=.phpcs.xml RAN/Deployment/AdmittedBranchHostAdapter.php tests/Deployment/AdmittedBranchExecutionTest.php
          vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=2G RAN/Deployment/AdmittedBranchHostAdapter.php tests/Deployment/AdmittedBranchExecutionTest.php
          git diff --check

          rm .github/workflows/phase-c-resolved-ref-cleanup.yml
          git config user.name 'bnjmnrsh'
          git config user.email '65979639+bnjmnrsh@users.noreply.github.com'
          git add RAN/Deployment/AdmittedBranchHostAdapter.php tests/Deployment/AdmittedBranchExecutionTest.php .github/workflows/phase-c-resolved-ref-cleanup.yml
          git commit -m 'fix: clean provider archive when ref lookup fails'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
