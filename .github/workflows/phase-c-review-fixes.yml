name: Phase C review fixes

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-review-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new, count))

          def sub(path, pattern, replacement, count=1):
              p = Path(path)
              text = p.read_text()
              updated, actual = re.subn(pattern, replacement, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} regex match(es), found {actual}: {pattern!r}')
              p.write_text(updated)

          # Legacy queued requests must adopt the current site policy.
          replace(
              'RAN/Deployment/DeploymentRequest.php',
              '$legacy ? PackageArtifactLimit::DEFAULT_MAXIMUM_ARTIFACT_BYTES : $data[\'maximum_artifact_bytes\']',
              '$legacy ? PackageArtifactLimit::resolve( null ) : $data[\'maximum_artifact_bytes\']'
          )

          # Remove the accidental package-level public policy seam: Booster has a site-wide archive policy.
          replace('RAN/Package.php', '\n\tpublic function getMaximumArtifactBytes(): ?int;\n\n\tpublic function setMaximumArtifactBytes( ?int $maximumArtifactBytes ): void;\n', '\n')
          replace('RAN/AbstractPackage.php', '\n\tprotected ?int $maximumArtifactBytes         = null;', '')
          sub(
              'RAN/AbstractPackage.php',
              r'\n\tpublic function getMaximumArtifactBytes\(\): \?int \{.*?\n\t\}\n\n\tpublic function setMaximumArtifactBytes\( \?int \$maximumArtifactBytes \): void \{.*?\n\t\}\n',
              '\n'
          )
          replace(
              'RAN/AbstractPackage.php',
              '\tpublic function setRepository( ManagedRepository $repository ): void {\n\t\t$this->repository = $repository->withMaximumArtifactBytes( $this->maximumArtifactBytes );\n\t}',
              '\tpublic function setRepository( ManagedRepository $repository ): void {\n\t\t$this->repository = $repository;\n\t}'
          )

          # Resolve the site policy only at archive/native-target boundaries.
          replace(
              'RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php',
              'use RAN\\Package;\n',
              'use RAN\\Package;\nuse RAN\\PackageArtifactLimit;\n'
          )
          replace(
              'RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php',
              '$package->getRepository()->withMaximumArtifactBytes( $package->getMaximumArtifactBytes() )->reference',
              '$package->getRepository()->withMaximumArtifactBytes( PackageArtifactLimit::resolve( null ) )->reference'
          )
          replace(
              'RAN/Deployment/DeploymentCoordinator.php',
              'PackageArtifactLimit::resolve( $package->getMaximumArtifactBytes() )',
              'PackageArtifactLimit::resolve( null )'
          )
          replace(
              'RAN/WordPress/ManagedReleaseTargetRegistrar.php',
              '$package->getRepository()->reference,',
              '$package->getRepository()->withMaximumArtifactBytes( PackageArtifactLimit::resolve( null ) )->reference,',
              1
          )
          replace(
              'RAN/WordPress/ManagedReleaseTargetRegistrar.php',
              '\n\t\t$target->configureMaximumArtifactBytes( PackageArtifactLimit::resolve( $package->getMaximumArtifactBytes() ) );',
              ''
          )
          replace(
              'RAN/WordPress/ManagedReleaseTargetRegistrar.php',
              'PackageArtifactLimit::resolve( $package->getMaximumArtifactBytes() )',
              'PackageArtifactLimit::resolve( null )'
          )

          # Restore the original three-method public native-target interface.
          replace(
              'RAN/RepositoryProvider/RepositoryReleaseNativeTarget.php',
              '\t/** Configure the acquired artifact ceiling before registration. */\n\tpublic function configureMaximumArtifactBytes( int $maximumArtifactBytes ): void;\n\n',
              ''
          )
          replace(
              'RAN/Booster/GitHub/GitHubReleaseNativeTarget.php',
              '\n\tprivate int $maximumArtifactBytes = PackageArtifactLimit::DEFAULT_MAXIMUM_ARTIFACT_BYTES;\n',
              '\n'
          )
          replace(
              'RAN/Booster/GitHub/GitHubReleaseNativeTarget.php',
              '\t\tprivate string $channel,\n\t\tprivate string $deploymentPolicy\n',
              '\t\tprivate string $channel,\n\t\tprivate string $deploymentPolicy,\n\t\tprivate ?int $maximumArtifactBytes = null\n'
          )
          sub(
              'RAN/Booster/GitHub/GitHubReleaseNativeTarget.php',
              r'\n\tpublic function configureMaximumArtifactBytes\( int \$maximumArtifactBytes \): void \{.*?\n\t\}\n',
              '\n'
          )
          replace(
              'RAN/Booster/GitHub/GitHubReleaseNativeTarget.php',
              '\t\t\t\t\t$this->maximumArtifactBytes\n',
              '\t\t\t\t\tPackageArtifactLimit::resolve( $this->maximumArtifactBytes )\n'
          )

          # GitHub release operations resolve the policy only when an archive operation begins.
          replace('RAN/Booster/GitHub/GitHubProvider.php', 'use InvalidArgumentException;\n', 'use InvalidArgumentException;\nuse RAN\\PackageArtifactLimit;\n')
          replace(
              'RAN/Booster/GitHub/GitHubProvider.php',
              '\t\t\t$channel,\n\t\t\t$deploymentPolicy\n\t\t);',
              '\t\t\t$channel,\n\t\t\t$deploymentPolicy,\n\t\t\t$repository->maximumArtifactBytes\n\t\t);',
              1
          )
          replace(
              'RAN/Booster/GitHub/GitHubProvider.php',
              '$repository->maximumArtifactBytes !== ( $facts[\'maximum_artifact_bytes\'] ?? null )',
              'PackageArtifactLimit::resolve( $repository->maximumArtifactBytes ) !== ( $facts[\'maximum_artifact_bytes\'] ?? null )',
              2
          )
          replace(
              'RAN/Booster/GitHub/GitHubProvider.php',
              '$this->releaseAccessToken( $repository ), $repository->maximumArtifactBytes );',
              '$this->releaseAccessToken( $repository ), PackageArtifactLimit::resolve( $repository->maximumArtifactBytes ) );'
          )

          # Provider cleanup is idempotent and protects URL retrieval/validation too.
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\tprivate ?ProviderPreparedArchive $providerArchive = null;\n',
              '\tprivate ?ProviderPreparedArchive $providerArchive = null;\n\tprivate bool $providerArchiveCleaned = false;\n'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\tprivate function cleanupProviderArchive( ProviderPreparedArchive $archive ): void {\n\t\ttry {\n\t\t\t$archive->cleanup();\n',
              '\tprivate function cleanupProviderArchive( ProviderPreparedArchive $archive ): void {\n\t\tif ( $this->providerArchiveCleaned ) {\n\t\t\treturn;\n\t\t}\n\t\t$this->providerArchiveCleaned = true;\n\t\ttry {\n\t\t\t$archive->cleanup();\n'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\tprivate function downloadProviderArchive( ProviderPreparedArchive $archive, string $destination, int $maximumArtifactBytes ): void {\n\t\t$url = $archive->getUrl();\n\t\t$this->assertSafeHttpsUrl( $url );\n\t\ttry {',
              '\tprivate function downloadProviderArchive( ProviderPreparedArchive $archive, string $destination, int $maximumArtifactBytes ): void {\n\t\ttry {\n\t\t\t$url = $archive->getUrl();\n\t\t\t$this->assertSafeHttpsUrl( $url );'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              "isset( $parts['user'], $parts['pass'] )",
              "isset( $parts['user'] ) || isset( $parts['pass'] )"
          )

          # Centralize artifact cleanup for every host-side failure after ownership begins.
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\ttry {\n\t\t\t$artifact = new PreparedArchiveArtifact(',
              '\t\t$artifact = null;\n\t\ttry {\n\t\t\t$artifact = new PreparedArchiveArtifact('
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\t} catch ( AdmittedBranchStageFailure $failure ) {\n\t\t\tthrow $failure;\n\t\t} catch ( Throwable ) {\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_INTEGRITY_FAILED );\n\t\t}\n',
              '\t\t} catch ( AdmittedBranchStageFailure $failure ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\tif ( $artifact instanceof PreparedArchiveArtifact ) {\n\t\t\t\t$this->cleanupArtifactAfterHostFailure( $artifact );\n\t\t\t}\n\t\t\tthrow $failure;\n\t\t} catch ( Throwable ) {\n\t\t\t$this->cleanupProviderArchive( $providerArchive );\n\t\t\tif ( $artifact instanceof PreparedArchiveArtifact ) {\n\t\t\t\t$this->cleanupArtifactAfterHostFailure( $artifact );\n\t\t\t}\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_INTEGRITY_FAILED );\n\t\t}\n'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\t\t$this->cleanupArtifactAfterHostFailure( $artifact );\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_COMPRESSED_TOO_LARGE );',
              '\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_COMPRESSED_TOO_LARGE );'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\t\t$this->cleanupArtifactAfterHostFailure( $artifact );\n\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_EXPANDED_TOO_LARGE );',
              '\t\t\t$this->stage( DeploymentOutcome::CODE_ARCHIVE_EXPANDED_TOO_LARGE );'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\t$required             = intdiv( ( $expanded * 21 ) + 9, 10 );',
              '\t\t$required             = ( $expanded * 2 ) + intdiv( $expanded, 10 ) + ( 0 === $expanded % 10 ? 0 : 1 );'
          )
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\t\t\t$this->cleanupArtifactAfterHostFailure( $artifact );\n\t\t\t$this->stage( DeploymentOutcome::CODE_DEPLOYMENT_DISK_SPACE_LOW );',
              '\t\t\t$this->stage( DeploymentOutcome::CODE_DEPLOYMENT_DISK_SPACE_LOW );'
          )

          # Reuse the adapter's already-durable terminal attempt; do not perform a second DB read.
          replace(
              'RAN/Deployment/AdmittedBranchHostAdapter.php',
              '\tpublic function finish( string $code ): void {\n\t\ttry {\n\t\t\t$this->attempt = $this->attempts->finish( $this->attempt->getId(), DeploymentOutcome::fromCode( $code ) );\n\t\t} catch ( DeploymentStorageFailure $failure ) {\n\t\t\tthrow new AdmittedBranchDurabilityFailure( previous: $failure );\n\t\t}\n\t}\n',
              '\tpublic function finish( string $code ): void {\n\t\ttry {\n\t\t\t$this->attempt = $this->attempts->finish( $this->attempt->getId(), DeploymentOutcome::fromCode( $code ) );\n\t\t} catch ( DeploymentStorageFailure $failure ) {\n\t\t\tthrow new AdmittedBranchDurabilityFailure( previous: $failure );\n\t\t}\n\t}\n\n\tpublic function terminalAttempt(): DeploymentAttempt {\n\t\tif ( ! $this->attempt->getState()->isTerminal() || null === $this->attempt->getOutcome() ) {\n\t\t\tthrow DeploymentStorageFailure::inconsistent();\n\t\t}\n\n\t\treturn $this->attempt;\n\t}\n'
          )
          replace(
              'RAN/Deployment/DeploymentCoordinator.php',
              '$host->finish( $failure->outcomeCode );\n\t\t\treturn $this->finishedOutcome( $attempt->getId() );',
              '$host->finish( $failure->outcomeCode );\n\t\t\treturn $this->finishedOutcome( $host->terminalAttempt() );'
          )
          replace(
              'RAN/Deployment/DeploymentCoordinator.php',
              '$outcome = $this->finishedOutcome( $attempt->getId() );',
              '$outcome = $this->finishedOutcome( $host->terminalAttempt() );'
          )
          replace(
              'RAN/Deployment/DeploymentCoordinator.php',
              '\tprivate function finishedOutcome( int $attemptId ): DeploymentOutcome {\n\t\t$finished = $this->attempts->findExact( $attemptId );\n\t\tif ( null === $finished || ! $finished->getState()->isTerminal() ) {',
              '\tprivate function finishedOutcome( DeploymentAttempt $finished ): DeploymentOutcome {\n\t\tif ( ! $finished->getState()->isTerminal() ) {'
          )

          # Fix the release-build provenance variable typo exposed by exact-head CI.
          replace('scripts/build-release.sh', "release_release_updater_commit='dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3'", "release_updater_commit='dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3'")

          # Update the request contract test and prove legacy rows resolve current site policy.
          p = Path('tests/Deployment/DeploymentRequestTest.php')
          text = p.read_text()
          text = text.replace('testCanonicalRequestRoundTripsWithOnlyTheEightAllowedKeys', 'testCanonicalRequestRoundTripsWithOnlyTheNineAllowedKeys')
          text = text.replace("array( 'repository', 'credential_id', 'private', 'configured_branch', 'package_slug', 'subdirectory', 'deployment_policy', 'initiating_user_id' )", "array( 'repository', 'credential_id', 'private', 'configured_branch', 'package_slug', 'subdirectory', 'deployment_policy', 'initiating_user_id', 'maximum_artifact_bytes' )")
          anchor = "\tpublic function testNonCanonicalOrExtendedJsonIsRejected(): void {\n"
          legacy_test = '''\tpublic function testLegacyRequestUsesCurrentSiteArtifactLimit(): void {\n\t\t$data = $this->request()->toArray();\n\t\tunset( $data['maximum_artifact_bytes'] );\n\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.json_encode_json_encode -- The unit test exercises the runtime JSON boundary.\n\t\t$json = json_encode( $data, JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES );\n\n\t\tself::assertSame( \\RAN\\PackageArtifactLimit::resolve( null ), DeploymentRequest::fromJson( $json )->maximumArtifactBytes );\n\t}\n\n'''
          if anchor not in text:
              raise SystemExit('DeploymentRequestTest anchor unavailable')
          text = text.replace(anchor, legacy_test + anchor, 1)
          p.write_text(text)
          PY

          for file in \
            RAN/Deployment/DeploymentRequest.php \
            RAN/Package.php \
            RAN/AbstractPackage.php \
            RAN/AddOn/ReleaseTracking/NativeReleaseTrackingFacade.php \
            RAN/Deployment/DeploymentCoordinator.php \
            RAN/Deployment/AdmittedBranchHostAdapter.php \
            RAN/WordPress/ManagedReleaseTargetRegistrar.php \
            RAN/RepositoryProvider/RepositoryReleaseNativeTarget.php \
            RAN/Booster/GitHub/GitHubReleaseNativeTarget.php \
            RAN/Booster/GitHub/GitHubProvider.php \
            tests/Deployment/DeploymentRequestTest.php; do
            php -l "$file"
          done
          bash -n scripts/build-release.sh

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN scripts/build-release.sh tests/Deployment/DeploymentRequestTest.php
          git diff --cached --check
          git commit -m 'fix: address Phase C review findings'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
