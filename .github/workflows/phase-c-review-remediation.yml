name: Phase C portable archive ceiling remediation

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/phase-c-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/adopt-normalized-branch-updater
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Prepare private test temporary directory
        shell: bash
        run: |
          set -euo pipefail
          test_tmp="$RUNNER_TEMP/ran-booster-tests"
          mkdir -p "$test_tmp"
          chmod 700 "$test_tmp"
          echo "TMPDIR=$test_tmp" >> "$GITHUB_ENV"

      - name: Apply and validate portable ceiling remediation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          limit = Path('RAN/PackageArtifactLimit.php')
          source = limit.read_text()
          replacements = [
              ("\tpublic const MAXIMUM_ARTIFACT_BYTES         = 536870912;\n", "\tpublic const MAXIMUM_ARTIFACT_BYTES         = 536870911;\n", 'artifact maximum constant'),
              ("\n\tprivate const EXPANDED_RATIO = 4;\n", "", 'expanded ratio constant'),
              ("\t\t$platformMaximum = min( self::MAXIMUM_ARTIFACT_BYTES, intdiv( PHP_INT_MAX, self::EXPANDED_RATIO ) );\n", "", 'platform maximum calculation'),
              ("\t\t\t|| $value > $platformMaximum ) {\n", "\t\t\t|| $value > self::MAXIMUM_ARTIFACT_BYTES ) {\n", 'platform maximum comparison'),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'{label} did not match exactly once')
              source = source.replace(old, new)
          limit.write_text(source)

          test_content = "<?php\n\ndeclare(strict_types=1);\n\nnamespace Tests;\n\nuse InvalidArgumentException;\nuse PHPUnit\\Framework\\TestCase;\nuse RAN\\PackageArtifactLimit;\n\nfinal class PackageArtifactLimitTest extends TestCase {\n\tpublic function testPublishedMaximumFitsPinnedUpdaterExpandedCeilingOn32BitPhp(): void {\n\t\t$maximum32BitSafeCompressedBytes = intdiv( 2147483647, 4 );\n\n\t\tself::assertSame( 536870911, $maximum32BitSafeCompressedBytes );\n\t\tself::assertSame( $maximum32BitSafeCompressedBytes, PackageArtifactLimit::MAXIMUM_ARTIFACT_BYTES );\n\t\tself::assertSame(\n\t\t\t$maximum32BitSafeCompressedBytes,\n\t\t\tPackageArtifactLimit::requireValid( $maximum32BitSafeCompressedBytes )\n\t\t);\n\t}\n\n\tpublic function testExact512MiBEndpointIsRejected(): void {\n\t\t$this->expectException( InvalidArgumentException::class );\n\n\t\tPackageArtifactLimit::requireValid( 536870912 );\n\t}\n}\n"
          Path('tests/PackageArtifactLimitTest.php').write_text(test_content)

          readme = Path('README.md')
          source = readme.read_text()
          old = 'The compressed value must be an integer from 1 MiB through 512 MiB.'
          new = 'The compressed value must be an integer from 1 MiB through 536,870,911 bytes (just under 512 MiB), a ceiling that is portable across supported 32- and 64-bit PHP builds.'
          if source.count(old) != 1:
              raise SystemExit('README archive range did not match exactly once')
          readme.write_text(source.replace(old, new))

          guide = Path('docs/deployment-execution.md')
          source = guide.read_text()
          old = 'from 1 MiB through 512 MiB.'
          new = 'from 1 MiB through 536,870,911 bytes (just under 512 MiB), a ceiling that is portable across supported 32- and 64-bit PHP builds.'
          if source.count(old) != 1:
              raise SystemExit('deployment guide archive range did not match exactly once')
          guide.write_text(source.replace(old, new))

          message = Path('RAN/Admin/DeploymentOutcomeMessage.php')
          source = message.read_text()
          old = "\t\t\t'archive_limit_invalid'          => __( 'RAN_BOOSTER_MAX_ARCHIVE_BYTES is invalid. Set it in wp-config.php to an integer between 1 MiB and 512 MiB.', 'ran-booster' ),\n"
          new = "\t\t\t'archive_limit_invalid'          => __( 'RAN_BOOSTER_MAX_ARCHIVE_BYTES is invalid. Set it in wp-config.php to an integer between 1 MiB and 536,870,911 bytes (just under 512 MiB).', 'ran-booster' ),\n"
          if source.count(old) != 1:
              raise SystemExit('archive-limit outcome copy did not match exactly once')
          message.write_text(source.replace(old, new))

          test = Path('tests/Admin/DeploymentOutcomeMessageTest.php')
          source = test.read_text()
          old = "\t\tself::assertStringContainsString( '1 MiB and 512 MiB', $invalid );\n"
          new = "\t\tself::assertStringContainsString( '1 MiB and 536,870,911 bytes', $invalid );\n\t\tself::assertStringContainsString( 'just under 512 MiB', $invalid );\n"
          if source.count(old) != 1:
              raise SystemExit('archive-limit outcome assertion did not match exactly once')
          test.write_text(source.replace(old, new))
          PY

          composer install --no-interaction --prefer-dist --no-progress
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml \
            RAN/PackageArtifactLimit.php \
            RAN/Admin/DeploymentOutcomeMessage.php \
            tests/PackageArtifactLimitTest.php \
            tests/Admin/DeploymentOutcomeMessageTest.php
          phpcbf_status=$?
          set -e
          test "$phpcbf_status" -eq 0 -o "$phpcbf_status" -eq 1

          vendor/bin/phpunit --configuration phpunit.xml tests/PackageArtifactLimitTest.php --fail-on-phpunit-deprecation
          vendor/bin/phpunit --configuration phpunit.xml tests/Admin/DeploymentOutcomeMessageTest.php --fail-on-phpunit-deprecation
          vendor/bin/phpcs --standard=.phpcs.xml \
            RAN/PackageArtifactLimit.php \
            RAN/Admin/DeploymentOutcomeMessage.php \
            tests/PackageArtifactLimitTest.php \
            tests/Admin/DeploymentOutcomeMessageTest.php
          vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=2G \
            RAN/PackageArtifactLimit.php \
            RAN/Admin/DeploymentOutcomeMessage.php
          ! grep -F 'through 512 MiB' README.md
          ! grep -F 'through 512 MiB' docs/deployment-execution.md
          ! grep -F 'between 1 MiB and 512 MiB' RAN/Admin/DeploymentOutcomeMessage.php
          git diff --check

          rm .github/workflows/phase-c-review-remediation.yml
          git config user.name 'bnjmnrsh'
          git config user.email '65979639+bnjmnrsh@users.noreply.github.com'
          git add \
            RAN/PackageArtifactLimit.php \
            tests/PackageArtifactLimitTest.php \
            README.md \
            docs/deployment-execution.md \
            RAN/Admin/DeploymentOutcomeMessage.php \
            tests/Admin/DeploymentOutcomeMessageTest.php \
            .github/workflows/phase-c-review-remediation.yml
          git commit -m 'fix: publish portable archive ceiling'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
