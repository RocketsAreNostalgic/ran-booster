name: PHPCS remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 8
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2, wp-cli:2.12.0

      - name: Install PHP tooling
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fix exact PHPCS findings, refresh catalogue, and commit
        shell: bash
        env:
          RAN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RAN_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_HEAD"
          status=0
          vendor/bin/phpcbf --standard=.phpcs.xml RAN/Deployment/DeploymentRequest.php views/documentation.php || status=$?
          test "$status" -le 1
          vendor/bin/phpcs --standard=.phpcs.xml RAN/Deployment/DeploymentRequest.php views/documentation.php
          bash scripts/make-pot.sh
          git rm .github/workflows/phpcs-remediation.yml
          actual_paths="$(git diff HEAD --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/phpcs-remediation.yml' 'RAN/Deployment/DeploymentRequest.php' 'languages/ran-booster.pot' 'views/documentation.php' | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          git add RAN/Deployment/DeploymentRequest.php languages/ran-booster.pot views/documentation.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize Phase C remediation files'
          git push origin "HEAD:${RAN_HEAD_REF}"
