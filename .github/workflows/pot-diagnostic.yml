name: POT remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0

      - name: Generate, verify, and commit exact catalogue
        shell: bash
        env:
          RAN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          RAN_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RAN_EXPECTED_HEAD"
          bash scripts/make-pot.sh
          test "$(sha256sum languages/ran-booster.pot | awk '{print $1}')" = 'c448d040a568d0c4ba9269e48a7ebd7b52d635ffd389e0d8ba8db9aa125a4d8c'
          git checkout 42c4f7e276643f9954fdf6527c8bbc90f1d28dff -- scripts/make-pot.sh
          git rm .github/workflows/pot-diagnostic.yml
          actual_paths="$(git diff HEAD --name-only | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/pot-diagnostic.yml' 'languages/ran-booster.pot' 'scripts/make-pot.sh' | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
          git add languages/ran-booster.pot scripts/make-pot.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(i18n): refresh Phase C catalogue'
          git push origin "HEAD:${RAN_HEAD_REF}"
