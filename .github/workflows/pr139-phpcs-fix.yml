name: Fix PR 139 PHPCS warnings

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/pr139-phpcs-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply only autofixable PHPCS changes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'scripts/verify-runtime-dependencies.php\ntests/ReleasePlatformContractTest.php' \
            || test "$changed" = $'tests/ReleasePlatformContractTest.php\nscripts/verify-runtime-dependencies.php'
          vendor/bin/phpcs --standard=.phpcs.xml scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php
          git config user.name 'Benjamin Rush'
          git config user.email 'bnjmnrsh@gmail.com'
          git add scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php
          git commit -m 'style: normalize runtime packaging contracts'
          git push origin HEAD:refactor/runtime-packaging-policy
