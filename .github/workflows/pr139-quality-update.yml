name: Materialize bounded PR 139 Quality patch

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/pr139-quality-update.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Materialize bounded patch as ordinary text
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr139-quality-update.py
          cp .github/workflows/quality.yml quality-pr139-next.txt
          git restore .github/workflows/quality.yml .github/workflows/pr139-quality-update.yml scripts/pr139-quality-update.py tests/ReleasePlatformContractTest.php
          git diff --check -- quality-pr139-next.txt
          test "$(git status --short)" = '?? quality-pr139-next.txt'
          git config user.name 'Benjamin Rush'
          git config user.email 'bnjmnrsh@gmail.com'
          git add quality-pr139-next.txt
          git commit -m 'chore: materialize bounded Quality patch'
          git push origin HEAD:refactor/runtime-packaging-policy
