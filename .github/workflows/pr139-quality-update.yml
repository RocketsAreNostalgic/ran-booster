name: Materialize bounded PR 139 Quality patch

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/pr139-quality-update.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Materialize bounded patch as ordinary text
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr139-quality-update.py
          cp .github/workflows/quality.yml quality-pr139-next.txt
          cp tests/ReleasePlatformContractTest.php release-platform-pr139-next.txt
          cp tests/ReleaseWorkflowContractTest.php release-workflow-pr139-next.txt
          git restore \
            .github/workflows/quality.yml \
            .github/workflows/pr139-quality-update.yml \
            scripts/pr139-quality-update.py \
            tests/ReleasePlatformContractTest.php \
            tests/ReleaseWorkflowContractTest.php
          git diff --check -- \
            quality-pr139-next.txt \
            release-platform-pr139-next.txt \
            release-workflow-pr139-next.txt
          git config user.name 'Benjamin Rush'
          git config user.email 'bnjmnrsh@gmail.com'
          git add \
            quality-pr139-next.txt \
            release-platform-pr139-next.txt \
            release-workflow-pr139-next.txt
          if git diff --cached --quiet; then
            echo 'Materialized files are already current.'
            exit 0
          fi
          git commit -m 'chore: materialize bounded PR 139 workflow patch'
          git push origin HEAD:refactor/runtime-packaging-policy
