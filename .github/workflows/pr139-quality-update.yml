name: Apply bounded PR 139 Quality update

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/pr139-quality-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Apply bounded update
        run: python3 scripts/pr139-quality-update.py

      - name: Commit bounded result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'Benjamin Rush'
          git config user.email 'bnjmnrsh@gmail.com'
          git add -A
          git commit -m 'ci: align runtime packaging evidence'
          git push origin HEAD:refactor/runtime-packaging-policy
