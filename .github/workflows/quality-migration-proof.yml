name: Quality migration proof

on:
  push:
    branches:
      - chore/adopt-ran-quality-standards-phase-c

permissions:
  contents: read

jobs:
  php:
    name: Shared PHP standards proof
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Diagnose shared PHP standards on Booster surface
        run: vendor/bin/phpcs --standard=.phpcs.xml -s

  frontend:
    name: Shared frontend standards proof
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove shared frontend standards and asset tests
        run: pnpm check
