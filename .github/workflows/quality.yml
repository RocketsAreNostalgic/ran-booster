name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime-archive:
    name: Runtime archive
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
      lane: ${{ steps.archive.outputs.lane }}
      pr-base-sha: ${{ steps.archive.outputs.pr-base-sha }}
      pr-head-sha: ${{ steps.archive.outputs.pr-head-sha }}
      pr-number: ${{ steps.archive.outputs.pr-number }}
      source-commit: ${{ steps.archive.outputs.source-commit }}
      version: ${{ steps.archive.outputs.version }}
      wordpress-matrix: ${{ steps.archive.outputs.wordpress-matrix }}
    steps:
      - name: Check out exact Quality revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify exact Quality revision
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RAN_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RAN_PR_NUMBER: ${{ github.event.pull_request.number }}
          RAN_PR_USER: ${{ github.event.pull_request.user.login }}
          RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          release_branch='release-please--branches--main--components--ran-booster'
          source_commit="$RAN_SOURCE_SHA"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$source_commit"
          lane=full
          pr_number=0
          pr_base_sha=''
          pr_head_sha=''

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == "$release_branch" ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${owner}%3A${release_branch}")"
            release_pr="$(jq -cer \
              --arg bot 'github-actions[bot]' --arg head "$release_branch" --arg repository "$GITHUB_REPOSITORY" \
              '[.[] | select(.state == "open" and .merged_at == null and .base.ref == "main" and .head.ref == $head and .head.repo.full_name == $repository and .user.login == $bot)]
               | if length == 1 then .[0] else error("Expected exactly one canonical Release Please candidate.") end' <<< "$pulls")"
            pr_number="$(jq -er '.number' <<< "$release_pr")"
            pr_base_sha="$(jq -er '.base.sha' <<< "$release_pr")"
            pr_head_sha="$(jq -er '.head.sha' <<< "$release_pr")"
            test "$source_commit" = "$pr_head_sha"
            lane=release-candidate
          elif [[ "$GITHUB_EVENT_NAME" == pull_request && "$RAN_PR_USER" == 'github-actions[bot]' && "$RAN_PR_BASE_REF" == main && "$RAN_PR_HEAD_REF" == "$release_branch" && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            pr_number="$RAN_PR_NUMBER"
            pr_base_sha="$RAN_PR_BASE_SHA"
            pr_head_sha="$RAN_PR_HEAD_SHA"
            test "$source_commit" = "$pr_head_sha"
            lane=release-candidate
          fi

          if [[ "$lane" == release-candidate ]]; then
            [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
            [[ "$pr_base_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          fi
          {
            printf 'lane=%s\n' "$lane"
            printf 'pr-base-sha=%s\n' "$pr_base_sha"
            printf 'pr-head-sha=%s\n' "$pr_head_sha"
            printf 'pr-number=%s\n' "$pr_number"
            printf 'source-commit=%s\n' "$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Set up PHP for runtime archive
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Build and verify exact runtime archive
        id: archive
        shell: bash
        env:
          RAN_LANE: ${{ steps.identity.outputs.lane }}
          RAN_PR_BASE_SHA: ${{ steps.identity.outputs.pr-base-sha }}
          RAN_PR_HEAD_SHA: ${{ steps.identity.outputs.pr-head-sha }}
          RAN_PR_NUMBER: ${{ steps.identity.outputs.pr-number }}
          RAN_SOURCE_COMMIT: ${{ steps.identity.outputs.source-commit }}
        run: |
          set -euo pipefail
          lane="$RAN_LANE"
          source_commit="$RAN_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$source_commit"
          if [[ "$lane" == release-candidate ]]; then
            bash scripts/validate-release-candidate.sh "$RAN_PR_BASE_SHA" "$RAN_PR_HEAD_SHA"
          fi

          version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ran-booster.php)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(jq -er '."."' .release-please-manifest.json)" = "$version"
          test "$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*/\1/p' readme.txt)" = "$version"
          bash scripts/build-release.sh "$source_commit" "$version"

          archive="build/ran-booster-${version}.zip"
          checksum="${archive}.sha256"
          archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
          checksum_sha256="$(sha256sum "$checksum" | awk '{ print $1 }')"
          test "$(< "$checksum")" = "$(printf '%s  %s' "$archive_sha256" "$(basename "$archive")")"
          unzip -tqq "$archive"
          if unzip -Z1 "$archive" | grep -Fq 'ran-booster-fixture-provider'; then
            echo 'The runtime archive contains the test-only fixture provider.' >&2
            exit 1
          fi

          source_tree="$(git rev-parse "${source_commit}^{tree}")"
          quality_commit="$source_commit"
          jq -n --arg lane "$lane" --arg quality_commit "$quality_commit" --arg sha256 "$archive_sha256" \
            --arg source_commit "$source_commit" --arg source_tree "$source_tree" --arg version "$version" \
            --arg base_sha "$RAN_PR_BASE_SHA" --arg head_sha "$RAN_PR_HEAD_SHA" --argjson pr_number "$RAN_PR_NUMBER" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson run_id "$GITHUB_RUN_ID" \
            '{schema:"ran-booster-ci-runtime",schema_version:3,mode:"built",lane:$lane,quality_commit:$quality_commit,source_commit:$source_commit,source_tree:$source_tree,version:$version,sha256:$sha256,run:{id:$run_id,attempt:$run_attempt,event:env.GITHUB_EVENT_NAME},pull_request:{number:$pr_number,base_sha:$base_sha,head_sha:$head_sha,tested_commit:$source_commit,tested_tree:$source_tree}}' \
            > build/ran-booster-ci-runtime.json

          jq -n --arg repository "$GITHUB_REPOSITORY" --arg quality_commit "$quality_commit" --arg source_commit "$source_commit" \
            --arg tag "v${version}" --arg archive_name "$(basename "$archive")" --arg archive_sha256 "$archive_sha256" \
            --arg checksum_name "$(basename "$checksum")" --arg checksum_sha256 "$checksum_sha256" \
            '{schema:"ran-profile-b-promotion",schema_version:1,repository:$repository,quality_commit:$quality_commit,source_commit:$source_commit,tag:$tag,assets:[{name:$archive_name,sha256:$archive_sha256},{name:$checksum_name,sha256:$checksum_sha256}]}' \
            > build/ran-profile-b-promotion.json

          wordpress_matrix='{"include":[{"wordpress":"7.0","database":"MySQL 8.4","database_image":"mysql:8.4","suite":"compatibility","plugin_check":false},{"wordpress":"7.0.3","database":"MySQL 8.4","database_image":"mysql:8.4","suite":"critical","plugin_check":true},{"wordpress":"7.0.3","database":"MariaDB 10.11","database_image":"mariadb:10.11","suite":"critical","plugin_check":false},{"wordpress":"7.0.3","database":"MySQL 8.0 floor","database_image":"mysql:8.0","suite":"floor","plugin_check":false}]}'
          {
            printf 'artifact-name=ran-booster-runtime-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'archive-sha256=%s\n' "$archive_sha256"
            printf 'lane=%s\n' "$lane"
            printf 'pr-base-sha=%s\n' "$RAN_PR_BASE_SHA"
            printf 'pr-head-sha=%s\n' "$RAN_PR_HEAD_SHA"
            printf 'pr-number=%s\n' "$RAN_PR_NUMBER"
            printf 'source-commit=%s\n' "$source_commit"
            printf 'version=%s\n' "$version"
            printf 'wordpress-matrix=%s\n' "$wordpress_matrix"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: |
            build/ran-booster-${{ steps.archive.outputs.version }}.zip
            build/ran-booster-${{ steps.archive.outputs.version }}.zip.sha256
            build/ran-booster-ci-runtime.json
            build/ran-profile-b-promotion.json
          if-no-files-found: error
          retention-days: 30

  repository-quality:
      name: Repository quality
      needs: runtime-archive
      if: ${{ needs.runtime-archive.outputs.lane == 'full' }}
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      steps:
          - name: Check out repository
            uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Prepare private test temporary directory
            shell: bash
            run: |
                set -euo pipefail
                test_tmp="${HOME}/.ran-booster-tests"
                install -d -m 0700 "${test_tmp}"
                printf 'TMPDIR=%s\n' "${test_tmp}" >> "${GITHUB_ENV}"

          - name: Set up pnpm
            uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
            with:
                version: 11.7.0

          - name: Set up Node.js
            uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
            with:
                node-version-file: package.json
                cache: pnpm

          - name: Set up PHP
            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
                php-version: '8.2'
                coverage: none
                tools: composer:v2, wp-cli:2.12.0

          - name: Validate Composer configuration
            run: composer validate --strict --no-check-publish --no-check-all

          - name: Install Composer dependencies
            run: composer install --no-interaction --prefer-dist --no-progress

          - name: Verify public immutable template packs
            run: composer test:published-template-pack

          - name: Install Node.js dependencies
            run: pnpm install --frozen-lockfile

          - name: Run the complete PHP quality contract
            run: composer check

          - name: Run asset quality checks
            run: pnpm check


  wordpress-release-candidate:
      name: Release candidate install readback
      needs: runtime-archive
      if: ${{ needs.runtime-archive.outputs.lane == 'release-candidate' }}
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      services:
          mysql:
              image: mysql:8.4
              env:
                  MYSQL_DATABASE: wordpress_test
                  MYSQL_ROOT_PASSWORD: root
              ports:
                  - 3306:3306
              options: >-
                  --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=10
      steps:
          - name: Check out repository
            uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up PHP and WP-CLI
            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
                php-version: '8.2'
                coverage: none
                extensions: mysqli, zip
                tools: composer:v2, wp-cli:2.12.0

          - name: Download the verified release-candidate archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
                name: ${{ needs.runtime-archive.outputs.artifact-name }}
                path: build

          - name: Verify the release-candidate archive identity
            shell: bash
            env:
                RAN_PR_BASE_SHA: ${{ needs.runtime-archive.outputs.pr-base-sha }}
                RAN_PR_HEAD_SHA: ${{ needs.runtime-archive.outputs.pr-head-sha }}
                RAN_PR_NUMBER: ${{ needs.runtime-archive.outputs.pr-number }}
            run: |
                set -euo pipefail
                metadata='build/ran-booster-ci-runtime.json'
                archive='build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip'
                source_tree=$(git rev-parse "${RAN_PR_HEAD_SHA}^{tree}")
                tested_tree="$source_tree"
                test -f "$metadata"
                test -f "$archive"
                jq -e \
                    --arg base_sha "$RAN_PR_BASE_SHA" \
                    --arg event "$GITHUB_EVENT_NAME" \
                    --arg quality_commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                    --arg sha256 '${{ needs.runtime-archive.outputs.archive-sha256 }}' \
                    --arg source_commit "$RAN_PR_HEAD_SHA" \
                    --arg source_tree "$source_tree" \
                    --arg tested_tree "$tested_tree" \
                    --arg version '${{ needs.runtime-archive.outputs.version }}' \
                    --argjson pr_number "$RAN_PR_NUMBER" \
                    --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
                    --argjson run_id "$GITHUB_RUN_ID" \
                    '.schema == "ran-booster-ci-runtime"
                      and .schema_version == 3
                      and .mode == "built"
                      and .lane == "release-candidate"
                      and .quality_commit == $quality_commit
                      and .source_commit == $source_commit
                      and .source_tree == $source_tree
                      and .version == $version
                      and .sha256 == $sha256
                      and .run.id == $run_id
                      and .run.attempt == $run_attempt
                      and .run.event == $event
                      and .pull_request.number == $pr_number
                      and .pull_request.base_sha == $base_sha
                      and .pull_request.head_sha == $source_commit
                      and .pull_request.tested_commit == $quality_commit
                      and .pull_request.tested_tree == $tested_tree' \
                    "$metadata" >/dev/null
                printf '%s  %s\n' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$archive" \
                    | sha256sum --check --strict
                unzip -tqq "$archive"

          - name: Install WordPress 7.0.3
            run: |
                test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = '8.2'
                wp core download --path=build/wordpress --version=7.0.3
                test "$(wp core version --path=build/wordpress)" = '7.0.3'
                wp config create --path=build/wordpress --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
                wp core install --path=build/wordpress --url=http://localhost --title='RAN Booster CI' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email

          - name: Install and activate release-candidate archive
            run: |
                wp plugin install "$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip" --path=build/wordpress --activate
                wp plugin is-active ran-booster --path=build/wordpress

          - name: Read back release-candidate version, marker, and vendor
            shell: bash
            run: |
                set -euo pipefail
                archive="$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip"
                plugin_root="$GITHUB_WORKSPACE/build/wordpress/wp-content/plugins/ran-booster"
                expected_root="$GITHUB_WORKSPACE/build/ran-booster-installed-readback"

                test "$(wp plugin get ran-booster --field=version --path=build/wordpress)" = '${{ needs.runtime-archive.outputs.version }}'
                jq -e \
                    --arg version '${{ needs.runtime-archive.outputs.version }}' \
                    --arg commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                    '.schema == "ran-booster-core-release"
                      and .schema_version == 1
                      and .version == $version
                      and .commit == $commit' \
                    "$plugin_root/ran-booster-release.json" >/dev/null

                mkdir -p "$expected_root"
                unzip -q "$archive" -d "$expected_root"
                diff -qr \
                    "$expected_root/ran-booster" \
                    "$plugin_root"

  wordpress:
      name: WordPress ${{ matrix.wordpress }} / ${{ matrix.database }} / PHP 8.2
      needs:
          - runtime-archive
          - repository-quality
      if: >-
          ${{
              always()
              && needs.runtime-archive.result == 'success'
              && needs.runtime-archive.outputs.lane == 'full'
              && needs.repository-quality.result == 'success'
          }}
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      strategy:
          fail-fast: false
          matrix: ${{ fromJSON(needs.runtime-archive.outputs.wordpress-matrix) }}
      services:
          mysql:
              image: ${{ matrix.database_image }}
              env:
                  MYSQL_DATABASE: wordpress_test
                  MYSQL_ROOT_PASSWORD: root
              ports:
                  - 3306:3306
              options: >-
                  --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
                  --health-interval=10s
                  --health-timeout=5s
                  --health-retries=10
      steps:
          - name: Check out repository
            uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up PHP and WP-CLI
            uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
            with:
                php-version: '8.2'
                coverage: none
                extensions: mysqli, zip
                tools: composer:v2, wp-cli:2.12.0

          - name: Download the verified runtime archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
                name: ${{ needs.runtime-archive.outputs.artifact-name }}
                path: build

          - name: Verify the shared runtime archive identity
            shell: bash
            run: |
                set -euo pipefail
                metadata='build/ran-booster-ci-runtime.json'
                archive='build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip'
                test -f "$metadata"
                test -f "$archive"
                source_tree=$(git rev-parse '${{ needs.runtime-archive.outputs.source-commit }}^{tree}')
                jq -e \
                    --arg quality_commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                    --arg source_commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                    --arg source_tree "$source_tree" \
                    --arg version '${{ needs.runtime-archive.outputs.version }}' \
                    --arg sha256 '${{ needs.runtime-archive.outputs.archive-sha256 }}' \
                    '.schema == "ran-booster-ci-runtime"
                      and .schema_version == 3
                      and .mode == "built"
                      and .lane == "full"
                      and .quality_commit == $quality_commit
                      and .source_commit == $source_commit
                      and .source_tree == $source_tree
                      and .version == $version
                      and .sha256 == $sha256
                      and .run.id == (env.GITHUB_RUN_ID | tonumber)
                      and .run.attempt == (env.GITHUB_RUN_ATTEMPT | tonumber)
                      and .run.event == env.GITHUB_EVENT_NAME' \
                    "$metadata" >/dev/null
                printf '%s  %s\n' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$archive" \
                    | sha256sum --check --strict
                unzip -tqq "$archive"

          - name: Install WordPress ${{ matrix.wordpress }}
            run: |
                test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = '8.2'
                wp core download --path=build/wordpress --version=${{ matrix.wordpress }}
                test "$(wp core version --path=build/wordpress)" = '${{ matrix.wordpress }}'
                wp config create --path=build/wordpress --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
                wp core install --path=build/wordpress --url=http://localhost --title='RAN Booster CI' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email

          - name: Install and activate runtime archive
            run: |
                wp plugin install "$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip" --path=build/wordpress --activate
                wp plugin is-active ran-booster --path=build/wordpress

          - name: Read back the installed release identity
            shell: bash
            run: |
                set -euo pipefail

                archive="$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip"
                plugin_root="$GITHUB_WORKSPACE/build/wordpress/wp-content/plugins/ran-booster"
                expected_root="$GITHUB_WORKSPACE/build/ran-booster-installed-readback"

                test "$(wp plugin get ran-booster --field=version --path=build/wordpress)" = '${{ needs.runtime-archive.outputs.version }}'
                jq -e \
                    --arg version '${{ needs.runtime-archive.outputs.version }}' \
                    --arg commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                    '.schema == "ran-booster-core-release"
                      and .schema_version == 1
                      and .version == $version
                      and .commit == $commit' \
                    "$plugin_root/ran-booster-release.json" >/dev/null

                mkdir -p "$expected_root"
                unzip -q "$archive" -d "$expected_root"
                diff -qr \
                    "$expected_root/ran-booster" \
                    "$plugin_root"

          - name: Read back the installed GitHub provider contract
            run: wp eval-file "$GITHUB_WORKSPACE/tests/WordPress/github-provider-installed-readback.php" --path=build/wordpress

          - name: Prove installed archive localisation
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_LOCALISATION_TEST_DISPOSABLE: '1'
                RAN_BOOSTER_LOCALISATION_TEST_URL: 'http://localhost'
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: |
                printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                bash tests/WordPress/localisation-installed-smoke.sh

          - name: Prove global Core container isolation
            run: |
                wp eval '
                  if ( function_exists( "ran_booster" ) || array_key_exists( "ran_booster_instance", $GLOBALS ) ) {
                    throw new RuntimeException( "The removed global Core container acquisition path is available." );
                  }
                  if ( method_exists( RAN\Booster::class, "getInstance" ) || method_exists( RAN\Booster::class, "setInstance" ) || method_exists( RAN\Booster::class, "make" ) || method_exists( RAN\Booster::class, "bind" ) ) {
                    throw new RuntimeException( "The removed Core singleton acquisition path is available." );
                  }
                  if ( method_exists( RAN\Secrets\SecretsFile::class, "credentialMaterials" ) ) {
                    throw new RuntimeException( "The removed bulk credential enumerator is available." );
                  }
                  WP_CLI::success( "No global Core container or bulk credential enumerator is published." );
                ' --path=build/wordpress

          - name: Read back the neutral updater runtime contract
            shell: bash
            env:
                RAN_SOURCE_COMMIT: ${{ needs.runtime-archive.outputs.source-commit }}
            run: |
              set -euo pipefail
              source_commit="$RAN_SOURCE_COMMIT"
              [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]

              expected_project="$(mktemp -d)"
              composer_home="$(mktemp -d)"
              lock_file="$expected_project/composer.lock"
              policy_file="$expected_project/runtime-packaging-policy.json"
              verifier_file="$expected_project/verify-runtime-dependencies.php"
              trap 'rm -rf "$expected_project" "$composer_home"' EXIT

              git show "${source_commit}:composer.json" > "$expected_project/composer.json"
              git show "${source_commit}:composer.lock" > "$lock_file"
              git show "${source_commit}:runtime-packaging-policy.json" > "$policy_file"
              git show "${source_commit}:scripts/verify-runtime-dependencies.php" > "$verifier_file"

              projection="$(php "$verifier_file" --packaging "$lock_file" "$policy_file")"
              mapfile -t neutral_records < <(awk -F '	' '$7 == "neutral-updater" { print }' <<< "$projection")
              test "${#neutral_records[@]}" -eq 1
              IFS=$'	' read -r package_name package_version package_reference package_repository package_root surface_specs build_role <<< "${neutral_records[0]}"
              test "$build_role" = 'neutral-updater'
              [[ "$package_reference" =~ ^[0-9a-f]{40}$ ]]
              [[ "$package_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
              [[ "$package_root" == vendor/* ]]
              [[ ",$surface_specs," == *,file:runtime-copy.json,* ]]
              [[ ",$surface_specs," == *,file:runtime.php,* ]]

              runtime_version=${package_version#v}
              runtime_protocol="$(jq -er '.extra["ran-updater-runtime-protocol"] | select(type == "number" and . > 0)' "$expected_project/composer.json")"
              booster_requires_php="$(
                git show "${source_commit}:ran-booster.php" \
                  | sed -n 's/^[[:space:]]*\*[[:space:]]*Requires PHP:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p'
              )"
              booster_requires_wordpress="$(
                git show "${source_commit}:ran-booster.php" \
                  | sed -n 's/^[[:space:]]*\*[[:space:]]*Requires at least:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p'
              )"
              [[ "$booster_requires_php" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
              [[ "$booster_requires_wordpress" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
              if [[ "$booster_requires_php" =~ ^[0-9]+\.[0-9]+$ ]]; then
                booster_requires_php="${booster_requires_php}.0"
              fi
              if [[ "$booster_requires_wordpress" =~ ^[0-9]+\.[0-9]+$ ]]; then
                booster_requires_wordpress="${booster_requires_wordpress}.0"
              fi
              COMPOSER_HOME="$composer_home" composer install \
                --working-dir="$expected_project" \
                --no-dev \
                --no-interaction \
                --prefer-dist \
                --no-progress \
                --no-scripts \
                --no-plugins

              plugin_root="$GITHUB_WORKSPACE/build/wordpress/wp-content/plugins/ran-booster"
              runtime_root="$plugin_root/$package_root"
              expected_runtime_root="$expected_project/$package_root"
              runtime_copy="$runtime_root/runtime-copy.json"
              runtime_file="$runtime_root/runtime.php"
              expected_runtime_copy="$expected_runtime_root/runtime-copy.json"
              expected_runtime_file="$expected_runtime_root/runtime.php"

              test -f "$runtime_copy"
              test -f "$runtime_file"
              test -f "$expected_runtime_copy"
              test -f "$expected_runtime_file"
              cmp -s "$expected_runtime_copy" "$runtime_copy"
              cmp -s "$expected_runtime_file" "$runtime_file"
              jq -e \
                --arg version "$runtime_version" \
                --argjson protocol "$runtime_protocol" \
                '.package_version == $version
                  and .runtime_protocol == $protocol
                  and (.package_revision | type == "string" and test("^[0-9a-f]{64}$"))
                  and .runtime_file == "runtime.php"
                  and (.php_floor | type == "string" and test("^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?$"))
                  and (.wordpress_floor | type == "string" and test("^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?$"))' \
                "$runtime_copy" >/dev/null
              runtime_php_floor="$(jq -er '.php_floor' "$runtime_copy")"
              runtime_wordpress_floor="$(jq -er '.wordpress_floor' "$runtime_copy")"
              php -r 'exit( version_compare( $argv[1], $argv[2], "<=" ) ? 0 : 1 );' \
                "$runtime_php_floor" "$booster_requires_php" \
                || { echo 'Neutral updater PHP floor exceeds Booster support.' >&2; exit 1; }
              php -r 'exit( version_compare( $argv[1], $argv[2], "<=" ) ? 0 : 1 );' \
                "$runtime_wordpress_floor" "$booster_requires_wordpress" \
                || { echo 'Neutral updater WordPress floor exceeds Booster support.' >&2; exit 1; }
              grep -Fq 'RAN\WPReleaseUpdater\V1\WordPress\NativePackageUpdater' "$runtime_file"
          - name: Prove database activation and storage
            env:
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: composer test:database-storage-smoke

          - name: Prove normal managed-theme registration
            if: ${{ matrix.database == 'MySQL 8.4' }}
            env:
                RAN_BOOSTER_MANAGED_THEME_REGISTRATION_TEST_DISPOSABLE: '1'
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: |
                printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                bash tests/WordPress/managed-theme-registration-smoke.sh

          - name: Prove WordPress core package execution
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_CORE_UPDATER_TEST_DISPOSABLE: '1'
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: |
                printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                composer test:core-updater-proof
                composer test:core-package-executor

          - name: Prove installed release capability lifecycle
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_RELEASE_CAPABILITY_TEST_DISPOSABLE: '1'
                RAN_BOOSTER_RELEASE_CAPABILITY_TEST_URL: 'http://localhost'
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: |
                printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                composer test:release-capability-installed

          - name: Prove native updater-lock election
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_LOCK_RACE_TEST_DISPOSABLE: '1'
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: composer test:native-lock-race

          - name: Prove a killed worker retains post-mutation protection
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: composer test:worker-hard-stop

          - name: Prove concurrent webhook intake is idempotent
            if: ${{ matrix.suite == 'critical' }}
            env:
                RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
            run: composer test:delivery-intake-race

          - name: Exercise external provider activation orders
            if: ${{ matrix.suite == 'critical' }}
            shell: bash
            run: |
                set -euo pipefail
                wordpress="$GITHUB_WORKSPACE/build/wordpress"
                fixture_source="$GITHUB_WORKSPACE/tests/fixtures/ran-booster-fixture-provider"
                fixture_before="$wordpress/wp-content/plugins/00-ran-booster-fixture-provider"
                fixture_after="$wordpress/wp-content/plugins/zz-ran-booster-fixture-provider"
                smoke="$GITHUB_WORKSPACE/tests/WordPress/fixture-provider-smoke.php"

                cp -R "$fixture_source" "$fixture_before"
                cp -R "$fixture_source" "$fixture_after"

                wp plugin deactivate ran-booster --path="$wordpress"
                wp plugin activate 00-ran-booster-fixture-provider --path="$wordpress"
                wp plugin activate ran-booster --path="$wordpress"
                # The PHP expression is intentionally passed literally to WP-CLI.
                # shellcheck disable=SC2016
                wp eval '$active = array_flip( get_option( "active_plugins", array() ) ); if ( ! isset( $active["00-ran-booster-fixture-provider/ran-booster-fixture-provider.php"], $active["ran-booster/ran-booster.php"] ) || $active["00-ran-booster-fixture-provider/ran-booster-fixture-provider.php"] >= $active["ran-booster/ran-booster.php"] ) { throw new RuntimeException( "The fixture did not load before Booster." ); }' --path="$wordpress"
                wp eval-file "$smoke" --path="$wordpress"

                wp plugin deactivate 00-ran-booster-fixture-provider ran-booster --path="$wordpress"
                wp plugin activate ran-booster --path="$wordpress"
                wp plugin activate zz-ran-booster-fixture-provider --path="$wordpress"
                # The PHP expression is intentionally passed literally to WP-CLI.
                # shellcheck disable=SC2016
                wp eval '$active = array_flip( get_option( "active_plugins", array() ) ); if ( ! isset( $active["zz-ran-booster-fixture-provider/ran-booster-fixture-provider.php"], $active["ran-booster/ran-booster.php"] ) || $active["zz-ran-booster-fixture-provider/ran-booster-fixture-provider.php"] <= $active["ran-booster/ran-booster.php"] ) { throw new RuntimeException( "The fixture did not load after Booster." ); }' --path="$wordpress"
                wp eval-file "$smoke" --path="$wordpress"

          - name: Install Plugin Check 2.0.0
            if: ${{ matrix.plugin_check }}
            shell: bash
            run: |
                set -euo pipefail
                wp plugin install plugin-check \
                    --version=2.0.0 \
                    --path=build/wordpress \
                    --activate

                test "$(wp plugin get plugin-check --field=version --path=build/wordpress)" = '2.0.0'
                wp plugin is-active plugin-check --path=build/wordpress
                wp plugin is-active ran-booster --path=build/wordpress

          - name: Run Plugin Check
            if: ${{ matrix.plugin_check }}
            shell: bash
            run: |
                set -euo pipefail

                wordpress="$GITHUB_WORKSPACE/build/wordpress"
                plugin_check_cli="$wordpress/wp-content/plugins/plugin-check/cli.php"
                report="$RUNNER_TEMP/plugin-check-results-wp-${{ matrix.wordpress }}.json"

                test -f "$plugin_check_cli"

                set +e
                wp \
                    --path="$wordpress" \
                    --require="$plugin_check_cli" \
                    --quiet \
                    plugin check ran-booster \
                    --categories=general,security,performance,accessibility \
                    --format=strict-json \
                    --fields=file,line,column,type,code,message,docs \
                    > "$report"
                command_status=$?
                set -e

                if (( command_status != 0 )); then
                    cat "$report"
                    exit "$command_status"
                fi

                if [[ ! -s "$report" ]]; then
                    printf '[]\n' > "$report"
                fi

                jq -e 'type == "array"' "$report" > /dev/null
                cat "$report"

                errors="$(jq '[.[] | select(.type == "ERROR")] | length' "$report")"
                warnings="$(jq '[.[] | select(.type == "WARNING")] | length' "$report")"

                echo "Plugin Check reported ${errors} error(s) and ${warnings} warning(s)."

                if (( errors > 0 )); then
                    exit 1
                fi

          - name: Upload Plugin Check results
            if: ${{ always() && matrix.plugin_check }}
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
            with:
                name: plugin-check-results-wp-${{ matrix.wordpress }}-${{ matrix.database }}
                path: ${{ runner.temp }}/plugin-check-results-wp-${{ matrix.wordpress }}.json
                if-no-files-found: ignore
  quality:
    name: Quality
    if: ${{ always() }}
    needs:
      - runtime-archive
      - repository-quality
      - wordpress-release-candidate
      - wordpress
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require applicable Core quality evidence
        shell: bash
        env:
          LANE: ${{ needs.runtime-archive.outputs.lane }}
          RUNTIME_ARCHIVE_RESULT: ${{ needs.runtime-archive.result }}
          REPOSITORY_QUALITY_RESULT: ${{ needs.repository-quality.result }}
          RELEASE_CANDIDATE_RESULT: ${{ needs.wordpress-release-candidate.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress.result }}
        run: |
          set -euo pipefail
          printf 'archive=%s repository=%s candidate=%s wordpress=%s lane=%s\n' "$RUNTIME_ARCHIVE_RESULT" "$REPOSITORY_QUALITY_RESULT" "$RELEASE_CANDIDATE_RESULT" "$WORDPRESS_RESULT" "$LANE"
          test "$RUNTIME_ARCHIVE_RESULT" = success
          if [[ "$LANE" == full ]]; then
            test "$REPOSITORY_QUALITY_RESULT" = success
            test "$WORDPRESS_RESULT" = success
            test "$RELEASE_CANDIDATE_RESULT" = skipped
          elif [[ "$LANE" == release-candidate ]]; then
            test "$REPOSITORY_QUALITY_RESULT" = skipped
            test "$WORDPRESS_RESULT" = skipped
            test "$RELEASE_CANDIDATE_RESULT" = success
          else
            echo "Unsupported quality lane: $LANE" >&2
            exit 1
          fi
