name: Quality

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    runtime-archive:
        name: Runtime archive
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        outputs:
            artifact-name: ${{ steps.archive.outputs.artifact-name }}
            archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
            release-candidate: ${{ steps.archive.outputs.release-candidate }}
            source-commit: ${{ steps.archive.outputs.source-commit }}
            version: ${{ steps.archive.outputs.version }}
            wordpress-matrix: ${{ steps.archive.outputs.wordpress-matrix }}
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.2'
                  coverage: none
                  extensions: zip
                  tools: composer:v2

            - name: Build and verify the runtime archive once
              id: archive
              shell: bash
              env:
                  RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  RAN_PR_BASE: ${{ github.event.pull_request.base.ref }}
                  RAN_PR_HEAD: ${{ github.event.pull_request.head.ref }}
                  RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
              run: |
                  set -euo pipefail

                  release_candidate=false
                  if [[ "$GITHUB_EVENT_NAME" == pull_request \
                      && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
                      && "$RAN_PR_BASE" == main \
                      && "$RAN_PR_HEAD" == 'release-please--branches--main--components--ran-booster' \
                      && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                      release_candidate=true
                  fi

                  source_commit="$GITHUB_SHA"
                  if [[ "$GITHUB_EVENT_NAME" == push ]] \
                      && ! git diff --quiet "${GITHUB_SHA}^1" "$GITHUB_SHA" -- .release-please-manifest.json; then
                      source_commit="$(git rev-parse "${GITHUB_SHA}^2")"
                      test "$(git log -1 --format=%H "$GITHUB_SHA" -- .release-please-manifest.json)" = "$source_commit"
                      test "$(git rev-parse "${GITHUB_SHA}^{tree}")" = "$(git rev-parse "${source_commit}^{tree}")"
                  fi

                  version="$(git show "${source_commit}:ran-booster.php" \
                      | sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p')"
                  test -n "$version"
                  bash scripts/build-release.sh "$source_commit" "$version"

                  archive="build/ran-booster-${version}.zip"
                  if unzip -Z1 "$archive" | grep -Fq 'ran-booster-fixture-provider'; then
                      echo 'The runtime archive contains the test-only fixture provider.' >&2
                      exit 1
                  fi
                  archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
                  artifact_name="ran-booster-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

                  jq -n \
                      --arg quality_commit "$GITHUB_SHA" \
                      --arg source_commit "$source_commit" \
                      --arg version "$version" \
                      --arg sha256 "$archive_sha256" \
                      '{
                        schema: "ran-booster-ci-runtime",
                        schema_version: 1,
                        quality_commit: $quality_commit,
                        source_commit: $source_commit,
                        version: $version,
                        sha256: $sha256
                      }' > build/ran-booster-ci-runtime.json

                  if [[ "$release_candidate" == true ]]; then
                      wordpress_matrix='{"include":[{"wordpress":"7.0.3","database":"MySQL 8.4","database_image":"mysql:8.4","suite":"critical","plugin_check":true}]}'
                  else
                      wordpress_matrix='{"include":[{"wordpress":"7.0","database":"MySQL 8.4","database_image":"mysql:8.4","suite":"compatibility","plugin_check":false},{"wordpress":"7.0.3","database":"MySQL 8.4","database_image":"mysql:8.4","suite":"critical","plugin_check":true},{"wordpress":"7.0.3","database":"MariaDB 10.11","database_image":"mariadb:10.11","suite":"critical","plugin_check":false},{"wordpress":"7.0.3","database":"MySQL 8.0 floor","database_image":"mysql:8.0","suite":"floor","plugin_check":false}]}'
                  fi

                  {
                      printf 'artifact-name=%s\n' "$artifact_name"
                      printf 'archive-sha256=%s\n' "$archive_sha256"
                      printf 'release-candidate=%s\n' "$release_candidate"
                      printf 'source-commit=%s\n' "$source_commit"
                      printf 'version=%s\n' "$version"
                      printf 'wordpress-matrix=%s\n' "$wordpress_matrix"
                  } >> "$GITHUB_OUTPUT"

            - name: Upload the verified runtime archive
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.archive.outputs.artifact-name }}
                  path: |
                      build/ran-booster-${{ steps.archive.outputs.version }}.zip
                      build/ran-booster-ci-runtime.json
                  if-no-files-found: error
                  retention-days: 7

    quality:
        name: Quality
        needs: runtime-archive
        if: ${{ needs.runtime-archive.outputs.release-candidate != 'true' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Prepare private test temporary directory
              shell: bash
              run: |
                  set -euo pipefail
                  test_tmp="${HOME}/.ran-booster-tests"
                  install -d -m 0700 "${test_tmp}"
                  printf 'TMPDIR=%s\n' "${test_tmp}" >> "${GITHUB_ENV}"

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.7.0

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2

            - name: Validate Composer configuration
              run: composer validate --strict --no-check-publish --no-check-all

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Install Node.js dependencies
              run: pnpm install --frozen-lockfile

            - name: Run PHP unit and characterization tests
              run: composer test

            - name: Run PHP coding standards
              run: composer lint:php

            - name: Run asset quality checks
              run: pnpm check

            - name: Lint all PHP files
              run: find . -path './vendor' -prune -o -path './node_modules' -prune -o -path './.ran-booster-workbench' -prune -o -type f -name '*.php' -exec php -l {} \;

    wordpress:
        name: WordPress ${{ matrix.wordpress }} / ${{ matrix.database }} / PHP 8.2
        needs:
            - runtime-archive
            - quality
        if: >-
            ${{
                always()
                && needs.runtime-archive.result == 'success'
                && (
                    needs.quality.result == 'success'
                    || (
                        needs.runtime-archive.outputs.release-candidate == 'true'
                        && needs.quality.result == 'skipped'
                    )
                )
            }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.runtime-archive.outputs.wordpress-matrix) }}
        services:
            mysql:
                image: ${{ matrix.database_image }}
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
        steps:
            - name: Check out repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Set up PHP and WP-CLI
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.2'
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - name: Download the verified runtime archive
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.runtime-archive.outputs.artifact-name }}
                  path: build

            - name: Verify the shared runtime archive identity
              shell: bash
              run: |
                  set -euo pipefail
                  metadata='build/ran-booster-ci-runtime.json'
                  archive='build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip'
                  test -f "$metadata"
                  test -f "$archive"
                  jq -e \
                      --arg quality_commit "$GITHUB_SHA" \
                      --arg source_commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                      --arg version '${{ needs.runtime-archive.outputs.version }}' \
                      --arg sha256 '${{ needs.runtime-archive.outputs.archive-sha256 }}' \
                      '.schema == "ran-booster-ci-runtime"
                        and .schema_version == 1
                        and .quality_commit == $quality_commit
                        and .source_commit == $source_commit
                        and .version == $version
                        and .sha256 == $sha256' \
                      "$metadata" >/dev/null
                  printf '%s  %s\n' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$archive" \
                      | sha256sum --check --strict
                  unzip -tqq "$archive"

            - name: Install WordPress ${{ matrix.wordpress }}
              run: |
                  test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = '8.2'
                  wp core download --path=build/wordpress --version=${{ matrix.wordpress }}
                  test "$(wp core version --path=build/wordpress)" = '${{ matrix.wordpress }}'
                  wp config create --path=build/wordpress --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
                  wp core install --path=build/wordpress --url=http://localhost --title='RAN Booster CI' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email

            - name: Install and activate runtime archive
              run: |
                  wp plugin install "$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip" --path=build/wordpress --activate
                  wp plugin is-active ran-booster --path=build/wordpress

            - name: Read back the installed release identity
              shell: bash
              run: |
                  set -euo pipefail

                  archive="$GITHUB_WORKSPACE/build/ran-booster-${{ needs.runtime-archive.outputs.version }}.zip"
                  plugin_root="$GITHUB_WORKSPACE/build/wordpress/wp-content/plugins/ran-booster"
                  expected_root="$RUNNER_TEMP/ran-booster-installed-readback"

                  test "$(wp plugin get ran-booster --field=version --path=build/wordpress)" = '${{ needs.runtime-archive.outputs.version }}'
                  jq -e \
                      --arg version '${{ needs.runtime-archive.outputs.version }}' \
                      --arg commit '${{ needs.runtime-archive.outputs.source-commit }}' \
                      '.schema == "ran-booster-core-release"
                        and .schema_version == 1
                        and .version == $version
                        and .commit == $commit' \
                      "$plugin_root/ran-booster-release.json" >/dev/null

                  mkdir -p "$expected_root"
                  unzip -q "$archive" -d "$expected_root"
                  diff -qr \
                      "$expected_root/ran-booster/vendor/ran/wp-github-release-updater" \
                      "$plugin_root/vendor/ran/wp-github-release-updater"

            - name: Read back the installed GitHub provider contract
              run: wp eval-file "$GITHUB_WORKSPACE/tests/WordPress/github-provider-installed-readback.php" --path=build/wordpress

            - name: Prove global Core container isolation
              run: |
                  wp eval '
                    if ( function_exists( "ran_booster" ) || array_key_exists( "ran_booster_instance", $GLOBALS ) ) {
                      throw new RuntimeException( "The removed global Core container acquisition path is available." );
                    }
                    if ( method_exists( RAN\Booster::class, "getInstance" ) || method_exists( RAN\Booster::class, "setInstance" ) || method_exists( RAN\Booster::class, "make" ) || method_exists( RAN\Booster::class, "bind" ) ) {
                      throw new RuntimeException( "The removed Core singleton acquisition path is available." );
                    }
                    if ( method_exists( RAN\Secrets\SecretsFile::class, "credentialMaterials" ) ) {
                      throw new RuntimeException( "The removed bulk credential enumerator is available." );
                    }
                    WP_CLI::success( "No global Core container or bulk credential enumerator is published." );
                  ' --path=build/wordpress

            - name: Prove shared updater registration
              shell: bash
              run: |
                  wp eval '
                    $updater = $GLOBALS["ran_booster_release_updater"] ?? null;
                    if ( ! is_object( $updater ) || ! is_callable( array( $updater, "diagnostics" ) ) ) {
                      throw new RuntimeException( "The shared updater facade is unavailable." );
                    }
                    $diagnostics = $updater->diagnostics();
                    $expected = array(
                      "registered" => true,
                      "selection_fixed" => true,
                      "selected_version" => "2.0.0-beta.6",
                      "repository" => "RocketsAreNostalgic/ran-booster",
                      "channel" => "prerelease",
                      "type" => "plugin",
                      "package" => "ran-booster/ran-booster.php",
                      "authentication_configured" => false,
                      "private_support" => true,
                    );
                    foreach ( $expected as $key => $value ) {
                      if ( ( $diagnostics[$key] ?? null ) !== $value ) {
                        throw new RuntimeException( "Unexpected shared updater diagnostic: " . $key );
                      }
                    }
                    WP_CLI::success( "Shared updater diagnostics passed without a remote check." );
                  ' --path=build/wordpress

            - name: Prove database activation and storage
              env:
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: composer test:database-storage-smoke

            - name: Prove normal managed-theme registration
              if: ${{ matrix.database == 'MySQL 8.4' }}
              env:
                  RAN_BOOSTER_MANAGED_THEME_REGISTRATION_TEST_DISPOSABLE: '1'
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: |
                  printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                  bash tests/WordPress/managed-theme-registration-smoke.sh

            - name: Prove WordPress core package execution
              if: ${{ matrix.suite == 'critical' }}
              env:
                  RAN_BOOSTER_CORE_UPDATER_TEST_DISPOSABLE: '1'
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: |
                  printf '%s\n' 'RAN Booster disposable test site' > build/wordpress/.ran-booster-disposable-test-site
                  composer test:core-updater-proof
                  composer test:core-package-executor

            - name: Prove native updater-lock election
              if: ${{ matrix.suite == 'critical' }}
              env:
                  RAN_BOOSTER_LOCK_RACE_TEST_DISPOSABLE: '1'
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: composer test:native-lock-race

            - name: Prove a killed worker retains post-mutation protection
              if: ${{ matrix.suite == 'critical' }}
              env:
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: composer test:worker-hard-stop

            - name: Prove concurrent webhook intake is idempotent
              if: ${{ matrix.suite == 'critical' }}
              env:
                  RAN_BOOSTER_WORDPRESS_PATH: ${{ github.workspace }}/build/wordpress
              run: composer test:delivery-intake-race

            - name: Exercise external provider activation orders
              if: ${{ matrix.suite == 'critical' }}
              shell: bash
              run: |
                  set -euo pipefail
                  wordpress="$GITHUB_WORKSPACE/build/wordpress"
                  fixture_source="$GITHUB_WORKSPACE/tests/fixtures/ran-booster-fixture-provider"
                  fixture_before="$wordpress/wp-content/plugins/00-ran-booster-fixture-provider"
                  fixture_after="$wordpress/wp-content/plugins/zz-ran-booster-fixture-provider"
                  smoke="$GITHUB_WORKSPACE/tests/WordPress/fixture-provider-smoke.php"

                  cp -R "$fixture_source" "$fixture_before"
                  cp -R "$fixture_source" "$fixture_after"

                  wp plugin deactivate ran-booster --path="$wordpress"
                  wp plugin activate 00-ran-booster-fixture-provider --path="$wordpress"
                  wp plugin activate ran-booster --path="$wordpress"
                  # The PHP expression is intentionally passed literally to WP-CLI.
                  # shellcheck disable=SC2016
                  wp eval '$active = array_flip( get_option( "active_plugins", array() ) ); if ( ! isset( $active["00-ran-booster-fixture-provider/ran-booster-fixture-provider.php"], $active["ran-booster/ran-booster.php"] ) || $active["00-ran-booster-fixture-provider/ran-booster-fixture-provider.php"] >= $active["ran-booster/ran-booster.php"] ) { throw new RuntimeException( "The fixture did not load before Booster." ); }' --path="$wordpress"
                  wp eval-file "$smoke" --path="$wordpress"

                  wp plugin deactivate 00-ran-booster-fixture-provider ran-booster --path="$wordpress"
                  wp plugin activate ran-booster --path="$wordpress"
                  wp plugin activate zz-ran-booster-fixture-provider --path="$wordpress"
                  # The PHP expression is intentionally passed literally to WP-CLI.
                  # shellcheck disable=SC2016
                  wp eval '$active = array_flip( get_option( "active_plugins", array() ) ); if ( ! isset( $active["zz-ran-booster-fixture-provider/ran-booster-fixture-provider.php"], $active["ran-booster/ran-booster.php"] ) || $active["zz-ran-booster-fixture-provider/ran-booster-fixture-provider.php"] <= $active["ran-booster/ran-booster.php"] ) { throw new RuntimeException( "The fixture did not load after Booster." ); }' --path="$wordpress"
                  wp eval-file "$smoke" --path="$wordpress"

            - name: Install Plugin Check 2.0.0
              if: ${{ matrix.plugin_check }}
              shell: bash
              run: |
                  set -euo pipefail
                  wp plugin install plugin-check \
                      --version=2.0.0 \
                      --path=build/wordpress \
                      --activate

                  test "$(wp plugin get plugin-check --field=version --path=build/wordpress)" = '2.0.0'
                  wp plugin is-active plugin-check --path=build/wordpress
                  wp plugin is-active ran-booster --path=build/wordpress

            - name: Run Plugin Check
              if: ${{ matrix.plugin_check }}
              shell: bash
              run: |
                  set -euo pipefail

                  wordpress="$GITHUB_WORKSPACE/build/wordpress"
                  plugin_check_cli="$wordpress/wp-content/plugins/plugin-check/cli.php"
                  report="$RUNNER_TEMP/plugin-check-results-wp-${{ matrix.wordpress }}.json"

                  test -f "$plugin_check_cli"

                  set +e
                  wp \
                      --path="$wordpress" \
                      --require="$plugin_check_cli" \
                      --quiet \
                      plugin check ran-booster \
                      --categories=general,security,performance,accessibility \
                      --format=strict-json \
                      --fields=file,line,column,type,code,message,docs \
                      > "$report"
                  command_status=$?
                  set -e

                  if (( command_status != 0 )); then
                      cat "$report"
                      exit "$command_status"
                  fi

                  if [[ ! -s "$report" ]]; then
                      printf '[]\n' > "$report"
                  fi

                  jq -e 'type == "array"' "$report" > /dev/null
                  cat "$report"

                  errors="$(jq '[.[] | select(.type == "ERROR")] | length' "$report")"
                  warnings="$(jq '[.[] | select(.type == "WARNING")] | length' "$report")"

                  echo "Plugin Check reported ${errors} error(s) and ${warnings} warning(s)."

                  if (( errors > 0 )); then
                      exit 1
                  fi

            - name: Upload Plugin Check results
              if: ${{ always() && matrix.plugin_check }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: plugin-check-results-wp-${{ matrix.wordpress }}-${{ matrix.database }}
                  path: ${{ runner.temp }}/plugin-check-results-wp-${{ matrix.wordpress }}.json
                  if-no-files-found: ignore
