name: Rebuild shared quality locks once

on:
  push:
    branches:
      - chore/adopt-ran-quality-standards-phase-c

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.7.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.11.0'
      - run: composer update ran/coding-standards phpcompatibility/php-compatibility phpcompatibility/phpcompatibility-paragonie phpcompatibility/phpcompatibility-wp --with-dependencies --no-install --no-scripts --no-plugins --no-interaction
      - run: composer validate --strict --no-check-publish --no-check-all
      - run: grep -q '0b03e61a4bb558deeb6bc6b6399f44c0ec95e5be' composer.lock
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: grep -q '751edd097e3902efb93992bf47401a1a4f4b1fa8' pnpm-lock.yaml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock pnpm-lock.yaml
          git rm .github/workflows/rebuild-quality-locks-once.yml
          git commit -m "chore: refresh shared quality locks"
          git push origin HEAD:chore/adopt-ran-quality-standards-phase-c
