name: Refresh updater lock

on:
  push:
    branches:
      - deps/versioned-updater-graph
    paths:
      - composer.json
      - .github/workflows/refresh-updater-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: deps/versioned-updater-graph
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: sodium, zip

      - name: Regenerate updater dependency graph
        run: composer update ran/updater-support ran/wp-branch-updater --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Verify exact released identities
        run: |
          php scripts/verify-runtime-dependencies.php composer.lock
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $packages = [];
            foreach (($lock["packages"] ?? []) as $package) {
                $packages[$package["name"] ?? ""] = $package;
            }
            $expected = [
                "ran/updater-support" => ["v0.1.0-beta.2", "83384bb6f4652d8988374867f4103fde63878451"],
                "ran/wp-branch-updater" => ["v1.0.0-beta.4", "e325811348cc5e24ec2364483698533ca061cb59"],
                "ran/wp-release-updater" => ["v0.1.0-beta.4", "dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3"],
            ];
            foreach ($expected as $name => [$version, $reference]) {
                $package = $packages[$name] ?? null;
                if (!is_array($package) || ($package["version"] ?? null) !== $version || ($package["source"]["reference"] ?? null) !== $reference) {
                    fwrite(STDERR, "Unexpected locked identity for {$name}\n");
                    exit(1);
                }
            }
          '

      - name: Commit generated lock only
        run: |
          set -euo pipefail
          git status --short
          changed=$(git diff --name-only)
          test "$changed" = "composer.lock"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: refresh versioned updater lock'
          git push origin HEAD:deps/versioned-updater-graph
