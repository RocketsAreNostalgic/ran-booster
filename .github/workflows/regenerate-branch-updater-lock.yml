name: Regenerate branch updater lock

on:
  push:
    branches:
      - refactor/use-validated-expanded-archive-bytes

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'RocketsAreNostalgic/ran-booster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/use-validated-expanded-archive-bytes
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, sodium
          tools: composer:v2
          coverage: none
      - name: Regenerate only branch updater lock entry
        run: composer update ran/wp-branch-updater --no-install --no-interaction --no-progress
      - name: Commit generated lock when changed
        run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: refresh branch updater lock'
          git push origin HEAD:refactor/use-validated-expanded-archive-bytes
