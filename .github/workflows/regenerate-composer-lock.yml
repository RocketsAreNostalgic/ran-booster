name: Regenerate Composer lock

on:
  push:
    branches:
      - refactor/shared-repository-relative-path
    paths:
      - .github/workflows/regenerate-composer-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/shared-repository-relative-path
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip
          tools: composer:v2

      - name: Regenerate targeted lock entries
        run: composer update ran/updater-support ran/wp-branch-updater --with-dependencies --no-interaction --no-install

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: regenerate Composer lock'
          git push origin HEAD:refactor/shared-repository-relative-path
