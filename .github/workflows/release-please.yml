name: Release Please

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please
        if: github.event_name == 'push'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - name: Open or update the release pull request
              id: release
              uses: googleapis/release-please-action@v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    package-release:
        name: Package release
        needs: release-please
        if: >-
            always() &&
            (
              needs.release-please.outputs.release_created == 'true'
            )
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write
        env:
            TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        steps:
            - name: Check out the release tag
              uses: actions/checkout@v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ env.TAG_NAME }}

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2

            - name: Build and verify release assets
              shell: bash
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  test "${TAG_NAME}" = "v${version}"
                  bash scripts/build-release.sh HEAD "${version}"
                  bash scripts/verify-release.sh "build/ran-booster-${version}.zip" "${version}"

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >-
                  bash scripts/upload-release-assets.sh
                  "${TAG_NAME}"
                  "build/ran-booster-${TAG_NAME#v}.zip"
