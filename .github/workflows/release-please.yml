name: Release Please

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - name: Open or update the release pull request
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  skip-github-release: true

    package-release:
        name: Package release
        needs: release-please
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Check out the release commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Identify a merged Release Please version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  version="$(jq -er '."." | select(type == "string")' .release-please-manifest.json)"
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  tag="v${version}"
                  manifest_changed=true
                  git diff --quiet HEAD^ HEAD -- .release-please-manifest.json && manifest_changed=false
                  release_commit="$(git log -1 --format=%H -- .release-please-manifest.json)"
                  test "$(git show "${release_commit}:.release-please-manifest.json" | jq -er '."."')" = "$version"
                  release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
                  if release_json="$(jq -cer --arg tag "$tag" 'add | .[] | select(.tag_name == $tag)' <<< "$release_pages")"; then
                      if [[ "$(jq -er '.draft' <<< "$release_json")" == false ]]; then
                          if [[ "$(jq -er '.immutable' <<< "$release_json")" != true ]]; then
                              echo '::error::The published release is not immutable and cannot be accepted.'
                              exit 1
                          fi
                          state=published
                          release_pending=false
                      else
                          state=draft
                          release_pending=true
                      fi
                  else
                      if [[ "$manifest_changed" == false ]]; then exit 0; fi
                      state=absent
                      release_pending=true
                  fi
                  if [[ "$state" != absent ]]; then
                      test "$(jq -er '.target_commitish' <<< "$release_json")" = "$release_commit"
                  fi
                  printf 'RAN_RELEASE_VERSION=%s\nRAN_RELEASE_TAG=%s\nRAN_RELEASE_COMMIT=%s\nRAN_RELEASE_STATE=%s\nRAN_RELEASE_PENDING=%s\nRAN_RELEASE_PR_RECONCILE=true\n' "$version" "$tag" "$release_commit" "$state" "$release_pending" >> "$GITHUB_ENV"

            - name: Check out the exact release source
              if: env.RAN_RELEASE_PENDING == 'true'
              run: git checkout --detach "${RAN_RELEASE_COMMIT}"

            - name: Set up PHP
              if: env.RAN_RELEASE_PENDING == 'true'
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2

            - name: Build and verify release assets
              if: env.RAN_RELEASE_PENDING == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "${RAN_RELEASE_COMMIT}"
                  bash scripts/build-release.sh HEAD "${RAN_RELEASE_VERSION}"
                  bash scripts/verify-release.sh "build/ran-booster-${RAN_RELEASE_VERSION}.zip" "${RAN_RELEASE_VERSION}"

            - name: Create or reuse the draft and attach verified assets
              if: env.RAN_RELEASE_PENDING == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  if [[ "${RAN_RELEASE_STATE}" == absent ]]; then
                      prerelease=()
                      [[ "${RAN_RELEASE_VERSION}" == *-* ]] && prerelease=(--prerelease)
                      gh release create "${RAN_RELEASE_TAG}" --draft --target "${RAN_RELEASE_COMMIT}" --title "${RAN_RELEASE_TAG}" --generate-notes "${prerelease[@]}"
                  fi
                  bash scripts/upload-release-assets.sh \
                      "${RAN_RELEASE_TAG}" \
                      "build/ran-booster-${RAN_RELEASE_VERSION}.zip"

            - name: Publish only under the immutable-release contract
              if: env.RAN_RELEASE_PENDING == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  IMMUTABLE_RELEASES_ENABLED: ${{ vars.RAN_IMMUTABLE_RELEASES_ENABLED }}
              run: |
                  set -euo pipefail
                  if [[ "${IMMUTABLE_RELEASES_ENABLED}" != true ]]; then
                      echo '::error::Enable GitHub immutable releases and set RAN_IMMUTABLE_RELEASES_ENABLED=true. The verified release remains a draft.'
                      exit 1
                  fi
                  latest=(--latest)
                  [[ "${RAN_RELEASE_VERSION}" == *-* ]] && latest=(--prerelease)
                  gh release edit "${RAN_RELEASE_TAG}" --draft=false "${latest[@]}"
                  immutable=false
                  for delay in 0 2 2 2 2; do
                      sleep "$delay"
                      if immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}" --jq '.immutable' 2>/dev/null)" \
                          && [[ "$immutable" == true ]]; then break; fi
                  done
                  test "$immutable" = true

            - name: Mark the merged Release Please PR as tagged
              if: env.RAN_RELEASE_PR_RECONCILE == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")"
                  jq -e \
                      --arg tag "${RAN_RELEASE_TAG}" \
                      --arg commit "${RAN_RELEASE_COMMIT}" \
                      '.tag_name == $tag and .draft == false and .immutable == true and .target_commitish == $commit' \
                      <<< "$release_json" >/dev/null
                  tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"
                  jq -e \
                      --arg commit "${RAN_RELEASE_COMMIT}" \
                      '.object.type == "commit" and .object.sha == $commit' \
                      <<< "$tag_ref" >/dev/null
                  release_pr="$(
                      gh api \
                          -H 'Accept: application/vnd.github+json' \
                          "repos/${GITHUB_REPOSITORY}/commits/${RAN_RELEASE_COMMIT}/pulls" \
                      | jq -cer \
                          --arg base "${GITHUB_REF_NAME}" \
                          --arg commit "${RAN_RELEASE_COMMIT}" \
                          '[.[] | select(.merged_at != null and .base.ref == $base and .head.sha == $commit)]
                          | if length == 1 then .[0] else error("Expected exactly one merged release PR for the manifest commit.") end'
                  )"
                  release_pr_number="$(jq -er '.number' <<< "$release_pr")"
                  pending="$(jq -r 'any(.labels[]?; .name == "autorelease: pending")' <<< "$release_pr")"
                  tagged="$(jq -r 'any(.labels[]?; .name == "autorelease: tagged")' <<< "$release_pr")"
                  if [[ "$pending" != true && "$tagged" != true ]]; then
                      echo '::error::The exact merged release PR has neither the pending nor tagged Release Please label.'
                      exit 1
                  fi
                  if [[ "$tagged" != true ]]; then
                      jq -nc '{labels: ["autorelease: tagged"]}' \
                      | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}/labels" --input - >/dev/null
                      gh api "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}" \
                          --jq '[.labels[].name] | index("autorelease: tagged") != null' \
                      | grep -qx true
                  fi
                  if [[ "$pending" == true ]]; then
                      gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}/labels/autorelease%3A%20pending" >/dev/null
                  fi
                  labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}" --jq '[.labels[].name]')"
                  jq -e 'index("autorelease: tagged") != null and index("autorelease: pending") == null' <<< "$labels" >/dev/null
