name: Release Please

on:
    workflow_run:
        workflows:
            - Quality
        types:
            - completed
        branches:
            - main

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please
        if: >-
            ${{
                github.event.workflow_run.event == 'push'
                && github.event.workflow_run.conclusion == 'success'
                && github.event.workflow_run.head_branch == 'main'
                && github.event.workflow_run.head_repository.full_name == github.repository
            }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
            pull-requests: write
            issues: write
        steps:
            - name: Check out the exact Quality commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Prove an exact merged Release Please candidate before publication
              id: release-state
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$RAN_QUALITY_COMMIT"

                  if git diff --quiet "${RAN_QUALITY_COMMIT}^1" "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json; then
                      echo 'release-required=false' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  release_commit="$(git rev-parse "${RAN_QUALITY_COMMIT}^2")"
                  test "$(git log -1 --format=%H "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json)" = "$release_commit"
                  test "$(git rev-parse "${RAN_QUALITY_COMMIT}^{tree}")" = "$(git rev-parse "${release_commit}^{tree}")"

                  version="$(git show "${release_commit}:.release-please-manifest.json" \
                      | jq -er '."." | select(type == "string")')"
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  tag="v${version}"

                  release_pr="$(
                      gh api \
                          -H 'Accept: application/vnd.github+json' \
                          "repos/${GITHUB_REPOSITORY}/commits/${release_commit}/pulls" \
                      | jq -cer \
                          --arg base main \
                          --arg bot 'github-actions[bot]' \
                          --arg head 'release-please--branches--main--components--ran-booster' \
                          --arg quality "$RAN_QUALITY_COMMIT" \
                          --arg release "$release_commit" \
                          --arg repository "$GITHUB_REPOSITORY" \
                          '[.[] | select(
                              .merged_at != null
                              and .base.ref == $base
                              and .head.sha == $release
                              and .merge_commit_sha == $quality
                              and .head.ref == $head
                              and .head.repo.full_name == $repository
                              and .user.login == $bot
                          )]
                          | if length == 1 then .[0] else error("Expected exactly one merged Release Please PR for the Quality commit.") end'
                  )"
                  release_pr_number="$(jq -er '.number' <<< "$release_pr")"
                  pending="$(jq -r 'any(.labels[]?; .name == "autorelease: pending")' <<< "$release_pr")"
                  tagged="$(jq -r 'any(.labels[]?; .name == "autorelease: tagged")' <<< "$release_pr")"

                  release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
                  if release_json="$(jq -cer --arg tag "$tag" 'add | .[] | select(.tag_name == $tag)' <<< "$release_pages")"; then
                      test "$(jq -er '.target_commitish' <<< "$release_json")" = "$release_commit"
                      if [[ "$(jq -er '.draft' <<< "$release_json")" == false ]]; then
                          if [[ "$(jq -er '.immutable' <<< "$release_json")" != true ]]; then
                              echo '::error::The published release is not immutable and cannot be accepted.'
                              exit 1
                          fi
                          state=published
                          release_pending=false
                      else
                          state=draft
                          release_pending=true
                      fi
                  else
                      state=absent
                      release_pending=true
                  fi

                  if [[ "$release_pending" == true ]]; then
                      test "$pending" = true
                      test "$tagged" = false
                  elif [[ "$pending" != true && "$tagged" != true ]]; then
                      echo '::error::The published release PR has neither the pending nor tagged Release Please label.'
                      exit 1
                  fi

                  printf 'release-required=true\n' >> "$GITHUB_OUTPUT"
                  {
                      printf 'RAN_RELEASE_COMMIT=%s\n' "$release_commit"
                      printf 'RAN_RELEASE_PENDING=%s\n' "$release_pending"
                      printf 'RAN_RELEASE_PR_NUMBER=%s\n' "$release_pr_number"
                      printf 'RAN_RELEASE_STATE=%s\n' "$state"
                      printf 'RAN_RELEASE_TAG=%s\n' "$tag"
                      printf 'RAN_RELEASE_VERSION=%s\n' "$version"
                  } >> "$GITHUB_ENV"

            - name: Open or update the release pull request
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  skip-github-release: true

            - name: Download the exact archive tested by Quality
              if: steps.release-state.outputs.release-required == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ran-booster-runtime-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
                  path: build
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Verify the downloaded release identity
              if: steps.release-state.outputs.release-required == 'true'
              shell: bash
              env:
                  RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  metadata='build/ran-booster-ci-runtime.json'
                  archive="build/ran-booster-${RAN_RELEASE_VERSION}.zip"
                  test -f "$metadata"
                  test -f "$archive"
                  archive_sha256="$(jq -er '.sha256' "$metadata")"
                  jq -e \
                      --arg quality_commit "$RAN_QUALITY_COMMIT" \
                      --arg source_commit "$RAN_RELEASE_COMMIT" \
                      --arg version "$RAN_RELEASE_VERSION" \
                      '.schema == "ran-booster-ci-runtime"
                        and .schema_version == 1
                        and .quality_commit == $quality_commit
                        and .source_commit == $source_commit
                        and .version == $version
                        and (.sha256 | test("^[0-9a-f]{64}$"))' \
                      "$metadata" >/dev/null
                  printf '%s  %s\n' "$archive_sha256" "$archive" | sha256sum --check --strict
                  unzip -tqq "$archive"
                  unzip -p "$archive" ran-booster/ran-booster-release.json \
                      | jq -e \
                          --arg commit "$RAN_RELEASE_COMMIT" \
                          --arg version "$RAN_RELEASE_VERSION" \
                          '.schema == "ran-booster-core-release"
                            and .schema_version == 1
                            and .commit == $commit
                            and .version == $version' >/dev/null

            - name: Create or reuse the draft and attach verified assets
              if: steps.release-state.outputs.release-required == 'true' && env.RAN_RELEASE_PENDING == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  if [[ "$RAN_RELEASE_STATE" == absent ]]; then
                      prerelease=()
                      [[ "$RAN_RELEASE_VERSION" == *-* ]] && prerelease=(--prerelease)
                      gh release create "$RAN_RELEASE_TAG" --draft --target "$RAN_RELEASE_COMMIT" --title "$RAN_RELEASE_TAG" --generate-notes "${prerelease[@]}"
                  fi
                  bash scripts/upload-release-assets.sh \
                      "$RAN_RELEASE_TAG" \
                      "build/ran-booster-${RAN_RELEASE_VERSION}.zip"

            - name: Publish only under the immutable-release contract
              if: steps.release-state.outputs.release-required == 'true' && env.RAN_RELEASE_PENDING == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  IMMUTABLE_RELEASES_ENABLED: ${{ vars.RAN_IMMUTABLE_RELEASES_ENABLED }}
              run: |
                  set -euo pipefail
                  if [[ "$IMMUTABLE_RELEASES_ENABLED" != true ]]; then
                      echo '::error::Enable GitHub immutable releases and set RAN_IMMUTABLE_RELEASES_ENABLED=true. The verified release remains a draft.'
                      exit 1
                  fi
                  latest=(--latest)
                  [[ "$RAN_RELEASE_VERSION" == *-* ]] && latest=(--prerelease)
                  gh release edit "$RAN_RELEASE_TAG" --draft=false "${latest[@]}"
                  immutable=false
                  for delay in 0 2 2 2 2; do
                      sleep "$delay"
                      if immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}" --jq '.immutable' 2>/dev/null)" \
                          && [[ "$immutable" == true ]]; then break; fi
                  done
                  test "$immutable" = true

            - name: Read back the immutable release and reconcile its exact PR
              if: steps.release-state.outputs.release-required == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")"
                  jq -e \
                      --arg tag "$RAN_RELEASE_TAG" \
                      --arg commit "$RAN_RELEASE_COMMIT" \
                      '.tag_name == $tag and .draft == false and .immutable == true and .target_commitish == $commit' \
                      <<< "$release_json" >/dev/null
                  tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"
                  jq -e \
                      --arg commit "$RAN_RELEASE_COMMIT" \
                      '.object.type == "commit" and .object.sha == $commit' \
                      <<< "$tag_ref" >/dev/null

                  labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}" --jq '[.labels[].name]')"
                  if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
                      jq -nc '{labels: ["autorelease: tagged"]}' \
                          | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}/labels" --input - >/dev/null
                  fi
                  if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
                      gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}/labels/autorelease%3A%20pending" >/dev/null
                  fi
                  labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR_NUMBER}" --jq '[.labels[].name]')"
                  jq -e 'index("autorelease: tagged") != null and index("autorelease: pending") == null' <<< "$labels" >/dev/null
