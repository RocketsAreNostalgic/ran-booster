name: Repair PR 139 fix workflow bootstrap

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/repair-pr139-fix-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Escape the target-workflow expression and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fix-pr139-review.yml')
          text = path.read_text()
          literal = 'RAN_SOURCE_COMMIT: $' + '{{ needs.runtime-archive.outputs.source-commit }}'
          placeholder = 'RAN_SOURCE_COMMIT: __RAN_SOURCE_COMMIT_EXPRESSION__'
          if text.count(literal) != 1:
              raise SystemExit('target expression replacement count drifted')
          text = text.replace(literal, placeholder, 1)
          needle = "          text, count = readback_pattern.subn(readback, text, count=1)\n"
          insertion = "          readback = readback.replace('__RAN_SOURCE_COMMIT_EXPRESSION__', '$' + '{{ needs.runtime-archive.outputs.source-commit }}')\n" + needle
          if text.count(needle) != 1:
              raise SystemExit('readback substitution target drifted')
          path.write_text(text.replace(needle, insertion, 1))
          PY
          rm .github/workflows/repair-pr139-fix-workflow.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-pr139-review.yml .github/workflows/repair-pr139-fix-workflow.yml
          git commit -m 'ci: escape PR 139 fix workflow expression'
          git push origin HEAD:refactor/runtime-packaging-policy
