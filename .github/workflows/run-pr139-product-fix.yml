name: Run PR 139 bounded source repair

on:
  push:
    branches:
      - refactor/runtime-packaging-policy
    paths:
      - .github/workflows/run-pr139-product-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out topic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/runtime-packaging-policy
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Apply source repair
        run: python3 scripts/pr139-product-fix.py

      - name: Install tooling
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format touched PHP
        shell: bash
        run: |
          set -euo pipefail
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php
          status=$?
          set -e
          if (( status > 1 )); then exit "$status"; fi
          vendor/bin/phpcs --standard=.phpcs.xml --report=full scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php

      - name: Validate bounded changes
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/verify-runtime-dependencies.php
          bash -n scripts/build-release.sh
          bash -n scripts/verify-release.sh
          vendor/bin/phpunit --configuration phpunit.xml --filter ReleasePlatformContractTest
          php scripts/verify-runtime-dependencies.php --packaging composer.lock runtime-packaging-policy.json > /tmp/projection
          grep -F 'neutral-updater' /tmp/projection
          git diff --check

      - name: Commit bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/pr139-product-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime-packaging-policy.md runtime-packaging-policy.json scripts/build-release.sh scripts/verify-release.sh scripts/verify-runtime-dependencies.php tests/ReleasePlatformContractTest.php scripts/pr139-product-fix.py
          git commit -m 'fix: preserve runtime packaging policy boundaries'
          git push origin HEAD:refactor/runtime-packaging-policy
