name: Temporary artifact custody wiring

on:
  push:
    branches:
      - refactor/release-artifact-custody

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/release-artifact-custody
          fetch-depth: 0
      - name: Wire Core custody consumer and focused lifetime tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          facade = Path('RAN/AddOn/ReleaseTracking/NativeProspectiveReleaseFacade.php')
          text = facade.read_text()
          needle = "use RAN\\Deployment\\DeploymentPolicy;\n"
          replacement = needle + "use RAN\\Deployment\\ReleaseArtifactCustodian;\n"
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          needle = "$artifact            = $release->handoffToCore();"
          replacement = "$artifact            = ReleaseArtifactCustodian::claim( $release->handoffToCore() );"
          assert text.count(needle) == 1
          facade.write_text(text.replace(needle, replacement, 1))

          test = Path('tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php')
          text = test.read_text()
          needle = "use RAN\\Booster\\GitHub\\GitHubReleaseArtifact;\n"
          replacement = needle + "use RAN\\Deployment\\ReleaseArtifactCustodian;\n"
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          needle = "$artifact->handoffToCore()"
          count = text.count(needle)
          assert count >= 1
          test.write_text(text.replace(needle, "ReleaseArtifactCustodian::claim( $artifact->handoffToCore() )"))

          Path('.github/workflows/tmp-artifact-custody-wiring.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/AddOn/ReleaseTracking/NativeProspectiveReleaseFacade.php tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php .github/workflows/tmp-artifact-custody-wiring.yml
          git commit -m 'refactor: route release custody through Core'
          git push origin HEAD:refactor/release-artifact-custody
