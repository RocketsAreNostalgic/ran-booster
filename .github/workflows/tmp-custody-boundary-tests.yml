name: Temporary custody boundary proofs

on:
  push:
    branches:
      - refactor/release-artifact-custody

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/release-artifact-custody
          fetch-depth: 0
      - name: Align bounded custody proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('tests/Booster/GitHub/bootstrap.php')
          text = bootstrap.read_text()
          needle = "\t\tif ( 'RAN\\\\Deployment\\\\PreparedArtifact' === $class ) {\n"
          replacement = "\t\tif ( 'RAN\\\\PackageArtifactLimit' === $class ) {\n\t\t\trequire $ranBoosterRoot . '/RAN/PackageArtifactLimit.php';\n\t\t\treturn;\n\t\t}\n\t\tif ( 'RAN\\\\Deployment\\\\ReleaseArtifactCustodian' === $class ) {\n\t\t\trequire $ranBoosterRoot . '/RAN/Deployment/ReleaseArtifactCustodian.php';\n\t\t\treturn;\n\t\t}\n" + needle
          assert text.count(needle) == 1
          bootstrap.write_text(text.replace(needle, replacement, 1))

          boundary = Path('tests/Booster/GitHub/ModuleDependencyBoundaryTest.php')
          text = boundary.read_text()
          old = "\t\t'RAN\\Deployment\\PreparedArtifact',\n\t\t'RAN\\UpdaterSupport\\V1\\RepositoryRelativePath',\n"
          new = "\t\t'RAN\\UpdaterSupport\\V1\\RepositoryRelativePath',\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          needle = "\t\t'RAN\\RepositoryProvider\\RepositoryReleaseArtifact',\n"
          replacement = needle + "\t\t'RAN\\RepositoryProvider\\RepositoryReleaseArtifactCustody',\n"
          assert text.count(needle) == 1
          boundary.write_text(text.replace(needle, replacement, 1))

          acquisition = Path('tests/Booster/GitHub/ReleaseAcquisitionTest.php')
          text = acquisition.read_text()
          needle = "use RAN\\Deployment\\PreparedArtifact;\n"
          replacement = needle + "use RAN\\Deployment\\ReleaseArtifactCustodian;\n"
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          old = "\t\t$prepared = $artifact->handoffToCore();\n"
          new = "\t\t$prepared = ReleaseArtifactCustodian::claim( $artifact->handoffToCore() );\n"
          assert text.count(old) == 1
          acquisition.write_text(text.replace(old, new, 1))

          Path('.github/workflows/tmp-custody-boundary-tests.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/Booster/GitHub/bootstrap.php tests/Booster/GitHub/ModuleDependencyBoundaryTest.php tests/Booster/GitHub/ReleaseAcquisitionTest.php .github/workflows/tmp-custody-boundary-tests.yml
          git commit -m 'test: align release custody boundary proofs'
          git push origin HEAD:refactor/release-artifact-custody
