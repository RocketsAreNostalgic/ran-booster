name: Temporary custody cleanup propagation

on:
  push:
    branches:
      - refactor/release-artifact-custody

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/release-artifact-custody
          fetch-depth: 0
      - name: Propagate Core copy cleanup uncertainty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RAN/Deployment/ReleaseArtifactCustodian.php')
          text = path.read_text()

          old = "\t\t$prepared                = $custody instanceof PreparedArtifact ? $custody : null;\n\t\t$inspectionInvoked       = false;\n\t\t$sourceDiscardAttempted  = false;\n\t\t$sourceDiscardSuccessful = false;\n"
          new = "\t\t$prepared                = $custody instanceof PreparedArtifact ? $custody : null;\n\t\t$inspectionInvoked       = false;\n\t\t$sourceDiscardAttempted  = false;\n\t\t$sourceDiscardSuccessful = false;\n\t\t$copyCleanupSuccessful   = true;\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "function ( string $source ) use ( &$prepared, &$inspectionInvoked, $resolvedRef, $version, $size, $maximumArtifactBytes, $sha256 ): PreparedArtifact {"
          new = "function ( string $source ) use ( &$prepared, &$inspectionInvoked, &$copyCleanupSuccessful, $resolvedRef, $version, $size, $maximumArtifactBytes, $sha256 ): PreparedArtifact {"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "$prepared          = self::copyToCore( $source, $resolvedRef, $version, $size, $maximumArtifactBytes, $sha256 );"
          new = "$prepared          = self::copyToCore( $source, $resolvedRef, $version, $size, $maximumArtifactBytes, $sha256, $copyCleanupSuccessful );"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "\t\t\t$copyCleanupSuccessful = true;\n\t\t\tif ( $prepared instanceof PreparedArtifact ) {"
          new = "\t\t\tif ( $prepared instanceof PreparedArtifact ) {"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "\t\tint $maximumArtifactBytes,\n\t\tstring $artifactSha256\n\t): PreparedArtifact {"
          new = "\t\tint $maximumArtifactBytes,\n\t\tstring $artifactSha256,\n\t\tbool &$copyCleanupSuccessful\n\t): PreparedArtifact {"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = "\t\t$directoryIdentity = self::privateDirectoryIdentity( $directory );\n\t\tif ( null === $directoryIdentity ) {\n\t\t\tthrow new RuntimeException();\n\t\t}\n"
          new = "\t\t$directoryIdentity = self::privateDirectoryIdentity( $directory );\n\t\tif ( null === $directoryIdentity ) {\n\t\t\t$copyCleanupSuccessful = false;\n\t\t\tthrow new RuntimeException();\n\t\t}\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """\t\t} catch ( Throwable ) {\n\t\t\tself::removeCopy( $path, $directory, $directoryIdentity, $copyIdentity );\n\t\t\tthrow new RuntimeException();\n\t\t} finally {\n\t\t\tif ( is_resource( $input ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Release failed bounded-copy input.\n\t\t\t\tfclose( $input );\n\t\t\t}\n\t\t\tif ( is_resource( $output ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Release failed bounded-copy output.\n\t\t\t\tfclose( $output );\n\t\t\t}\n\t\t}\n"""
          new = """\t\t} catch ( Throwable ) {\n\t\t\t$inputClosed = true;\n\t\t\tif ( is_resource( $input ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy input before cleanup.\n\t\t\t\t$inputClosed = fclose( $input );\n\t\t\t\t$input       = false;\n\t\t\t}\n\t\t\t$outputClosed = true;\n\t\t\tif ( is_resource( $output ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy output before cleanup.\n\t\t\t\t$outputClosed = fclose( $output );\n\t\t\t\t$output       = false;\n\t\t\t}\n\n\t\t\t$copyCleanupSuccessful = $inputClosed && $outputClosed;\n\t\t\t$copyCleanupSuccessful = self::removeCopy( $path, $directory, $directoryIdentity, $copyIdentity ) && $copyCleanupSuccessful;\n\t\t\tthrow new RuntimeException();\n\t\t} finally {\n\t\t\tif ( is_resource( $input ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Release failed bounded-copy input.\n\t\t\t\tfclose( $input );\n\t\t\t}\n\t\t\tif ( is_resource( $output ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Release failed bounded-copy output.\n\t\t\t\tfclose( $output );\n\t\t\t}\n\t\t}\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          start = text.index("\tprivate static function removeCopy(")
          end = text.index("\n\t/** @return array{device:int,inode:int,owner:int,group:int}|null */", start)
          old = text[start:end]
          new = """\tprivate static function removeCopy( string $path, string $directory, array $directoryIdentity, ?array $copyIdentity ): bool {\n\t\tif ( $directoryIdentity !== self::privateDirectoryIdentity( $directory ) ) {\n\t\t\treturn false;\n\t\t}\n\t\tif ( null !== $copyIdentity ) {\n\t\t\tif ( $copyIdentity !== self::pathFileIdentity( $path ) ) {\n\t\t\t\treturn false;\n\t\t\t}\n\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.unlink_unlink -- This removes only the failed Core-owned copy.\n\t\t\tif ( ! unlink( $path ) ) {\n\t\t\t\treturn false;\n\t\t\t}\n\t\t\tclearstatcache( true, $path );\n\t\t\tif ( file_exists( $path ) || is_link( $path ) ) {\n\t\t\t\treturn false;\n\t\t\t}\n\t\t} elseif ( file_exists( $path ) || is_link( $path ) ) {\n\t\t\treturn false;\n\t\t}\n\t\tif ( $directoryIdentity !== self::privateDirectoryIdentity( $directory ) ) {\n\t\t\treturn false;\n\t\t}\n\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_rmdir -- This removes only the failed Core-owned random directory.\n\t\tif ( ! rmdir( $directory ) ) {\n\t\t\treturn false;\n\t\t}\n\t\tclearstatcache( true, $directory );\n\n\t\treturn ! file_exists( $directory ) && ! is_link( $directory );\n\t}\n"""
          text = text[:start] + new + text[end:]
          path.write_text(text)

          test = Path('tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php')
          text = test.read_text()
          old = "\t\t\t\t[ $artifact, $providerPath ]                  = $this->artifact();\n\t\t\t\t$this->expectHandoffFailure( $artifact );"
          new = "\t\t\t\t[ $artifact, $providerPath ]                  = $this->artifact();\n\t\t\t\t$this->expectHandoffFailure( $artifact, true );"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = "\t\t\t\t[ $artifact, $providerPath ]                       = $this->artifact();\n\t\t\t\t$this->expectHandoffFailure( $artifact );"
          new = "\t\t\t\t[ $artifact, $providerPath ]                       = $this->artifact();\n\t\t\t\t$this->expectHandoffFailure( $artifact, true );"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          test.write_text(text)

          Path('.github/workflows/tmp-custody-cleanup-propagation.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/Deployment/ReleaseArtifactCustodian.php tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php .github/workflows/tmp-custody-cleanup-propagation.yml
          git commit -m 'fix: propagate Core copy cleanup uncertainty'
          git push origin HEAD:refactor/release-artifact-custody