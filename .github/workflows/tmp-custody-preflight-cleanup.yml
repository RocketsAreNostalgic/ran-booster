name: Temporary custody preflight cleanup

on:
  push:
    branches:
      - refactor/release-artifact-custody

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/release-artifact-custody
          fetch-depth: 0
      - name: Put all post-handoff preflight under cleanup guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('RAN/Deployment/ReleaseArtifactCustodian.php')
          text = path.read_text()
          start = text.index("\tpublic static function claim( RepositoryReleaseArtifactCustody $custody ): PreparedArtifact {\n")
          end = text.index("\n\tprivate static function copyToCore(", start)
          replacement = base64.b64decode('').decode()
          path.write_text(text[:start] + replacement + text[end:])

          contract = Path('tests/RepositoryProvider/ProviderContractsTest.php')
          text = contract.read_text()
          needle = "use RAN\\RepositoryProvider\\RepositoryReleaseArtifact;\n"
          replacement = needle + "use RAN\\RepositoryProvider\\RepositoryReleaseArtifactCustody;\n"
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          old = "\t\t\t\\RAN\\Deployment\\PreparedArtifact::class,\n\t\t\t(string) ( new \\ReflectionMethod( RepositoryReleaseArtifact::class, 'handoffToCore' ) )->getReturnType()\n"
          new = "\t\t\tRepositoryReleaseArtifactCustody::class,\n\t\t\t(string) ( new \\ReflectionMethod( RepositoryReleaseArtifact::class, 'handoffToCore' ) )->getReturnType()\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          contract.write_text(text)

          Path('.github/workflows/tmp-custody-preflight-cleanup.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/Deployment/ReleaseArtifactCustodian.php tests/RepositoryProvider/ProviderContractsTest.php .github/workflows/tmp-custody-preflight-cleanup.yml
          git commit -m 'fix: clean custody on preflight failure'
          git push origin HEAD:refactor/release-artifact-custody
