name: Temporary final custody review fixes

on:
  push:
    branches:
      - refactor/release-artifact-custody

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refactor/release-artifact-custody
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cleanup_failure = Path('RAN/Deployment/ReleaseArtifactCleanupFailure.php')
          cleanup_failure.write_text("""<?php

          declare(strict_types=1);

          namespace RAN\\Deployment;

          use RuntimeException;

          /**
           * Core cannot prove that provisional release-artifact cleanup completed.
           */
          final class ReleaseArtifactCleanupFailure extends RuntimeException {
          \tpublic function __construct() {
          \t\tparent::__construct( 'The release artifact transfer could not be cleaned up safely.' );
          \t}
          }
          """)

          path = Path('RAN/Deployment/ReleaseArtifactCustodian.php')
          text = path.read_text()
          old = """\t\t\tthrow new RuntimeException(\n\t\t\t\t$copyCleanupSuccessful && $sourceDiscardSuccessful\n\t\t\t\t\t? 'The release artifact could not be transferred to Core.'\n\t\t\t\t\t: 'The release artifact transfer could not be cleaned up safely.'\n\t\t\t);\n"""
          new = """\t\t\tif ( $copyCleanupSuccessful && $sourceDiscardSuccessful ) {\n\t\t\t\tthrow new RuntimeException( 'The release artifact could not be transferred to Core.' );\n\t\t\t}\n\n\t\t\tthrow new ReleaseArtifactCleanupFailure();\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """\t\t\t$inputClosed = true;\n\t\t\tif ( is_resource( $input ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy input before cleanup.\n\t\t\t\t$inputClosed = fclose( $input );\n\t\t\t\t$input       = false;\n\t\t\t}\n\t\t\t$outputClosed = true;\n\t\t\tif ( is_resource( $output ) ) {\n\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy output before cleanup.\n\t\t\t\t$outputClosed = fclose( $output );\n\t\t\t\t$output       = false;\n\t\t\t}\n"""
          new = """\t\t\t$inputClosed = true;\n\t\t\tif ( is_resource( $input ) ) {\n\t\t\t\ttry {\n\t\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy input before cleanup.\n\t\t\t\t\t$inputClosed = fclose( $input );\n\t\t\t\t} catch ( Throwable ) {\n\t\t\t\t\t$inputClosed = false;\n\t\t\t\t}\n\t\t\t\t$input = false;\n\t\t\t}\n\t\t\t$outputClosed = true;\n\t\t\tif ( is_resource( $output ) ) {\n\t\t\t\ttry {\n\t\t\t\t\t// phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_fclose -- Close failed bounded-copy output before cleanup.\n\t\t\t\t\t$outputClosed = fclose( $output );\n\t\t\t\t} catch ( Throwable ) {\n\t\t\t\t\t$outputClosed = false;\n\t\t\t\t}\n\t\t\t\t$output = false;\n\t\t\t}\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('RAN/AddOn/ReleaseTracking/NativeProspectiveReleaseFacade.php')
          text = path.read_text()
          old = "use RAN\\Deployment\\ReleaseArtifactCustodian;\n"
          new = "use RAN\\Deployment\\ReleaseArtifactCleanupFailure;\nuse RAN\\Deployment\\ReleaseArtifactCustodian;\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = """\t\t} catch ( Throwable ) {\n\t\t\t$outcome = ProspectiveReleaseResult::failure( 'install_failed' );\n\t\t} finally {\n"""
          new = """\t\t} catch ( ReleaseArtifactCleanupFailure $failure ) {\n\t\t\t$finalizationFailed = true;\n\t\t\t$outcome            = ProspectiveReleaseResult::failure( 'install_failed' );\n\t\t\tBoosterLogger::logException(\n\t\t\t\t'prospective release Core artifact cleanup failed',\n\t\t\t\t$failure,\n\t\t\t\tarray( 'step' => 'prospective_release_cleanup' )\n\t\t\t);\n\t\t} catch ( Throwable ) {\n\t\t\t$outcome = ProspectiveReleaseResult::failure( 'install_failed' );\n\t\t} finally {\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/Booster/GitHub/ReleaseArtifactFilesystemFunctions.php')
          text = path.read_text()
          text += """

          /** @param resource $stream */
          function fclose( $stream ): bool {
          \t$remaining = (int) ( $GLOBALS['ran_booster_custody_fclose_failures'] ?? 0 );
          \tif ( $remaining > 0 ) {
          \t\t$GLOBALS['ran_booster_custody_fclose_failures'] = $remaining - 1;
          \t\tthrow new \\RuntimeException( 'Test-only stream close failure.' );
          \t}

          \treturn \\fclose( $stream );
          }
          """
          path.write_text(text)

          path = Path('tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php')
          text = path.read_text()
          marker = """\t#[RunInSeparateProcess]\n\t#[PreserveGlobalState( false )]\n\tpublic function testFirstFailedHandoffDiscardCannotBeHiddenByRetry(): void {\n"""
          test = """\t#[RunInSeparateProcess]\n\t#[PreserveGlobalState( false )]\n\tpublic function testThrownStreamCloseStillAttemptsCoreCopyCleanup(): void {\n\t\t$this->resetFilesystemHooks();\n\t\t$random       = str_repeat( \"\\x35\", 16 );\n\t\t$directory    = sys_get_temp_dir() . '/ran-booster-release-' . bin2hex( $random );\n\t\t$archive      = $directory . '/archive.zip';\n\t\t$providerPath = $this->archivePath();\n\n\t\ttry {\n\t\t\t$GLOBALS['ran_booster_custody_random_bytes']    = $random;\n\t\t\t$GLOBALS['ran_booster_custody_fclose_failures'] = 1;\n\t\t\t$digest = hash_file( 'sha256', $providerPath ); // phpcs:ignore WordPress.WP.AlternativeFunctions.file_system_operations_hash_file -- Test-only artifact identity.\n\t\t\tself::assertIsString( $digest );\n\t\t\t$artifact = new GitHubReleaseArtifact(\n\t\t\t\tnew StructuralReleaseArtifact( $providerPath ),\n\t\t\t\t'1.2.3',\n\t\t\t\tstr_repeat( 'a', 40 ),\n\t\t\t\t'example',\n\t\t\t\t'example.php',\n\t\t\t\tstrlen( 'verified-release-archive' ) - 1,\n\t\t\t\t52428800,\n\t\t\t\t$digest\n\t\t\t);\n\t\t\t$this->expectHandoffFailure( $artifact, true );\n\n\t\t\tself::assertFileDoesNotExist( $providerPath );\n\t\t\tself::assertFileDoesNotExist( $archive );\n\t\t\tself::assertDirectoryDoesNotExist( $directory );\n\t\t} finally {\n\t\t\t$this->resetFilesystemHooks();\n\t\t\t$this->removeExactPath( $providerPath );\n\t\t\t$this->removeExactPath( $archive );\n\t\t\t$this->removeExactDirectory( $directory );\n\t\t}\n\t}\n\n"""
          assert text.count(marker) == 1
          text = text.replace(marker, test + marker, 1)
          old = """\t\t\t$GLOBALS['ran_booster_custody_after_source_open'],\n\t\t\t$GLOBALS['ran_booster_custody_after_destination_open']\n"""
          new = """\t\t\t$GLOBALS['ran_booster_custody_after_source_open'],\n\t\t\t$GLOBALS['ran_booster_custody_after_destination_open'],\n\t\t\t$GLOBALS['ran_booster_custody_fclose_failures']\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/Booster/GitHub/bootstrap.php')
          text = path.read_text()
          old = """\t\tif ( 'RAN\\\\Deployment\\\\ReleaseArtifactCustodian' === $class ) {\n\t\t\trequire $ranBoosterRoot . '/RAN/Deployment/ReleaseArtifactCustodian.php';\n\t\t\treturn;\n\t\t}\n"""
          new = old + """\t\tif ( 'RAN\\\\Deployment\\\\ReleaseArtifactCleanupFailure' === $class ) {\n\t\t\trequire $ranBoosterRoot . '/RAN/Deployment/ReleaseArtifactCleanupFailure.php';\n\t\t\treturn;\n\t\t}\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('tests/AddOn/NativeProspectiveReleaseFacadeTest.php')
          text = path.read_text()
          old = "use RAN\\Deployment\\PreparedArtifact;\n"
          new = "use RAN\\Deployment\\PreparedArtifact;\nuse RAN\\Deployment\\ReleaseArtifactCleanupFailure;\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = """\tpublic function testSuccessfulInstallUsesCoreExecutorAndAdoptsReleaseAssetWithManualPolicy(): void {\n"""
          test = """\tpublic function testCoreCustodyCleanupFailureIsPreservedThroughInstallFacade(): void {\n\t\t$plugins  = new ProspectivePluginRepository();\n\t\t$executor = new ProspectiveExecutor();\n\t\t$lock     = new ProspectiveUpdaterLock();\n\t\t$facade   = $this->facade( $plugins, $executor, 7, $lock );\n\t\t$this->setReadyRelease();\n\t\tself::assertNotNull( $this->acquisition );\n\t\t$this->acquisition->handoffFailure = new ReleaseArtifactCleanupFailure();\n\n\t\t$result = $facade->install(\n\t\t\t'plugin',\n\t\t\t$this->repositoryRequest(),\n\t\t\t'42',\n\t\t\t'v1.2.3',\n\t\t\tself::FINGERPRINT,\n\t\t\t'stable',\n\t\t\t'valid-nonce'\n\t\t);\n\n\t\tself::assertFalse( $result->successful() );\n\t\tself::assertSame( 'installation_cleanup_failed', $result->code() );\n\t\tself::assertSame( 0, $executor->installCalls );\n\t\tself::assertSame( 0, $plugins->adoptionCalls );\n\t\tself::assertSame( 1, $this->acquisition->handoffCalls );\n\t\tself::assertSame( 1, $this->acquisition->discardCalls );\n\t\tself::assertSame( 1, $lock->releaseCalls );\n\t\tself::assertFileDoesNotExist( (string) $this->artifactPath );\n\t}\n\n"""
          assert text.count(marker) == 1
          text = text.replace(marker, test + marker, 1)
          old = """\tpublic bool $discardResult = true;\n\tprivate bool $handedOff    = false;\n"""
          new = """\tpublic bool $discardResult = true;\n\tpublic ?Throwable $handoffFailure = null;\n\tprivate bool $handedOff    = false;\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = """\t\t++$this->handoffCalls;\n\t\t$identity = PreparedArtifact::regularFileIdentity( $this->path );\n"""
          new = """\t\t++$this->handoffCalls;\n\t\tif ( null !== $this->handoffFailure ) {\n\t\t\tthrow $this->handoffFailure;\n\t\t}\n\t\t$identity = PreparedArtifact::regularFileIdentity( $this->path );\n"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/tmp-final-custody-review-fixes.yml').unlink()
          PY
          php -l RAN/Deployment/ReleaseArtifactCleanupFailure.php
          php -l RAN/Deployment/ReleaseArtifactCustodian.php
          php -l RAN/AddOn/ReleaseTracking/NativeProspectiveReleaseFacade.php
          php -l tests/Booster/GitHub/ReleaseArtifactFilesystemFunctions.php
          php -l tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php
          php -l tests/Booster/GitHub/bootstrap.php
          php -l tests/AddOn/NativeProspectiveReleaseFacadeTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/Deployment/ReleaseArtifactCleanupFailure.php RAN/Deployment/ReleaseArtifactCustodian.php RAN/AddOn/ReleaseTracking/NativeProspectiveReleaseFacade.php tests/Booster/GitHub/ReleaseArtifactFilesystemFunctions.php tests/Booster/GitHub/ReleaseArtifactClaimLifetimeTest.php tests/Booster/GitHub/bootstrap.php tests/AddOn/NativeProspectiveReleaseFacadeTest.php .github/workflows/tmp-final-custody-review-fixes.yml
          git commit -m 'fix: preserve custody cleanup uncertainty'
          git push origin HEAD:refactor/release-artifact-custody