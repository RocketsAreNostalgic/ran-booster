name: Temporary PR 116 provider boundary fix

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-boundary-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove deployment-limit policy from repository identity
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet refactor/adopt-normalized-branch-updater
          python3 - <<'PY'
          from pathlib import Path

          # RepositoryReference keeps the concrete credential-cloning seam, but no deployment policy.
          p = Path('RAN/RepositoryProvider/RepositoryReference.php')
          s = p.read_text()
          s = s.replace("use RAN\\PackageArtifactLimit;\n", "")
          s = s.replace("\tpublic ?int $maximumArtifactBytes;\n", "")
          s = s.replace("\t\tpublic ?string $credentialId,\n\t\t?int $maximumArtifactBytes = null\n", "\t\tpublic ?string $credentialId\n")
          s = s.replace("\t\t$this->locator              = RepositoryLocator::requireValid( $locator );\n\t\t$this->maximumArtifactBytes = PackageArtifactLimit::requireValidOverride( $maximumArtifactBytes );\n", "\t\t$this->locator = RepositoryLocator::requireValid( $locator );\n")
          s = s.replace("\t\t\t$this->private,\n\t\t\t$credentialId,\n\t\t\t$this->maximumArtifactBytes\n", "\t\t\t$this->private,\n\t\t\t$credentialId\n")
          p.write_text(s)

          # ManagedRepository likewise returns to identity-only construction.
          p = Path('RAN/ManagedRepository.php')
          s = p.read_text()
          s = s.replace("\t\tbool $private = false,\n\t\t?string $credentialId = null,\n\t\t?int $maximumArtifactBytes = null\n", "\t\tbool $private = false,\n\t\t?string $credentialId = null\n")
          s = s.replace("\t\t$this->reference = new RepositoryReference( $locator, $providerRepositoryId, $private, $credentialId, $maximumArtifactBytes );\n", "\t\t$this->reference = new RepositoryReference( $locator, $providerRepositoryId, $private, $credentialId );\n")
          start = s.find("\n\tpublic function withMaximumArtifactBytes(")
          if start != -1:
              end = s.find("\n\tpublic function __toString()", start)
              if end == -1:
                  raise SystemExit('ManagedRepository helper end not found')
              s = s[:start] + s[end:]
          p.write_text(s)

          # GitHub release handling keeps its existing public contract and bounded module dependency set.
          p = Path('RAN/Booster/GitHub/GitHubProvider.php')
          s = p.read_text()
          s = s.replace("use RAN\\PackageArtifactLimit;\n", "")
          s = s.replace("\t\t\t$channel,\n\t\t\t$deploymentPolicy,\n\t\t\t$repository->maximumArtifactBytes\n", "\t\t\t$channel,\n\t\t\t$deploymentPolicy\n")
          s = s.replace("PackageArtifactLimit::resolve( $repository->maximumArtifactBytes ) !== ( $facts['maximum_artifact_bytes'] ?? null )", "52428800 !== ( $facts['maximum_artifact_bytes'] ?? null )")
          s = s.replace("PackageArtifactLimit::resolve( $repository->maximumArtifactBytes ) );", "52428800 );")
          p.write_text(s)

          # Managed release registration must not manufacture a deployment-limit-bearing repository identity.
          p = Path('RAN/WordPress/ManagedReleaseTargetRegistrar.php')
          s = p.read_text()
          s = s.replace("use RAN\\PackageArtifactLimit;\n", "")
          s = s.replace("$package->getRepository()->withMaximumArtifactBytes( PackageArtifactLimit::resolve( null ) )->reference", "$package->getRepository()->reference")
          s = s.replace("\n\t\t\t'maximum_artifact_bytes' => PackageArtifactLimit::resolve( null ),", "")
          p.write_text(s)
          PY
          php -l RAN/RepositoryProvider/RepositoryReference.php
          php -l RAN/ManagedRepository.php
          php -l RAN/Booster/GitHub/GitHubProvider.php
          php -l RAN/WordPress/ManagedReleaseTargetRegistrar.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/RepositoryProvider/RepositoryReference.php RAN/ManagedRepository.php RAN/Booster/GitHub/GitHubProvider.php RAN/WordPress/ManagedReleaseTargetRegistrar.php
          git commit -m 'fix: keep deployment limits out of repository identity'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
