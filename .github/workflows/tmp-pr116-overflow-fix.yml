name: Temporary PR 116 overflow fix

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-overflow-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply overflow-safe disk calculation
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet refactor/adopt-normalized-branch-updater
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RAN/Deployment/AdmittedBranchHostAdapter.php')
          s = path.read_text()
          old = """\t\t$required             = ( $expanded * 2 ) + intdiv( $expanded, 10 ) + ( 0 === $expanded % 10 ? 0 : 1 );\n\t\t$upgradeAvailable     = defined( 'WP_CONTENT_DIR' ) ? disk_free_space( WP_CONTENT_DIR ) : false;\n"""
          new = """\t\t$overhead = intdiv( $expanded, 10 ) + ( 0 === $expanded % 10 ? 0 : 1 );\n\t\tif ( $expanded > intdiv( PHP_INT_MAX - $overhead, 2 ) ) {\n\t\t\t$this->stage( DeploymentOutcome::CODE_DEPLOYMENT_DISK_SPACE_LOW );\n\t\t}\n\t\t$required             = ( $expanded * 2 ) + $overhead;\n\t\t$upgradeAvailable     = defined( 'WP_CONTENT_DIR' ) ? disk_free_space( WP_CONTENT_DIR ) : false;\n"""
          if old not in s:
              raise SystemExit('target arithmetic block not found')
          path.write_text(s.replace(old, new, 1))
          PY
          php -l RAN/Deployment/AdmittedBranchHostAdapter.php
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/Deployment/AdmittedBranchHostAdapter.php
          git commit -m 'fix: guard archive disk arithmetic on 32-bit PHP'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
