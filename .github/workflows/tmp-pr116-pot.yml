name: Temporary PR 116 POT refresh

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-pot.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli:2.12.0
      - name: Refresh committed catalogue
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet refactor/adopt-normalized-branch-updater
          ./scripts/make-pot.sh
          ./scripts/make-pot.sh --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add languages/ran-booster.pot
          if git diff --cached --quiet; then
            echo 'Catalogue already current.'
            exit 0
          fi
          git commit -m 'chore: refresh gettext catalogue'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
