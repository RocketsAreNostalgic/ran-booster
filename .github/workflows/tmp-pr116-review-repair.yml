name: Temporary PR 116 review repair

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/adopt-normalized-branch-updater
      - name: Restore fail-closed runtime archive verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-release.sh')
          s = path.read_text()

          roots = """release_package_root='vendor/ran/wp-release-updater'\nbranch_package_root='vendor/ran/wp-branch-updater'\nsupport_package_root='vendor/ran/updater-support'\n"""
          replacement_roots = roots + "release_updater_commit='dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3'\n"
          if roots not in s:
              raise SystemExit('package root marker not found')
          s = s.replace(roots, replacement_roots, 1)
          s = s.replace('${updater_commit}', '${release_updater_commit}')
          s = s.replace('$updater_commit', '$release_updater_commit')

          marker = """if ! dependency_records=$(php \"$repo_root/scripts/verify-runtime-dependencies.php\" \"$composer_dir/composer.lock\"); then\n\tfail 'composer.lock does not contain the exact approved runtime dependency set.'\nfi\n\nfor required_path in \\\n"""
          if marker not in s:
              raise SystemExit('dependency marker not found')

          restored = r'''if ! dependency_records=$(php "$repo_root/scripts/verify-runtime-dependencies.php" "$composer_dir/composer.lock"); then
	fail 'composer.lock does not contain the exact approved runtime dependency set.'
fi

for required_path in \
	"$release_installed_package/LICENSE" \
	"$release_installed_package/bootstrap.php" \
	"$release_installed_package/runtime-copy.json" \
	"$release_installed_package/runtime.php" \
	"$release_installed_package/src" \
	"$branch_installed_package/LICENSE" \
	"$branch_installed_package/bootstrap.php" \
	"$branch_installed_package/src" \
	"$support_installed_package/LICENSE" \
	"$support_installed_package/src"; do
	[[ -e "$required_path" ]] || fail "locked runtime package is missing: $required_path"
done
if find \
	"$release_installed_package/LICENSE" "$release_installed_package/bootstrap.php" "$release_installed_package/runtime-copy.json" "$release_installed_package/runtime.php" "$release_installed_package/src" \
	"$branch_installed_package/LICENSE" "$branch_installed_package/bootstrap.php" "$branch_installed_package/src" \
	"$support_installed_package/LICENSE" "$support_installed_package/src" \
	-type l -print -quit | grep -q .; then
	fail 'runtime dependency allowlist must not contain symbolic links.'
fi

archive_paths="$tmp_dir/archive-paths.txt"
archive_files="$tmp_dir/archive-files.txt"
expected_files="$tmp_dir/expected-files.txt"
expected_paths="$tmp_dir/expected-paths.txt"
entries_file="$tmp_dir/entries.txt"
contents_file="$tmp_dir/archive-contents.bin"

unzip -Z1 "$archive" > "$archive_paths"
[[ -s "$archive_paths" ]] || fail 'archive is empty.'
grep -Fqx 'ran-booster/' "$archive_paths" \
	|| fail 'archive must contain exactly one ran-booster/ root.'

while IFS= read -r path || [[ -n "$path" ]]; do
	[[ "$path" == ran-booster/* ]] \
		|| fail "path is outside the ran-booster/ root: $path"
	[[ "$path" != *\\* && "$path" != *'//'* ]] \
		|| fail "unsafe archive path: $path"
	relative=${path#ran-booster/}
	[[ -z "$relative" || ( "$relative" != '..' && "$relative" != ../* && "$relative" != */../* && "$relative" != */.. ) ]] \
		|| fail "unsafe archive path: $path"

	case "$relative" in
		AGENTS.md|AGENTS.md/*|.agents|.agents/*|.dex|.dex/*|ran-booster-workbench|ran-booster-workbench/*|.github|.github/*|tests|tests/*|scripts|scripts/*|build|build/*|node_modules|node_modules/*|README.md|CHANGELOG.md|release-files.txt|release-please-config.json|.release-please-manifest.json|package.json|pnpm-lock.yaml|composer.json|composer.lock|.ran-booster|.ran-booster/*|secrets.json|*/secrets.json|secrets.json.lock|*/secrets.json.lock|boosterlog|*.log|*.zip|*.tar|*.tar.gz|*.tgz)
			fail "development, secret, log, or archive path is forbidden: $path"
			;;
		vendor|vendor/|vendor/ran|vendor/ran/)
			;;
		vendor/*)
			allowed_vendor=false
			for package_root in "$support_package_root" "$branch_package_root" "$release_package_root"; do
				if [[ "$relative" == "$package_root" || "$relative" == "$package_root/" || "$relative" == "$package_root/"* ]]; then
					allowed_vendor=true
					break
				fi
			done
			[[ "$allowed_vendor" == true ]] || fail "unexpected vendor path is forbidden: $path"
			;;
	esac
done < "$archive_paths"

if zipinfo -l "$archive" | awk '$1 ~ /^l/ { found = 1 } END { exit !found }'; then
	fail 'release archive must not contain symbolic links.'
fi

while IFS= read -r entry || [[ -n "$entry" ]]; do
	[[ -z "$entry" || "$entry" == \#* ]] && continue
	[[ "$entry" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unsafe allowlist path: $entry"
	allowed=false
	for expected in "${allowed_entries[@]}"; do
		if [[ "$entry" == "$expected" ]]; then
			allowed=true
			break
		fi
	done
	[[ "$allowed" == true ]] || fail "unexpected runtime allowlist entry: $entry"
	grep -Fqx "$entry" "$entries_file" 2>/dev/null && fail "duplicate allowlist entry: $entry"
	printf '%s\n' "$entry" >> "$entries_file"
done < "$manifest"

[[ $(awk 'END { print NR }' "$entries_file") -eq ${#allowed_entries[@]} ]] \
	|| fail 'release-files.txt does not contain the complete runtime allowlist.'
for required in "${allowed_entries[@]}"; do
	grep -Fqx "$required" "$entries_file" || fail "required allowlist entry is missing: $required"
done

while IFS= read -r tree_entry; do
	mode=${tree_entry%% *}
	[[ "$mode" != '120000' ]] || fail 'release files must not contain symbolic links.'
done < <(git ls-tree -r "$commit" -- "${committed_entries[@]}")

git ls-tree -r --name-only "$commit" -- "${committed_entries[@]}" \
	| sed 's#^#ran-booster/#' > "$expected_files"

append_runtime_files() {
	local installed_root=$1
	local package_root=$2
	shift 2
	local package_entry
	for package_entry in "$@"; do
		if [[ -d "$installed_root/$package_entry" ]]; then
			find "$installed_root/$package_entry" -type f -print
		else
			printf '%s\n' "$installed_root/$package_entry"
		fi
	done | sed "s#^$installed_root/#ran-booster/$package_root/#" >> "$expected_files"
}
append_runtime_files "$support_installed_package" "$support_package_root" LICENSE src
append_runtime_files "$branch_installed_package" "$branch_package_root" LICENSE bootstrap.php src
append_runtime_files "$release_installed_package" "$release_package_root" LICENSE bootstrap.php runtime-copy.json runtime.php src
printf '%s\n' 'ran-booster/ran-booster-release.json' >> "$expected_files"
LC_ALL=C sort -o "$expected_files" "$expected_files"
grep -v '/$' "$archive_paths" | LC_ALL=C sort > "$archive_files"

diff -u "$expected_files" "$archive_files" >/dev/null \
	|| fail 'archive files do not exactly match committed Core plus the locked runtime dependency allowlist.'

printf '%s\n' 'ran-booster/' > "$expected_paths"
while IFS= read -r expected_file; do
	printf '%s\n' "$expected_file" >> "$expected_paths"
	parent=${expected_file%/*}
	while [[ "$parent" != 'ran-booster' ]]; do
		printf '%s/\n' "$parent" >> "$expected_paths"
		parent=${parent%/*}
	done
done < "$expected_files"
LC_ALL=C sort -u -o "$expected_paths" "$expected_paths"
LC_ALL=C sort -u -o "$archive_paths" "$archive_paths"
diff -u "$expected_paths" "$archive_paths" >/dev/null \
	|| fail 'archive contains an unexpected file or directory path.'

for required_path in \
'''
          s = s.replace(marker, restored, 1)
          path.write_text(s)
          PY
          bash -n scripts/verify-release.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-release.sh
          git commit -m 'fix: restore runtime archive verification'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
