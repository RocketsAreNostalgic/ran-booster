name: Temporary PR 116 shell remediation

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-shell-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refactor/adopt-normalized-branch-updater
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('RAN/Deployment/AdmittedBranchHostAdapter.php')
          text = adapter.read_text()
          old = "\t\t\t$request->private,\n\t\t\t$request->credentialId,\n\t\t\t$request->maximumArtifactBytes\n\t\t);"
          new = "\t\t\t$request->private,\n\t\t\t$request->credentialId\n\t\t);"
          if old not in text:
              raise SystemExit('ManagedRepository adoption constructor pattern was not found')
          adapter.write_text(text.replace(old, new, 1))

          provider = Path('RAN/Booster/GitHub/GitHubProvider.php')
          text = provider.read_text()
          marker = "use InvalidArgumentException;\n"
          if marker not in text:
              raise SystemExit('GitHubProvider import marker was not found')
          text = text.replace(marker, marker + "use RAN\\PackageArtifactLimit;\n", 1)
          inspect = "$result = $this->releaseSource( $packageType, $repository, $channel )->inspect( $providerReleaseId, $tag );"
          acquire = "$result = $this->releaseSource( $packageType, $repository, $channel )->acquire( $providerReleaseId, $tag, $expectedFingerprint );"
          signature = "private function releaseSource( string $packageType, RepositoryReference $repository, string $channel ): object {"
          registrar = "\t\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), 52428800 );"
          for required in (inspect, acquire, signature, registrar):
              if required not in text:
                  raise SystemExit('Expected GitHub release-limit pattern was not found')
          if text.count("|| 52428800 !== ( $facts['maximum_artifact_bytes'] ?? null )") != 2:
              raise SystemExit('Expected two release evidence limit checks')
          text = text.replace(inspect, "$maximumArtifactBytes = PackageArtifactLimit::resolve( null );\n\t\t\t$result = $this->releaseSource( $packageType, $repository, $channel, $maximumArtifactBytes )->inspect( $providerReleaseId, $tag );", 1)
          text = text.replace(acquire, "$maximumArtifactBytes = PackageArtifactLimit::resolve( null );\n\t\t\t$result = $this->releaseSource( $packageType, $repository, $channel, $maximumArtifactBytes )->acquire( $providerReleaseId, $tag, $expectedFingerprint );", 1)
          text = text.replace("|| 52428800 !== ( $facts['maximum_artifact_bytes'] ?? null )", "|| $maximumArtifactBytes !== ( $facts['maximum_artifact_bytes'] ?? null )")
          text = text.replace(signature, "private function releaseSource( string $packageType, RepositoryReference $repository, string $channel, ?int $maximumArtifactBytes = null ): object {", 1)
          text = text.replace(registrar, "\t\t$maximumArtifactBytes = PackageArtifactLimit::resolve( $maximumArtifactBytes );\n\t\treturn $this->registrar->releases( 'github', $packageType, $repository->locator, $repositoryId, $channel, $this->releaseAccessToken( $repository ), $maximumArtifactBytes );", 1)
          provider.write_text(text)

          test = Path('tests/Deployment/AdmittedBranchExecutionTest.php')
          text = test.read_text()
          imports = "use RAN\\Storage\\Database;\nuse RAN\\Storage\\PluginRepository;"
          if imports not in text:
              raise SystemExit('Admitted test import marker was not found')
          text = text.replace(imports, "use RAN\\Storage\\Database;\nuse RAN\\Storage\\PackageMutationResult;\nuse RAN\\Storage\\PackageStorageOperation;\nuse RAN\\Storage\\PluginRepository;", 1)
          insertion = "\tpublic function testConcreteAdapterUsesTheSharedWordPressUpdaterLock(): void {"
          if insertion not in text:
              raise SystemExit('Admitted test insertion point was not found')
          method = """\tpublic function testConcreteAdapterAdoptsWithoutEmbeddingArchivePolicyInRepositoryIdentity(): void {
\t\t$adapter     = $this->adapter( $this->runningUpdate(), new ProviderRegistry() );
\t\t$declaration = $adapter->declaration();

\t\tself::assertTrue( $adapter->adopt( $declaration ) );
\t\t$adopted = $this->plugins->adopted;
\t\tself::assertInstanceOf( Plugin::class, $adopted );
\t\tself::assertSame( 'gh', $adopted->getProviderCode() );
\t\tself::assertSame( 'R_example', $adopted->getProviderRepositoryId() );
\t\tself::assertSame( 'owner/example', $adopted->getRepository() );
\t\tself::assertSame( 'main', $adopted->getBranch() );
\t\tself::assertSame( DeploymentPolicy::AUTOMATIC, $adopted->getDeploymentPolicy() );
\t}

"""
          text = text.replace(insertion, method + insertion, 1)
          repo_old = """final class BoundaryPluginRepository extends PluginRepository {
\tpublic ?Plugin $package = null;
\tpublic function __construct() {}
\tpublic function fromSlug( $slug ) {
\t\treturn $this->package ?? throw new RuntimeException( 'Missing test plugin.' );
\t}
\tpublic function boosterPluginFromFile( $file ) {
\t\treturn $this->package ?? throw new RuntimeException( 'Missing test plugin.' );
\t}
}"""
          if repo_old not in text:
              raise SystemExit('Boundary plugin repository marker was not found')
          repo_new = """final class BoundaryPluginRepository extends PluginRepository {
\tpublic ?Plugin $package = null;
\tpublic ?Plugin $adopted = null;
\tpublic function __construct() {}
\tpublic function allDeploymentPlugins( ?\\RAN\\PackageSource $source = null ): array {
\t\treturn null === $this->package ? array() : array( 'example/example.php' => $this->package );
\t}
\tpublic function fromSlug( $slug ) {
\t\treturn $this->package ?? throw new RuntimeException( 'Missing test plugin.' );
\t}
\tpublic function boosterPluginFromFile( $file ) {
\t\treturn $this->package ?? throw new RuntimeException( 'Missing test plugin.' );
\t}
\tpublic function adopt( Plugin $plugin ): PackageMutationResult {
\t\t$this->adopted = $plugin;
\t\t$this->package = $plugin;
\t\treturn PackageMutationResult::changed( PackageStorageOperation::UPDATE );
\t}
}"""
          test.write_text(text.replace(repo_old, repo_new, 1))
          PY

          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit --configuration phpunit.xml tests/Deployment/AdmittedBranchExecutionTest.php
          curl -fsSL -o /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod 0755 /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          wp --version | grep -Fx 'WP-CLI 2.12.0'
          bash scripts/make-pot.sh
          bash scripts/make-pot.sh --check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAN/Deployment/AdmittedBranchHostAdapter.php RAN/Booster/GitHub/GitHubProvider.php tests/Deployment/AdmittedBranchExecutionTest.php languages/ran-booster.pot
          git commit -m 'fix: close Phase C review gaps'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
