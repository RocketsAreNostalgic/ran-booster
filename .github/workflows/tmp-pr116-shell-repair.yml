name: Temporary PR 116 shell repair

on:
  push:
    branches:
      - refactor/adopt-normalized-branch-updater
    paths:
      - .github/workflows/tmp-pr116-shell-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Repair verifier and push product commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet refactor/adopt-normalized-branch-updater
          git fetch --quiet origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('scripts/verify-release.sh')
          s = path.read_text()
          main = subprocess.check_output(['git', 'show', 'origin/main:scripts/verify-release.sh'], text=True)

          roots = "release_package_root='vendor/ran/wp-release-updater'\nbranch_package_root='vendor/ran/wp-branch-updater'\nsupport_package_root='vendor/ran/updater-support'\n"
          if roots not in s:
              raise SystemExit('runtime package roots not found')
          s = s.replace(roots, roots + "release_updater_commit='dcd9ce2ca20769dc35d6b6bfd46042c17aa53bd3'\n", 1)
          s = s.replace('${updater_commit}', '${release_updater_commit}').replace('$updater_commit', '$release_updater_commit')

          start = main.index('archive_paths="$tmp_dir/archive-paths.txt"')
          end = main.index('for required_path in \\\n', start)
          block = main[start:end]

          old_vendor = '''\t\tvendor/*)\n\t\t\t[[ "$relative" == "$package_root" || "$relative" == "$package_root/" || "$relative" == "$package_root/"* ]] \\\n\t\t\t\t|| fail "unexpected vendor path is forbidden: $path"\n\t\t\t;;\n'''
          new_vendor = '''\t\tvendor/*)\n\t\t\tallowed_vendor=false\n\t\t\tfor package_root in "$support_package_root" "$branch_package_root" "$release_package_root"; do\n\t\t\t\tif [[ "$relative" == "$package_root" || "$relative" == "$package_root/" || "$relative" == "$package_root/"* ]]; then\n\t\t\t\t\tallowed_vendor=true\n\t\t\t\t\tbreak\n\t\t\t\tfi\n\t\t\tdone\n\t\t\t[[ "$allowed_vendor" == true ]] || fail "unexpected vendor path is forbidden: $path"\n\t\t\t;;\n'''
          if old_vendor not in block:
              raise SystemExit('baseline vendor guard not found')
          block = block.replace(old_vendor, new_vendor, 1)

          old_files = '''for package_entry in LICENSE bootstrap.php runtime-copy.json runtime.php src; do\n\tif [[ -d "$installed_package/$package_entry" ]]; then\n\t\tfind "$installed_package/$package_entry" -type f -print\n\telse\n\t\tprintf '%s\\n' "$installed_package/$package_entry"\n\tfi\ndone \\\n\t| sed "s#^$installed_package/#ran-booster/$package_root/#" \\\n\t>> "$expected_files"\n'''
          new_files = '''append_runtime_files() {\n\tlocal installed_root=$1\n\tlocal package_root=$2\n\tshift 2\n\tlocal package_entry\n\tfor package_entry in "$@"; do\n\t\tif [[ -d "$installed_root/$package_entry" ]]; then\n\t\t\tfind "$installed_root/$package_entry" -type f -print\n\t\telse\n\t\t\tprintf '%s\\n' "$installed_root/$package_entry"\n\t\tfi\n\tdone | sed "s#^$installed_root/#ran-booster/$package_root/#" >> "$expected_files"\n}\nappend_runtime_files "$support_installed_package" "$support_package_root" LICENSE src\nappend_runtime_files "$branch_installed_package" "$branch_package_root" LICENSE bootstrap.php src\nappend_runtime_files "$release_installed_package" "$release_package_root" LICENSE bootstrap.php runtime-copy.json runtime.php src\n'''
          if old_files not in block:
              raise SystemExit('baseline expected package files block not found')
          block = block.replace(old_files, new_files, 1)
          block = block.replace('locked updater runtime allowlist', 'locked runtime dependency allowlist')

          validation = '''for required_runtime_path in \\\n\t"$release_installed_package/LICENSE" \\\n\t"$release_installed_package/bootstrap.php" \\\n\t"$release_installed_package/runtime-copy.json" \\\n\t"$release_installed_package/runtime.php" \\\n\t"$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" \\\n\t"$branch_installed_package/bootstrap.php" \\\n\t"$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" \\\n\t"$support_installed_package/src"; do\n\t[[ -e "$required_runtime_path" ]] || fail "locked runtime package is missing: $required_runtime_path"\ndone\nif find \\\n\t"$release_installed_package/LICENSE" "$release_installed_package/bootstrap.php" "$release_installed_package/runtime-copy.json" "$release_installed_package/runtime.php" "$release_installed_package/src" \\\n\t"$branch_installed_package/LICENSE" "$branch_installed_package/bootstrap.php" "$branch_installed_package/src" \\\n\t"$support_installed_package/LICENSE" "$support_installed_package/src" \\\n\t-type l -print -quit | grep -q .; then\n\tfail 'runtime dependency allowlist must not contain symbolic links.'\nfi\n\n'''

          marker = '''if ! dependency_records=$(php "$repo_root/scripts/verify-runtime-dependencies.php" "$composer_dir/composer.lock"); then\n\tfail 'composer.lock does not contain the exact approved runtime dependency set.'\nfi\n\nfor required_path in \\\n'''
          if marker not in s:
              raise SystemExit('current dependency marker not found')
          s = s.replace(marker, marker[:-len('for required_path in \\\n')] + validation + block + 'for required_path in \\\n', 1)
          path.write_text(s)
          PY
          bash -n scripts/verify-release.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-release.sh
          git commit -m 'fix: restore fail-closed runtime archive verification'
          git push origin HEAD:refactor/adopt-normalized-branch-updater
