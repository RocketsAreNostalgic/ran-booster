name: Tooling PHPCBF parity 116

on:
  push:
    branches:
      - tooling/phpcbf-parity-116

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          ini-file: production

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format, verify, and materialize scoped files
        shell: bash
        run: |
          set +e
          vendor/bin/phpcbf --standard=.phpcs.xml \
            tests/Deployment/AdmittedBranchHostAdapterParityTest.php \
            tests/Deployment/AdmittedBranchHostAdapterWordPressFunctions.php
          status=$?
          set -e

          git diff --check
          vendor/bin/phpcs --standard=.phpcs.xml \
            tests/Deployment/AdmittedBranchHostAdapterParityTest.php \
            tests/Deployment/AdmittedBranchHostAdapterWordPressFunctions.php

          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

          if git diff --quiet -- \
            tests/Deployment/AdmittedBranchHostAdapterParityTest.php \
            tests/Deployment/AdmittedBranchHostAdapterWordPressFunctions.php; then
            echo 'Scoped files already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/Deployment/AdmittedBranchHostAdapterParityTest.php \
            tests/Deployment/AdmittedBranchHostAdapterWordPressFunctions.php
          git commit -m 'tooling: materialize PHPCBF output'
          git push origin HEAD:tooling/phpcbf-parity-116
