packages:
  - '.'

enableGlobalVirtualStore: false
pmOnFail: error
updateNotifier: false
verifyDepsBeforeRun: error

allowBuilds:
  core-js: false
  esbuild: true
  unrs-resolver: false

overrides:
  # Fixes GHSA-g3hv-75wg-m249 (minimatch < 11.0.1). Remove once
  # @typescript-eslint/typescript-estree itself depends on minimatch >= 11.0.1.
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
